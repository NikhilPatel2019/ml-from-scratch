<script>
/* Runs before the body paints: a saved theme applied from app.js at the end of
   the document would flash the other theme first. No saved value means no
   attribute, which leaves prefers-color-scheme in charge. */
(function () {
  try {
    var t = localStorage.getItem("mlfs:theme:v1");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
