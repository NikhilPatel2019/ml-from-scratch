/* ============================================================

}

}

/* ============================================================
   shell + rail
   ============================================================ */
.shell {
  display: grid;
  grid-template-columns: 306px minmax(0, 1fr) auto;
  max-width: 1580px; margin: 0 auto; align-items: start;
}

.rail {
  position: sticky; top: var(--topbar-h);

}

  display: flex; align-items: center; gap: 9px; width: 100%;

}

.home-ico::before, .home-ico::after {
  content: ""; position: absolute; left: 4px; right: 4px; height: 1.5px;
  background: var(--ink-3); border-radius: 1px;
}
.home-ico::before { top: 6px; }
.home-ico::after { top: 11px; right: 8px; }
.rail-home.current .home-ico { border-color: var(--accent); background: var(--surface); }

.rail-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 8px 10px; }

.phase-block { margin-bottom: 6px; }

/* 24x24 hit area, 16x16 visual — WCAG 2.5.8 asks for the first, the list

.tickbox {

}
.tickbox::before {

  transition: background .15s, border-color .15s;
}
.tickbox:hover::before { border-color: var(--done); }
.tickbox:checked::before { background: var(--done); border-color: var(--done); }
.tickbox:checked::after {
  content: ""; position: absolute; left: 10px; top: 7px; width: 4px; height: 8px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(42deg);

/* ============================================================
   pane
   ============================================================ */

.wrap { max-width: 800px; }

.hero h1 { font-size: clamp(34px, 5vw, 52px); letter-spacing: -.02em; margin: 10px 0 0; }

.tick { height: 30px; width: 4px; border-radius: 1.5px; background: var(--rule); transition: background .25s; }

.btn {
  appearance: none; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent);

  cursor: pointer; white-space: nowrap; transition: filter .15s;
}

.section { margin-top: 52px; }

.steps { display: grid; gap: 1px; margin-top: 22px; background: var(--rule); border: 1px solid var(--rule); border-radius: 11px; overflow: hidden; }

/* ============================================================
   lesson
   ============================================================ */
.lesson-head { border-bottom: 1px solid var(--rule); padding-bottom: 22px; margin-bottom: 30px; }

.chip.ready { background: var(--accent-wash); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 32%, transparent); }

.lesson-head h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; }
.lesson-head .lede { font-size: 17px; color: var(--ink-2); margin-top: 12px; max-width: 60ch; }

/* lesson tabs */
.tabs {
  display: flex; gap: 2px; margin-bottom: 30px;
  border-bottom: 1px solid var(--rule);
  position: sticky; top: var(--topbar-h); z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  font-family: var(--f-body); font-size: 14px; font-weight: 500;
  color: var(--ink-3); padding: 12px 15px 11px; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s, border-color .15s;

.tab:hover { color: var(--ink); }

.panel[hidden] { display: none !important; }

.prose .lead {
  font-size: 18.5px; line-height: 1.6; color: var(--ink-2);
  max-width: 62ch; margin-bottom: 1.4em;
}

  display: grid; gap: 1px; margin-top: 1.6em;

  font-family: var(--f-mono); font-size: 11.5px; font-weight: 600;

}
.oc h3 { font-family: var(--f-body); font-size: 14.5px; font-weight: 600; margin: 0; }
.oc p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.55; max-width: 62ch; }

.prose { font-size: 16.5px; line-height: 1.72; color: var(--ink); }

.codeblock .cap {

input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

.result .track > i { display: block; height: 100%; background: var(--ink-3); border-radius: 3px; transition: width .25s; }
.result.top .track > i { background: var(--accent); }

{"phases":[{"id":"p0","number":0,"title":"Foundations","subtitle":"the maths, built in code","blurb":"All of machine learning stands on four ideas: vectors, matrix multiplication, the derivative, and probability. Learn these properly and the rest of the field is recombination. We learn them by writing them, not by reading proofs.","milestone":"Minimise a function you have never seen before, from scratch, and explain every line.","lessons":[{"id":"0.1","title":"Vectors and the dot product","summary":"Python and NumPy essentials, what a vector really is, and the single operation that everything else is built from.","status":"available"},{"id":"0.2","title":"Vector geometry","summary":"Length, distance, angle, cosine similarity, projection. Why 'similarity' turns out to be a geometry problem.","status":"planned"},{"id":"0.3","title":"Matrices as data","summary":"Shape, indexing, slicing, broadcasting, transpose. Thinking in two dimensions without loops.","status":"planned"},{"id":"0.4","title":"Matrices as transformations","summary":"Matrix multiplication as a function that moves space. This is the one that makes neural networks click.","status":"planned"},{"id":"0.5","title":"Systems, inverses, and rank","summary":"Solving Ax = b, the cases where you cannot, and what 'singular' actually means.","status":"planned"},{"id":"0.6","title":"Functions and slopes","summary":"The derivative discovered numerically, in code, before a single symbol of calculus notation.","status":"planned"},{"id":"0.7","title":"Derivative rules","summary":"Power, product and quotient rules — and the handful of derivatives you will actually reuse forever.","status":"planned"},{"id":"0.8","title":"The chain rule","summary":"The most important single fact in deep learning. Backpropagation is the chain rule and nothing more.","status":"planned"},{"id":"0.9","title":"Partial derivatives and the gradient","summary":"Calculus in many dimensions, and what it means to point downhill in 4096-dimensional space.","status":"planned"},{"id":"0.10","title":"Gradient descent","summary":"Implement it, watch it converge, then deliberately break it and learn why it diverged.","status":"planned"},{"id":"0.11","title":"Probability I","summary":"Random variables, distributions, expectation and variance — the language uncertainty is written in.","status":"planned"},{"id":"0.12","title":"Probability II","summary":"Bayes' theorem, likelihood, and the derivation of where loss functions actually come from.","status":"planned"},{"id":"0.13","title":"The statistics you need","summary":"The normal distribution, sampling, correlation, and the traps that catch practitioners.","status":"planned"}]},{"id":"p1","number":1,"title":"Classical Machine Learning","subtitle":"where every core concept is easiest to see","blurb":"Most industry ML is still this. It is also where loss, overfitting, evaluation and regularisation are visible in two dimensions, before deep learning hides them behind a billion parameters.","milestone":"Take a raw, messy CSV to a validated and honestly-evaluated model, and defend every choice you made.","lessons":[{"id":"1.1","title":"What 'learning' actually is","summary":"The universal recipe underneath every model in this repository: data, model, loss, optimiser.","status":"planned"},{"id":"1.2","title":"Linear regression from scratch","summary":"Both routes: the closed-form solution, and gradient descent. Then why anyone bothers with the second.","status":"planned"},{"id":"1.3","title":"Making training work","summary":"Feature scaling, learning rates, and how to debug a model that will not converge.","status":"planned"},{"id":"1.4","title":"Logistic regression","summary":"The sigmoid, decision boundaries, and cross-entropy loss — classification from first principles.","status":"planned"},{"id":"1.5","title":"Overfitting and the bias-variance tradeoff","summary":"Train/validation/test, cross-validation, and why your model looked brilliant right up until it shipped.","st <template id="lesson-0.1-lesson">
<div class="prose">

<h2>Why we start here</h2>

<p>Strip away every buzzword and machine learning is three claims:</p>

<ol>
  <li><strong>Anything can be turned into a list of numbers.</strong> A house, a customer, a photograph, the word "banana".</li>
  <li><strong>Once things are lists of numbers, "similar" and "different" become arithmetic</strong> — and arithmetic is something a computer does a trillion times a second.</li>
  <li><strong>A model is a large pile of numbers that you adjust until its outputs stop being wrong.</strong></li>
</ol>

<p>Phase 0 makes claims 1 and 2 concrete. Today is claim 1, plus the single operation that claim 2 rests on.</p>

<p>That operation is the <strong>dot product</strong>. To be precise about how central it is: a neuron in a neural network is a dot product followed by one simple function. Attention — the mechanism behind every modern large language model — is dot products. Semantic search is dot products. When a model has 175 billion parameters and needs a GPU cluster, what that hardware is doing, almost exclusively, is dot products.</p>

<p>There is no second idea in this field of comparable importance. You will implement it today in about four lines.</p>

<h2>The Python you need</h2>

<p>If you already program, only the deltas matter:</p>

<div class="codeblock">
<div class="cap">Python, for people who already program</div>
<pre><code class="language-python">xs = [1, 2, 3]              # list: dynamically sized, heterogeneous, indexed from 0
xs[-1]                      # 3  — negative indices count from the end
xs[0:2]                     # [1, 2] — slice, end-exclusive
len(xs)                     # 3

def f(a: list[float]) -> float:   # type hints exist but are NOT enforced.
    return a[0]                   # they are documentation; the runtime ignores them.

d = {"a": 1, "b": 2}        # dict
for k in d: ...             # iterates KEYS, not pairs
for x in xs: ...            # no index — this is the idiomatic loop
for i in range(len(xs)): .. # only when you genuinely need the index

total = 0.0                 # no declarations, no type, no semicolon
raise ValueError("nope")    # exceptions: raise, not throw</code></pre>
</div>

<p>Three gotchas that will bite you:</p>

<ul>
  <li><strong>Indentation is syntax.</strong> Four spaces. A misindented line is a different program, not a style violation.</li>
  <li><strong><code>/</code> is always float division.</strong> <code>5 / 2 == 2.5</code>. Integer division is <code>//</code>.</li>
  <li><strong><code>**</code> is exponentiation.</strong> <code>x ** 0.5</code> is a square root.</li>
</ul>

<h2>A vector is a list of numbers</h2>

<p>Genuinely — that is the whole definition. <code>[3, 4]</code> is a vector. <code>[0.2, -1.7, 0.0, 5.5]</code> is a vector. In code it is an array.</p>

<p>The word sounds intimidating because physics teaches it as "magnitude and direction, drawn as an arrow". Set the arrows aside for a moment. <strong>A vector is an ordered list of numbers where each position means something fixed.</strong></p>

<p>The interesting half is the second one — <em>each position means something fixed</em>. That is what turns a list into a representation:</p>

<div class="codeblock">
<pre><code class="language-python">house    = [1500, 3, 12]     # [square feet, bedrooms, age in years]
another  = [1600, 3, 10]
mansion  = [8000, 7,  2]</code></pre>
</div>

<p>Position 0 is <em>always</em> square footage. Position 1 is <em>always</em> bedrooms. Now these three lists are comparable, and "is this house like that house" has become a maths problem.</p>

<p>That is the entire trick, and every ML system is built on it. Deciding what goes in each position used to be a job title — <em>feature engineering</em>, covered in lesson 1.10. The revolution of deep learning is that networks now <strong>learn</strong> what the positions should mean instead of you specifying them.</p>

<p><strong>Dimensions</strong> just means "how many numbers are in the list". The house vector is 3-dimensional. Sentence embeddings in a modern LLM are typically 768 to 4096-dimensional. You cannot picture 4096 dimensions and you should stop trying — but every operation you learn in 2D works <em>identically</em> in 4096D, unchanged. That is the gift: intuition is built cheaply in two dimensions and then transfers for free.</p>

<h2>The dot product</h2>

<p>Take two vectors of the same length. Multiply them position by position. Add up the results. One number falls out.</p>

<div data-widget="dotsteps"></div>

<p>That is the entire operation. As an algorithm: <em>walk both lists together, multiply each pair, accumulate the total.</em> Exercise 1 asks you to write exactly this, with no help from NumPy.</p>

<h3>What the number means</h3>

<p>This is the part that matters, and where most people's understanding stays shallow.</p>

<p>The dot product measures <strong>agreement</strong>. Look at what happens to each term in the sum:</p>

<div class="tablewrap">
<table>
  <thead><tr><th>Signs</th><th>Contribution</th><th>Reading</th></tr></thead>
  <tbody>
    <tr><td>both positive</td><td>positive</td><td>they agree</td></tr>
    <tr><td>both negative</td><td>positive</td><td>they agree, in the other direction</td></tr>
    <tr><td>one of each</td><td>negative</td><td>they disagree</td></tr>
    <tr><td>either is zero</td><td>nothing</td><td>no opinion</td></tr>
  </tbody>
</table>
</div>

<p>So the total answers: <strong>across all these dimensions, do these two vectors tend to go the same way?</strong> This is much easier to feel than to read, so here are the arrows I told you to set aside. Drag them.</p>

<div data-widget="vectorlab"></div>

<p>The case worth pausing on is the one in the middle. A dot product of <strong>zero means "these two things have nothing to say about each other"</strong>. In geometry that is a right angle. In machine learning it is "unrelated concepts". Same fact, two vocabularies.</p>

<h3>Why this is the atom of the field</h3>

<p>A neuron in a neural network does exactly this:</p>

<div class="figure">
<pre>output = activation( inputs · weights + bias )</pre>
</div>

<p>The weights are a vector the network learned. The dot product asks <em>"how much does this input agree with the pattern I have learned to look for?"</em> A high number means "strong match — fire".</p>

<p>That is what a neuron <strong>is</strong>. Everything else in deep learning — layers, depth, attention, transformers — is about arranging billions of these agreement checks so that useful patterns emerge. When you build a network from scratch in Phase 2, you will be stacking today's function.</p>

<h2>The flaw, and the fix</h2>

<p>The dot product has a bug as a similarity measure: <strong>it is inflated by magnitude.</strong> If you pressed <span class="mono">× 2</span> in the demo above, you already saw it — the dot product doubled while the arrows did not turn at all.</p>

<div class="figure">
<pre>[1, 0] · [100, 0]  =  100
[1, 0] · [  1, 0]  =    1</pre>
</div>

<p>Both pairs point in <em>precisely</em> the same direction. The first scores 100× higher purely because one vector is bigger. If those were documents, a long document would beat a short one on every query regardless of topic. Not what you want.</p>

<p>The fix is to divide out the magnitudes. The <strong>magnitude</strong> (also called length, or norm) is Pythagoras extended to any number of dimensions — square everything, sum, take the root:</p>

<div class="figure">
<pre>|[3, 4]|  =  √(3² + 4²)  =  √25  =  5</pre>
</div>

<p>Divide the dot product by both magnitudes and you get <strong>cosine similarity</strong>:</p>

<div class="figure">
<pre>cos_sim(a, b)  =  (a · b) / (|a| × |b|)</pre>
</div>

<p>The answer is now always between −1 and 1, and magnitude is gone. Only <em>direction</em> survives:</p>

<div class="tablewrap">
<table>
  <thead><tr><th>Value</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td class="num">1.0</td><td>identical direction</td></tr>
    <tr><td class="num">0.7</td><td>strongly related</td></tr>
    <tr><td class="num">0.0</td><td>unrelated, perpendicular</td></tr>
    <tr><td class="num">−1.0</td><td>opposite</td></tr>
  </tbody>
</table>
</div>

<p>This function is how semantic search works, how RAG retrieves documents, how "customers who liked X also liked Y" works, and how a vector database ranks results. It is four lines of arithmetic, and it is exercise 6. Here it is doing the job:</p>

<div data-widget="search"></div>

<h2>Why NumPy exists</h2>

<p>Python is slow, and it is worth knowing precisely <em>why</em>, because "NumPy is optimised" is not an answer — it is a way of not having one.</p>

<p>Every value in a Python list is a full heap object carrying a type pointer and a reference count, and the list holds pointers to them. Adding two of them means following a pointer, checking a type, unboxing a number, adding, then allocating a new object for the result. NumPy stores the raw numbers side by side in one block of memory and pushes the loop into compiled C, where one instruction can operate on several values at once.</p>

<div class="codeblock">
<div class="cap">The vectorised mental model</div>
<pre><code class="language-python">import numpy as np

a = np.array([1.0, 2.0, 3.0])
b = np.array([4.0, 5.0, 6.0])

a + b        # array([5., 7., 9.])   elementwise, no loop
a * b        # array([4., 10., 18.]) elementwise multiply, NOT matrix multiply
a * 2        # array([2., 4., 6.])   the scalar broadcasts across the array
a.sum()      # 6.0
a.shape      # (3,)  — check this when confused. always.</code></pre>
</div>

<p>The mental shift, and it is a real one coming from imperative code: <strong>stop thinking "for each element, do X". Start thinking "apply X to the whole array".</strong></p>

<div class="callout">
  <span class="lbl">The most common beginner mistake</span>
  <p>Writing a Python <code>for</code> loop over a NumPy array costs roughly 200× in speed. The tests in this lesson reject it outright. Once all seven pass, run the benchmark and see the gap on your own machine.</p>

<h2>Solutions</h2>

<div class="callout danger">
  <span class="lbl">Read this before you open anything below</span>

  <p>If you are stuck: re-read the docstring, print <code>.shape</code> and the intermediate values, or solve a smaller version by hand on paper first. Open these once your tests pass, to compare — not to get unstuck.</p>
</div>

<details class="solution">
<summary>Exercise 1 — <code>dot_loop</code></summary>
<div class="codeblock">
<pre><code class="language-python">def dot_loop(a: list[float], b: list[float]) -> float:
    if len(a) != len(b):
        raise ValueError("The lengths of the two lists must be equal.")

    total = 0.0
    for i in range(len(a)):
        total += a[i] * b[i]
    return total</code></pre>
</div>
<p class="why">The accumulator starts at <code>0.0</code> rather than <code>0</code> so the return type is a float even for integer inputs. Indexing with <code>range(len(a))</code> is the one place in this lesson where an index is genuinely needed — you are walking two lists in step.</p>
</details>

<details class="solution">
<summary>Exercise 2 — <code>dot_numpy</code></summary>
<div class="codeblock">
<pre><code class="language-python">def dot_numpy(a: np.ndarray, b: np.ndarray) -> float:
    return float(np.dot(a, b))</code></pre>
</div>
<p class="why"><code>np.matmul(a, b)</code> and <code>a @ b</code> are equally correct here. They agree with <code>np.dot</code> for 1-D inputs and diverge only in higher dimensions. The <code>float()</code> matters more than it looks: without it you return <code>np.float64</code>, which behaves almost like a Python float right up until it does not — it will not JSON-serialise, and it leaks numpy semantics into code that expected a plain number.</p>
</details>

<details class="solution">
<summary>Exercise 3 — <code>magnitude_loop</code></summary>
<div class="codeblock">
<pre><code class="language-python">def magnitude_loop(v: list[float]) -> float:
    squared = [x ** 2 for x in v]
    return math.sqrt(sum(squared))</code></pre>
</div>
<p class="why">A comprehension plus <code>sum()</code> is idiomatic Python and allowed here — exercise 1 already proved you can accumulate by hand, and the point of this one is Pythagoras. <code>sum(x ** 2 for x in v)</code> using a generator instead of a list is marginally better for very long inputs, since it never materialises the intermediate list.</p>
</details>

<details class="solution">
<summary>Exercise 4 — <code>magnitude</code></summary>
<div class="codeblock">
<pre><code class="language-python">def magnitude(v: np.ndarray) -> float:
    return float(np.sqrt(np.sum(np.square(v))))</code></pre>
</div>
<p class="why"><code>np.linalg.norm(v)</code> does the same job in one call and is what you would reach for in real code. Write it out at least once, though — seeing <code>square</code>, <code>sum</code> and <code>sqrt</code> compose into a single expression is where the vectorised style starts to feel natural. Neither version survives extreme inputs: both overflow to <code>inf</code> around <code>1e200</code>, because both square before summing.</p>
</details>

<details class="solution">
<summary>Exercise 5 — <code>normalise</code></summary>
<div class="codeblock">
<pre><code class="language-python">def normalise(v: np.ndarray) -> np.ndarray:
    length = magnitude(v)
    if length == 0:
        raise ValueError("Cannot normalise a zero vector.")
    return v / length</code></pre>
</div>
<p class="why">Calling <code>magnitude(v)</code> rather than rewriting the formula gives you one source of truth. Naming the local <code>length</code> and not <code>magnitude</code> matters — a local of the same name shadows the function, and the next person to add a second call inside this function gets a confusing <code>TypeError</code>.</p>
</details>

<details class="solution">
<summary>Exercise 6 — <code>cosine_similarity</code></summary>
<div class="codeblock">
<pre><code class="language-python">def cosine_similarity(a: np.ndarray, b: np.ndarray) -> float:
    a_magnitude = magnitude(a)
    b_magnitude = magnitude(b)
    if a_magnitude == 0 or b_magnitude == 0:
        raise ValueError("Cannot compute cosine similarity with a zero vector.")
    return float(np.dot(a, b) / (a_magnitude * b_magnitude))</code></pre>
</div>
<p class="why">The zero check is not required by the tests, but the cosine of an angle with a directionless vector is genuinely undefined, so raising beats returning a made-up number.</p>
<p class="why"><code>np.dot(normalise(a), normalise(b))</code> is equally correct and returns the identical value bit for bit — the second route from the walkthrough. It is shorter and inherits the zero-vector check from <code>normalise</code> for free. The version above was chosen only because it mirrors the formula in the docstring. Watch out for the trap in between: calling <code>normalise</code> where you meant <code>magnitude</code> gives you an array where a scalar belongs, and <code>if array == 0</code> raises "the truth value of an array with more than one element is ambiguous".</p>
</details>

<details class="solution">
<summary>Exercise 7 — <code>most_similar</code></summary>
<div class="codeblock">
<pre><code class="language-python">def most_similar(query: np.ndarray, library: dict[str, np.ndarray]) -> str:
    scores = {name: cosine_similarity(query, vector) for name, vector in library.items()}
    return max(scores, key=scores.get)</code></pre>
</div>
<p class="why">Iterating a dict yields its keys, and <code>key=</code> changes what gets <em>compared</em>, not what gets <em>returned</em> — so the comparison runs over scores while the return value is a name. <code>max(scores.values())</code> would hand you <code>0.998</code> with no way back to which item earned it.</p>
<p class="why">This is the definition, not the implementation. See the walkthrough tab, and <code>stretch.py</code>, for the single-matmul version a real system uses.</p>
</details>

<h2>Exercise walkthrough</h2>

<p>What each exercise is really asking, and how the seven fit together. This explains the <em>mechanisms</em>, not the implementations — the code is yours to write, and reading someone else's answer is the one way to get nothing out of this lesson.</p>

<p>The seven come in pairs. Each pair does the same maths twice: once by hand so you own it, once vectorised so you can use it.</p>

<h3>1 and 2 — the dot product, by hand and vectorised</h3>

<p>Exercise 1 is the definition as an algorithm: walk both lists together, multiply each pair, accumulate. The stepper near the top of this page is exactly what your loop does, one iteration per click. The length check matters because the operation is <em>undefined</em> for mismatched lengths — there is no sensible answer, so failing loudly beats guessing.</p>

<p>Exercise 2 is the same result with the loop pushed into compiled C. Worth knowing: <code>np.dot</code> and <code>np.matmul</code> (also spelled <code>@</code>) agree for 1-D inputs but diverge for higher dimensions — <code>np.dot</code> sums over the last axis of one and the second-to-last of the other, while <code>matmul</code> broadcasts stacks of matrices. For two vectors, either is right.</p>

<h3>3 and 4 — magnitude is just Pythagoras</h3>

<p>Nothing new is happening here. The length of <code>[3, 4]</code> is the hypotenuse of a right triangle with legs 3 and 4.</p>

<h3>6 — cosine similarity, and why the division works</h3>

<p>One identity sits underneath the whole exercise:</p>

<div class="figure">
<pre>a · b  =  |a| × |b| × cos θ</pre>

<p>The dot product was never purely about agreement — it is agreement <strong>scaled by both lengths</strong>. That is precisely the flaw demonstrated earlier: pressing <span class="mono">× 2</span> doubles the number without turning the arrows at all. Divide both sides by <code>|a| × |b|</code> and the lengths cancel, leaving the angle alone. You are not inventing a metric; you are rearranging an identity to isolate what you actually wanted.</p>

<h3>7 — search, and the version you have not written yet</h3>

<p>Exercise 7 is short because exercise 6 did the work. The one piece of Python worth pinning down is <code>max(scores, key=scores.get)</code>: iterating a dict yields its <strong>keys</strong>, and <code>key=</code> changes what gets <em>compared</em>, not what gets <em>returned</em>. So the comparison runs over scores while the return value is a name. Reaching for <code>max(d.values())</code> instead gives you <code>0.998</code> with no way back to which item earned it.</p>

<script>
/* Interactive lesson widgets.
 *
 * A lesson mounts one by placing <div data-widget="name"></div> in its content.
 * After the app inserts lesson HTML it calls Widgets.mount(scope), which finds
 * every such node and hands it to the matching builder below.
 *
 * All colour comes from CSS custom properties so widgets follow the page theme.
 */
var Widgets = (function () {
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) {
      n.setAttribute(k, attrs[k]);
    }
    return n;
  }
  function frame(title, hint) {
    var w = el("div", "widget");
    var h = el("div", "widget-head");
    h.appendChild(el("span", "wt", title));
    if (hint) h.appendChild(el("span", "wh", hint));
    var b = el("div", "widget-body");
    w.appendChild(h);
    w.appendChild(b);
    return { root: w, body: b };
  }
  function foot(w, nodes) {
    var f = el("div", "widget-foot");
    nodes.forEach(function (n) { f.appendChild(typeof n === "string" ? document.createTextNode(n) : n); });
    w.appendChild(f);
    return f;
  }
  function b(text) { return el("b", null, text); }
  function fmt(n, dp) {
    var v = Number(n.toFixed(dp == null ? 2 : dp));
    return (Object.is(v, -0) ? 0 : v).toFixed(dp == null ? 2 : dp);
  }

  /* ==========================================================
     1. vector lab — drag two vectors, watch the dot product
     ========================================================== */
  function vectorLab(mount) {
    var S = 340, O = S / 2, U = 30;              // size, origin, pixels per unit
    var LIM = 5;
    var a = { x: 3, y: 1 }, bb = { x: 1, y: 2.5 };

    var f = frame("Drag the arrows", "the dot product responds live");
    var lab = el("div", "veclab");

    /* ---- plot ---- */
    var plot = svg("svg", {
      viewBox: "0 0 " + S + " " + S,
      role: "img",
      "aria-label": "Two vectors on a grid. Their dot product, magnitudes and cosine similarity update as they move."
    });

    for (var i = -LIM; i <= LIM; i++) {
      var p = O + i * U;
      plot.appendChild(svg("line", { x1: p, y1: 8, x2: p, y2: S - 8, class: "g-line" }));
      plot.appendChild(svg("line", { x1: 8, y1: p, x2: S - 8, y2: p, class: "g-line" }));
    }
    plot.appendChild(svg("line", { x1: 8, y1: O, x2: S - 8, y2: O, class: "g-axis" }));
    plot.appendChild(svg("line", { x1: O, y1: 8, x2: O, y2: S - 8, class: "g-axis" }));

    var arc = svg("polyline", { class: "g-arc" });
    plot.appendChild(arc);

    function vecParts(key) {
      var line = svg("line", { class: "ln-" + key });
      var head = svg("polygon", { class: "fl-" + key });
      var grip = svg("circle", {
        r: 9, class: "fl-" + key + " grip vec-handle", tabindex: "0", role: "button"
      });
      var tag = svg("text", { class: "fl-" + key + " vtag" });
      plot.appendChild(line); plot.appendChild(head); plot.appendChild(grip); plot.appendChild(tag);
      return { line: line, head: head, grip: grip, tag: tag };
    }
    var va = vecParts("a");
    var vb = vecParts("b");
    va.grip.setAttribute("aria-label", "Vector a. Use arrow keys to move.");
    vb.grip.setAttribute("aria-label", "Vector b. Use arrow keys to move.");
    va.tag.textContent = "a";
    vb.tag.textContent = "b";

    /* ---- readouts ---- */
    var reads = el("div", "readouts");
    function readout(key, cls) {
      var r = el("div", "ro" + (cls ? " " + cls : ""));
      r.appendChild(el("span", "k", key));
      var v = el("span", "v", "0");
      r.appendChild(v);
      reads.appendChild(r);
      return v;
    }
    var roA = readout("a"), roB = readout("b");
    var roDot = readout("a · b", "hero-ro");
    var roCos = readout("cosine similarity", "hero-ro");
    var roMag = readout("|a| , |b|");
    var roAng = readout("angle between");

    lab.appendChild(plot);
    lab.appendChild(reads);
    f.body.appendChild(lab);

    /* ---- controls ---- */
    var ctrls = el("div", "ctrls");
    ctrls.appendChild(el("span", "ctrl-label", "set b"));
    [
      ["same direction", function () { var m = mag(a) || 1; return { x: a.x / m * 3, y: a.y / m * 3 }; }],
      ["perpendicular", function () { var m = mag(a) || 1; return { x: -a.y / m * 3, y: a.x / m * 3 }; }],
      ["opposite", function () { var m = mag(a) || 1; return { x: -a.x / m * 3, y: -a.y / m * 3 }; }],
      ["45°", function () {
        var m = mag(a) || 1, c = Math.SQRT1_2;
        return { x: (a.x * c - a.y * c) / m * 3, y: (a.x * c + a.y * c) / m * 3 };
      }]
    ].forEach(function (row) {
      var btn = el("button", "pill", row[0]);
      btn.type = "button";
      btn.addEventListener("click", function () { bb = snapVec(row[1]()); draw(); });
      ctrls.appendChild(btn);
    });

    var lenLabel = el("span", "ctrl-label", "length of b");
    lenLabel.style.marginLeft = "6px";
    ctrls.appendChild(lenLabel);
    [["× 2", 2], ["÷ 2", 0.5]].forEach(function (row) {
      var btn = el("button", "pill", row[0]);
      btn.type = "button";
      btn.addEventListener("click", function () {
        var n = { x: bb.x * row[1], y: bb.y * row[1] };
        if (Math.abs(n.x) <= LIM && Math.abs(n.y) <= LIM && mag(n) > 0.2) { bb = snapVec(n); draw(); }
      });
      ctrls.appendChild(btn);
    });
    f.body.appendChild(ctrls);

    var explain = el("span");
    foot(f.root, [b("Try this: "),
      "drag b until the dot product reads 0. The arrows are now at a right angle — that is what " +
      "“unrelated” looks like. Then press × 2 and watch which number changes and which does not. ",
      explain]);

    /* ---- maths ---- */
    function mag(v) { return Math.sqrt(v.x * v.x + v.y * v.y); }
    function dot(u, v) { return u.x * v.x + u.y * v.y; }
    function snap(n) { return Math.round(n * 4) / 4; }
    function snapVec(v) {
      return {
        x: Math.max(-LIM, Math.min(LIM, snap(v.x))),
        y: Math.max(-LIM, Math.min(LIM, snap(v.y)))
      };
    }
    function sx(x) { return O + x * U; }
    function sy(y) { return O - y * U; }

    function drawVec(parts, v) {
      var m = mag(v);
      var tx = sx(v.x), ty = sy(v.y);
      parts.line.setAttribute("x1", O); parts.line.setAttribute("y1", O);
      parts.line.setAttribute("x2", tx); parts.line.setAttribute("y2", ty);

      if (m > 0.01) {
        var ux = (tx - O) / (m * U), uy = (ty - O) / (m * U);
        var hl = 11, hw = 5;
        var pts = [
          [tx, ty],
          [tx - hl * ux + hw * -uy, ty - hl * uy + hw * ux],
          [tx - hl * ux - hw * -uy, ty - hl * uy - hw * ux]
        ];
        parts.head.setAttribute("points", pts.map(function (q) { return q[0] + "," + q[1]; }).join(" "));
        parts.head.style.display = "";
      } else {
        parts.head.style.display = "none";
      }

      parts.grip.setAttribute("cx", tx);
      parts.grip.setAttribute("cy", ty);
      parts.tag.setAttribute("x", tx + (v.x >= 0 ? 13 : -21));
      parts.tag.setAttribute("y", ty + (v.y >= 0 ? -11 : 21));
    }

    function draw() {
      drawVec(va, a);
      drawVec(vb, bb);

      var d = dot(a, bb), ma = mag(a), mb = mag(bb);
      var cos = (ma > 0 && mb > 0) ? d / (ma * mb) : 0;
      var ang = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;

      roA.textContent = "[" + fmt(a.x) + ", " + fmt(a.y) + "]";
      roB.textContent = "[" + fmt(bb.x) + ", " + fmt(bb.y) + "]";
      roDot.textContent = fmt(d);
      roCos.textContent = fmt(cos);
      roMag.textContent = fmt(ma) + " , " + fmt(mb);
      roAng.textContent = fmt(ang, 1) + "°";

      roDot.className = "v " + (d > 0.005 ? "pos" : d < -0.005 ? "neg" : "");
      roCos.className = "v " + (cos > 0.005 ? "pos" : cos < -0.005 ? "neg" : "");

      /* angle arc, sampled so no arc-flag arithmetic is needed */
      if (ma > 0.3 && mb > 0.3) {
        var t0 = Math.atan2(a.y, a.x), t1 = Math.atan2(bb.y, bb.x);
        var delta = t1 - t0;
        while (delta > Math.PI) delta -= 2 * Math.PI;
        while (delta < -Math.PI) delta += 2 * Math.PI;
        var pts = [];
        for (var k = 0; k <= 24; k++) {
          var t = t0 + delta * (k / 24);
          pts.push(sx(Math.cos(t) * 1.35) + "," + sy(Math.sin(t) * 1.35));
        }
        arc.setAttribute("points", pts.join(" "));
        arc.style.display = "";
      } else {
        arc.style.display = "none";
      }

      explain.textContent =
        Math.abs(cos) < 0.06 ? "Right now: perpendicular — no shared direction at all."
        : cos > 0.94 ? "Right now: pointing the same way."
        : cos < -0.94 ? "Right now: pointing exactly opposite."
        : cos > 0 ? "Right now: partly agreeing."
        : "Right now: partly disagreeing.";
    }

    /* ---- interaction ---- */
    var dragging = null;
    function pointAt(evt) {
      var r = plot.getBoundingClientRect();
      var scale = S / r.width;
      return {
        x: (evt.clientX - r.left) * scale,
        y: (evt.clientY - r.top) * scale
      };
    }
    plot.addEventListener("pointerdown", function (evt) {
      var p = pointAt(evt);
      var da = Math.hypot(p.x - sx(a.x), p.y - sy(a.y));
      var db = Math.hypot(p.x - sx(bb.x), p.y - sy(bb.y));
      if (Math.min(da, db) > 34) return;
      dragging = da <= db ? "a" : "b";
      plot.setPointerCapture(evt.pointerId);
      evt.preventDefault();
    });
    plot.addEventListener("pointermove", function (evt) {
      if (!dragging) return;
      var p = pointAt(evt);
      var v = snapVec({ x: (p.x - O) / U, y: (O - p.y) / U });
      if (dragging === "a") a = v; else bb = v;
      draw();
    });
    function endDrag() { dragging = null; }
    plot.addEventListener("pointerup", endDrag);
    plot.addEventListener("pointercancel", endDrag);

    [[va.grip, "a"], [vb.grip, "b"]].forEach(function (row) {
      row[0].addEventListener("keydown", function (evt) {
        var map = { ArrowLeft: [-0.25, 0], ArrowRight: [0.25, 0], ArrowUp: [0, 0.25], ArrowDown: [0, -0.25] };
        var d = map[evt.key];
        if (!d) return;
        evt.preventDefault();
        var t = row[1] === "a" ? a : bb;
        var v = snapVec({ x: t.x + d[0], y: t.y + d[1] });
        if (row[1] === "a") a = v; else bb = v;
        draw();
      });
    });

    draw();
    mount.appendChild(f.root);
  }

  /* ==========================================================
     2. step through the dot product one multiplication at a time
     ========================================================== */
  function dotSteps(mount) {
    var A = [1, 2, 3], B = [4, 5, 6];
    var step = -1, timer = null;

    var f = frame("One multiplication at a time", "the algorithm, slowly");
    var grid = el("div", "grid-steps");

    function row(label, values, cls) {
      var r = el("div", "srow");
      r.appendChild(el("span", "rlab", label));
      var cells = [];
      values.forEach(function (v, i) {
        if (i) r.appendChild(el("span", "op", cls === "prod" ? "+" : ""));
        var c = el("div", "cell", v == null ? "?" : String(v));
        if (v == null) c.classList.add("blank");
        r.appendChild(c);
        cells.push(c);
      });
      grid.appendChild(r);
      return cells;
    }

    var cellsA = row("a", A);
    var cellsB = row("b", B);
    var cellsP = row("aᵢ × bᵢ", [null, null, null], "prod");

    f.body.appendChild(grid);

    var total = el("div", "total-line");
    total.appendChild(el("span", "lbl", "running total"));
    var eq = el("span", "eq", "—");
    total.appendChild(eq);
    var sum = el("span", "sum", "0");
    total.appendChild(sum);
    f.body.appendChild(total);

    var ctrls = el("div", "ctrls");
    var stepBtn = el("button", "pill", "Step");
    var playBtn = el("button", "pill", "Play");
    var resetBtn = el("button", "pill", "Reset");
    [stepBtn, playBtn, resetBtn].forEach(function (x) { x.type = "button"; ctrls.appendChild(x); });
    f.body.appendChild(ctrls);

    foot(f.root, [
      "Three multiplications and two additions. That is the whole operation — and a modern GPU runs " +
      "trillions of them per second. ", b("Everything else in this field is scale and arrangement.")
    ]);

    function render() {
      [cellsA, cellsB].forEach(function (cells) {
        cells.forEach(function (c, i) {
          c.classList.toggle("live", i === step);
          c.classList.toggle("settled", i < step);
        });
      });
      cellsP.forEach(function (c, i) {
        var on = i <= step;
        c.textContent = on ? String(A[i] * B[i]) : "?";
        c.classList.toggle("blank", !on);
        c.classList.toggle("live", i === step);
        c.classList.toggle("settled", i < step);
      });

      var parts = [], acc = 0;
      for (var i = 0; i <= step && i < A.length; i++) {
        parts.push(A[i] + "×" + B[i]);
        acc += A[i] * B[i];
      }
      eq.textContent = parts.length ? parts.join(" + ") : "—";
      sum.textContent = String(acc);
      playBtn.classList.toggle("on", timer !== null);
      playBtn.textContent = timer !== null ? "Pause" : "Play";
    }

    function advance() {
      if (step >= A.length - 1) { stop(); return; }
      step++;
      render();
      if (step >= A.length - 1) stop();
    }
    function stop() { if (timer) { clearInterval(timer); timer = null; } render(); }

    stepBtn.addEventListener("click", function () { stop(); advance(); });
    playBtn.addEventListener("click", function () {
      if (timer) { stop(); return; }
      if (step >= A.length - 1) step = -1;
      advance();
      timer = setInterval(advance, 950);
      render();
    });
    resetBtn.addEventListener("click", function () { stop(); step = -1; render(); });

    render();
    mount.appendChild(f.root);
  }

  /* ==========================================================
     3. a working similarity search, on three dimensions
     ========================================================== */
  function searchDemo(mount) {
    var DIMS = ["programming", "cooking", "learning"];
    var LIB = [
      { name: "Python tutorial for beginners", v: [0.90, 0.05, 0.85] },
      { name: "How the Rust borrow checker works", v: [0.95, 0.05, 0.40] },
      { name: "Sourdough starter, day by day", v: [0.05, 0.95, 0.55] },
      { name: "Knife skills every cook needs", v: [0.05, 0.90, 0.60] },
      { name: "Restaurant menu, autumn", v: [0.02, 0.90, 0.03] },
      { name: "Teaching yourself to draw", v: [0.08, 0.10, 0.90] }
    ];
    var q = [0.8, 0.1, 0.7];

    var f = frame("Similarity search, for real", "exercise 7, made visible");
    var grid = el("div", "searchgrid");

    var left = el("div");
    left.appendChild(el("div", "ctrl-label", "your query vector"));
    var sliders = el("div", "sliders");
    sliders.style.marginTop = "10px";
    var vals = [];
    DIMS.forEach(function (name, i) {
      var rw = el("div", "slider-row");
      var top = el("div", "top");
      top.appendChild(el("span", "nm", name));
      var vl = el("span", "vl", q[i].toFixed(2));
      top.appendChild(vl);
      rw.appendChild(top);
      var input = document.createElement("input");
      input.type = "range";
      input.min = "0"; input.max = "1"; input.step = "0.01";
      input.value = String(q[i]);
      input.setAttribute("aria-label", name);
      input.addEventListener("input", function () {
        q[i] = parseFloat(input.value);
        vl.textContent = q[i].toFixed(2);
        render();
      });
      vals.push({ input: input, label: vl });
      rw.appendChild(input);
      sliders.appendChild(rw);
    });
    left.appendChild(sliders);

    var presets = el("div", "ctrls");
    [
      ["learn to code", [0.9, 0.05, 0.9]],
      ["cook something", [0.05, 0.95, 0.3]],
      ["just learning", [0.1, 0.1, 0.95]]
    ].forEach(function (row) {
      var btn = el("button", "pill", row[0]);
      btn.type = "button";
      btn.addEventListener("click", function () {
        q = row[1].slice();
        vals.forEach(function (s, i) { s.input.value = String(q[i]); s.label.textContent = q[i].toFixed(2); });
        render();
      });
      presets.appendChild(btn);
    });
    left.appendChild(presets);

    var results = el("div", "results");
    grid.appendChild(left);
    grid.appendChild(results);
    f.body.appendChild(grid);

    foot(f.root, [
      "Six items, three dimensions, ranked by cosine similarity — the function you write in exercise 6. " +
      "Real systems differ only in scale: ", b("millions of items and 1536 dimensions"),
      ", produced by a model instead of chosen by hand."
    ]);

    function cos(u, v) {
      var d = 0, mu = 0, mv = 0;
      for (var i = 0; i < u.length; i++) { d += u[i] * v[i]; mu += u[i] * u[i]; mv += v[i] * v[i]; }
      return (mu && mv) ? d / (Math.sqrt(mu) * Math.sqrt(mv)) : 0;
    }

    function render() {
      var scored = LIB.map(function (item) {
        return { name: item.name, s: cos(q, item.v) };
      }).sort(function (m, n) { return n.s - m.s; });

      results.textContent = "";
      scored.forEach(function (item, idx) {
        var r = el("div", "result" + (idx === 0 ? " top" : ""));
        var col = el("div");
        col.appendChild(el("div", "nm", item.name));
        var track = el("div", "track");
        var fill = el("i");
        fill.style.width = Math.max(0, item.s * 100).toFixed(1) + "%";
        track.appendChild(fill);
        col.appendChild(track);
        r.appendChild(col);
        r.appendChild(el("div", "sc", item.s.toFixed(3)));
        results.appendChild(r);
      });
    }

    render();
    mount.appendChild(f.root);
  }

  /* ========================================================== */
  var BUILDERS = {
    vectorlab: vectorLab,
    dotsteps: dotSteps,
    search: searchDemo
  };

  return {
    mount: function (scope) {
      scope.querySelectorAll("[data-widget]").forEach(function (node) {
        var build = BUILDERS[node.getAttribute("data-widget")];
        if (!build || node.dataset.mounted) return;
        node.dataset.mounted = "1";
        try { build(node); } catch (e) { node.remove(); }
      });
    }
  };
})();
</script>

<script>
/* Shell: routing, progress, the curriculum rail, and the overview. */
(function () {
  "use strict";

  var STORE_KEY = "mlfs:progress:v1";
  var data = JSON.parse(document.getElementById("curriculum-data").textContent);
  var phases = data.phases;
  var allLessons = [];
  phases.forEach(function (p) {
    p.lessons.forEach(function (l) { l.phase = p; allLessons.push(l); });
  });
  var TOTAL = allLessons.length;

  /* ---------- progress: per viewer, per device ---------- */
  function loadDone() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return {};
      var arr = JSON.parse(raw), out = {};
      if (Array.isArray(arr)) arr.forEach(function (id) { out[id] = true; });
      return out;
    } catch (e) { return {}; }
  }
  function saveDone() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(Object.keys(done))); } catch (e) {}
  }
  var done = loadDone();
  var view = { kind: "overview", id: null };
  var collapsed = {};
  var expandedPlanned = {};
  var activeTab = {};

  var SECTIONS = data.sections || {};
  var TAB_LABELS = {
    overview: "Overview",
    lesson: "Lesson",
    exercises: "Exercises",
    walkthrough: "Walkthrough",
    resources: "Resources"
  };

  /* ---------- helpers ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function button(cls, text, onClick) {
    var n = el("button", cls, text);
    n.type = "button";
    n.addEventListener("click", onClick);
    return n;
  }
  function lessonById(id) {
    for (var i = 0; i < allLessons.length; i++) if (allLessons[i].id === id) return allLessons[i];
    return null;
  }
  function phaseDone(p) { return p.lessons.filter(function (l) { return done[l.id]; }).length; }
  function totalDone() { return Object.keys(done).length; }
  function nextLesson() {
    for (var i = 0; i < allLessons.length; i++) {
      if (allLessons[i].status === "available" && !done[allLessons[i].id]) return allLessons[i];
    }
    for (var j = 0; j < allLessons.length; j++) if (!done[allLessons[j].id]) return allLessons[j];
    return null;
  }
  /* ---------- resume where you left off ----------
     Course sites drop you back into the lesson you were reading rather than the
     catalogue. Stored per device alongside progress; the overview stays one
     click away in the rail and the wordmark. */
  var VIEW_KEY = "mlfs:view:v1";

  function saveView() {
    try {
      localStorage.setItem(VIEW_KEY, JSON.stringify({
        id: view.kind === "lesson" ? view.id : null,
        tab: view.kind === "lesson" ? (activeTab[view.id] || 0) : 0
      }));
    } catch (e) {}
  }

  function restoreView() {
    try {
      var saved = JSON.parse(localStorage.getItem(VIEW_KEY) || "null");
      if (!saved || !saved.id) return;
      var lesson = lessonById(saved.id);
      if (!lesson) return;               // curriculum changed under an old value
      view = { kind: "lesson", id: saved.id };
      activeTab[saved.id] = typeof saved.tab === "number" ? saved.tab : 0;
      collapsed[lesson.phase.id] = false;
    } catch (e) {}
  }

  function goOverview() { view = { kind: "overview", id: null }; saveView(); render(); window.scrollTo(0, 0); }
  function goLesson(id) { view = { kind: "lesson", id: id }; saveView(); render(); window.scrollTo(0, 0); }
  function toggleDone(id) {
    if (done[id]) { delete done[id]; } else { done[id] = true; }
    saveDone();
    render();
  }
  function highlight(scope) {
    if (typeof hljs === "undefined") return;
    scope.querySelectorAll("pre code").forEach(function (node) {
      try { hljs.highlightElement(node); } catch (e) {}
    });
  }

  /* ---------- rail ---------- */
  var railNav = document.getElementById("rail-nav");
  var railHome = document.getElementById("rail-home");

  function buildRail() {
    railHome.classList.toggle("current", view.kind === "overview");
    railNav.textContent = "";

    phases.forEach(function (p) {
      var block = el("div", "phase-block" + (collapsed[p.id] ? " collapsed" : ""));

      var btn = button("phase-btn", null, function () {
        collapsed[p.id] = !collapsed[p.id];
        buildRail();
      });
      btn.setAttribute("aria-expanded", collapsed[p.id] ? "false" : "true");
      btn.appendChild(el("span", "chev"));
      btn.appendChild(el("span", "phase-num", String(p.number)));
      btn.appendChild(el("span", "phase-name", p.title));
      btn.appendChild(el("span", "phase-count", phaseDone(p) + "/" + p.lessons.length));
      block.appendChild(btn);

      var prog = el("div", "phase-progress");
      var fill = el("i");
      fill.style.width = (p.lessons.length ? phaseDone(p) / p.lessons.length * 100 : 0) + "%";
      prog.appendChild(fill);
      block.appendChild(prog);

      /* 54 of 55 rows used to lead to the same "not written yet" placeholder.
         Show what you can actually open; fold the rest into a count you can
         expand if you want to see the shape of what is coming. */
      var visible = expandedPlanned[p.id] ? p.lessons : p.lessons.filter(function (l) {
        return l.status === "available" || done[l.id] ||
               (view.kind === "lesson" && view.id === l.id);
      });
      var foldedCount = p.lessons.length - visible.length;

      var list = el("ul", "lesson-list");
      visible.forEach(function (l) {
        var row = el("li", "lesson-row" +
          (view.kind === "lesson" && view.id === l.id ? " current" : "") +
          (done[l.id] ? " is-done" : ""));

        var box = el("input", "tickbox");
        box.type = "checkbox";
        box.checked = !!done[l.id];
        box.setAttribute("aria-label", "Mark lesson " + l.id + " complete");
        box.addEventListener("change", function () { toggleDone(l.id); });
        row.appendChild(box);

        var link = button("lesson-link", null, function () { goLesson(l.id); });
        link.appendChild(el("span", "lid", l.id));
        link.appendChild(el("span", "ltitle", l.title));
        if (l.status === "available") link.appendChild(el("span", "dot-ready"));
        row.appendChild(link);

        list.appendChild(row);
      });
      if (visible.length) block.appendChild(list);

      if (foldedCount) {
        var more = button("planned-row", null, function () {
          expandedPlanned[p.id] = true;
          buildRail();
        });
        more.appendChild(el("span", "pcount", String(foldedCount)));
        more.appendChild(document.createTextNode(
          visible.length ? " more planned" : " lessons planned"));
        block.appendChild(more);
      } else if (!visible.length) {
        block.appendChild(el("div", "phase-empty", "nothing here yet"));
      }

      railNav.appendChild(block);
    });
  }

  /* ---------- overview ---------- */
  function buildOverview() {
    var wrap = el("div", "wrap");

    var hero = el("div", "hero");
    hero.appendChild(el("div", "eyebrow", TOTAL + " lessons · 5 phases · no prior maths"));
    hero.appendChild(el("h1", null, "Learn machine learning by building it"));
    hero.appendChild(el("p", "lede",
      "A ground-up curriculum for engineers whose maths is rusty, weak or absent. " +
      "Every idea is built once by hand before you are allowed the library that does it for you."));
    wrap.appendChild(hero);

    /* the ruler */
    var card = el("div", "ruler-card");
    var top = el("div", "ruler-top");
    var big = el("div", "bignum");
    big.appendChild(document.createTextNode(totalDone() + " "));
    big.appendChild(el("span", null, "/ " + TOTAL + " lessons complete"));
    top.appendChild(big);
    top.appendChild(el("div", "eyebrow", "phases 0–4, drawn to scale"));
    card.appendChild(top);

    var ruler = el("div", "ruler");
    phases.forEach(function (p) {
      var g = el("div", "rgroup");
      g.style.flex = p.lessons.length + " 1 0";
      var ticks = el("div", "ticks");
      p.lessons.forEach(function (l) {
        var t = el("span", "tick");
        t.setAttribute("data-state", done[l.id] ? "done" : (l.status === "available" ? "ready" : "planned"));
        t.title = l.id + " — " + l.title;
        ticks.appendChild(t);
      });
      g.appendChild(ticks);
      var lab = el("div", "rlabel", String(p.number));
      lab.title = "Phase " + p.number + " · " + p.title + " (" + p.lessons.length + " lessons)";
      g.appendChild(lab);
      ruler.appendChild(g);
    });
    card.appendChild(ruler);

    var legend = el("div", "legend");
    [["complete", "var(--done)"], ["written and ready", "var(--accent)"], ["still to be written", "var(--rule)"]]
      .forEach(function (row) {
        var s = el("span");
        var i = el("i");
        i.style.background = row[1];
        s.appendChild(i);
        s.appendChild(document.createTextNode(row[0]));
        legend.appendChild(s);
      });
    card.appendChild(legend);
    wrap.appendChild(card);

    var nxt = nextLesson();
    if (nxt) {
      var nu = el("div", "nextup");
      var body = el("div", "body");
      body.appendChild(el("div", "t", "Next up — " + nxt.id + " · " + nxt.title));
      body.appendChild(el("div", "s", nxt.summary));
      nu.appendChild(body);
      nu.appendChild(button("btn", nxt.status === "available" ? "Open lesson" : "Preview",
        function () { goLesson(nxt.id); }));
      wrap.appendChild(nu);
    }

    var s1 = el("div", "section");
    s1.appendChild(el("h2", null, "How this works"));
    s1.appendChild(el("p", "sub",
      "This page is the curriculum and your progress. The code lives in a repository on your machine, " +
      "because writing it is the part that actually teaches you."));
    var steps = el("div", "steps");
    [
      ["01", "Read the lesson here",
        "Each lesson explains the idea from nothing, in plain language, with the maths introduced only at the moment it becomes necessary to explain something. Diagrams and interactive demos are there to be poked at, not admired."],
      ["02", "Write the code in the repo",
        "Every lesson ships function stubs and a test suite. You implement the stubs. Nobody hands you the answer — recognising correct code is a different skill from producing it, and only one of them transfers."],
      ["03", "Run the tests",
        "progress 0.1 tells you exactly which exercises pass. Some tests check how you solved it, rejecting NumPy where you should be building the mechanism, and rejecting loops where you should be thinking in arrays."],
      ["04", "Tick it off",
        "Progress here is self-reported and stored in this browser. Progress in the repo is measured by passing tests, which is the definition worth trusting."]
    ].forEach(function (row) {
      var st = el("div", "step");
      st.appendChild(el("div", "step-n", row[0]));
      var bd = el("div");
      bd.appendChild(el("h3", null, row[1]));
      bd.appendChild(el("p", null, row[2]));
      st.appendChild(bd);
      steps.appendChild(st);
    });
    s1.appendChild(steps);
    wrap.appendChild(s1);

    var s2 = el("div", "section");
    s2.appendChild(el("h2", null, "The five phases"));
    s2.appendChild(el("p", "sub", "Ordered so that each phase assumes exactly what came before it, and nothing more."));
    var cards = el("div", "phase-cards");
    phases.forEach(function (p) {
      var c = button("pcard", null, function () {
        collapsed[p.id] = false;
        goLesson(p.lessons[0].id);
      });
      var head = el("div", "pcard-top");
      head.appendChild(el("span", "phase-num", String(p.number)));
      head.appendChild(el("h3", null, p.title));
      c.appendChild(head);
      c.appendChild(el("p", null, p.blurb));
      var meta = el("div", "meta");
      meta.appendChild(el("span", null, p.lessons.length + " lessons"));
      meta.appendChild(el("span", null, phaseDone(p) + " complete"));
      c.appendChild(meta);
      cards.appendChild(c);
    });
    s2.appendChild(cards);
    wrap.appendChild(s2);

    var s3 = el("div", "section");
    s3.appendChild(el("h2", null, "Where the code lives"));
    s3.appendChild(el("p", "sub",
      "In-browser Python is deliberately not offered here. You learn the toolchain by using it — a real " +
      "virtual environment, a real test runner, a real terminal."));
    var cb = el("div", "codeblock");
    cb.style.marginTop = "20px";
    cb.appendChild(el("div", "cap", "getting set up"));
    var pre = el("pre");
    var code = el("code");
    code.textContent =
      "python -m venv .venv\n" +
      "pip install -e \".[dev]\"\n\n" +
      "progress        # the dashboard: where you stand\n" +
      "progress 0.1    # run one lesson's tests";
    pre.appendChild(code);
    cb.appendChild(pre);
    s3.appendChild(cb);
    wrap.appendChild(s3);

    var foot = el("div", "foot");
    foot.appendChild(el("span", null,
      "Progress is stored in this browser only — it is not shared, and it does not follow you to another device."));
    foot.appendChild(button("linkbtn", "Clear my progress", function () {
      if (window.confirm("Clear all ticked lessons on this device? This cannot be undone.")) {
        done = {};
        saveDone();
        render();
      }
    }));
    wrap.appendChild(foot);

    return wrap;
  }

  /* ---------- lesson ---------- */
  function buildLesson(l) {
    var wrap = el("div", "wrap");

    var head = el("div", "lesson-head");
    var crumbs = el("div", "crumbs");
    crumbs.appendChild(button("crumb", "Overview", goOverview));
    crumbs.appendChild(el("span", "crumb-sep", "/"));
    crumbs.appendChild(button("crumb", "Phase " + l.phase.number + " · " + l.phase.title, function () {
      collapsed[l.phase.id] = false;
      goLesson(l.phase.lessons[0].id);
    }));
    crumbs.appendChild(el("span", "crumb-sep", "/"));
    if (done[l.id]) crumbs.appendChild(el("span", "chip done", "Complete"));
    else if (l.status === "available") crumbs.appendChild(el("span", "chip ready", "Ready"));
    else crumbs.appendChild(el("span", "chip plan", "Not written yet"));
    head.appendChild(crumbs);
    head.appendChild(el("h1", null, l.id + " — " + l.title));
    head.appendChild(el("p", "lede", l.summary));
    wrap.appendChild(head);

    var names = SECTIONS[l.id] || [];
    if (names.length) {
      if (activeTab[l.id] == null || activeTab[l.id] >= names.length) activeTab[l.id] = 0;

      var tabbar = el("div", "tabs");
      tabbar.setAttribute("role", "tablist");
      var panels = el("div", "panels");
      var entries = [];

      var slug = l.id.replace(/\./g, "-");

      names.forEach(function (name, i) {
        var tpl = document.getElementById("lesson-" + l.id + "-" + name);
        if (!tpl) return;

        var tabId = "tab-" + slug + "-" + name;
        var panelId = "panel-" + slug + "-" + name;

        var panel = el("section", "panel");
        panel.id = panelId;
        panel.setAttribute("role", "tabpanel");
        panel.setAttribute("aria-labelledby", tabId);
        /* A scrollable panel needs to be focusable, or keyboard users can tab
           to the tablist and then have no way to scroll the content. */
        panel.tabIndex = 0;
        panel.appendChild(tpl.content.cloneNode(true));
        panel.hidden = i !== activeTab[l.id];
        panels.appendChild(panel);

        var tb = button("tab", TAB_LABELS[name] || name, function () { show(i); });
        tb.id = tabId;
        tb.setAttribute("role", "tab");
        tb.setAttribute("aria-controls", panelId);
        tb.setAttribute("aria-selected", i === activeTab[l.id] ? "true" : "false");
        /* Roving tabindex: one stop for the whole tablist, arrows move within it. */
        tb.tabIndex = i === activeTab[l.id] ? 0 : -1;
        tb.addEventListener("keydown", function (evt) {
          var delta = { ArrowRight: 1, ArrowLeft: -1 }[evt.key];
          var target = null;
          if (delta != null) target = (i + delta + entries.length) % entries.length;
          else if (evt.key === "Home") target = 0;
          else if (evt.key === "End") target = entries.length - 1;
          if (target == null) return;
          evt.preventDefault();
          show(target);
          entries[target].btn.focus();
        });
        tabbar.appendChild(tb);
        entries.push({ btn: tb, panel: panel });
      });

      /* Switching tabs only toggles visibility — no re-render, so the vector lab
         keeps whatever position you dragged it to. */
      function show(i) {
        activeTab[l.id] = i;
        entries.forEach(function (e, j) {
          e.panel.hidden = j !== i;
          e.btn.classList.toggle("on", j === i);
          e.btn.setAttribute("aria-selected", j === i ? "true" : "false");
          e.btn.tabIndex = j === i ? 0 : -1;
        });
        saveView();
        wrap.scrollIntoView({ block: "start" });
        buildToc(entries[i].panel);
      }
      entries.forEach(function (e, j) { e.btn.classList.toggle("on", j === activeTab[l.id]); });

      wrap.appendChild(tabbar);
      wrap.appendChild(panels);
      highlight(panels);
      if (typeof Widgets !== "undefined") Widgets.mount(panels);

      var mark = el("div", "nextup");
      mark.style.marginTop = "44px";
      var mb = el("div", "body");
      mb.appendChild(el("div", "t", done[l.id] ? "Marked complete" : "Finished this lesson?"));
      mb.appendChild(el("div", "s", done[l.id]
        ? "You can untick it in the curriculum rail if you want another pass."
        : "Tick it off once the tests pass and you can answer the questions above without looking them up."));
      mark.appendChild(mb);
      mark.appendChild(button("btn", done[l.id] ? "Mark as not done" : "Mark complete",
        function () { toggleDone(l.id); }));
      wrap.appendChild(mark);
    } else {
      var ph = el("div", "placeholder");
      ph.appendChild(el("div", "eyebrow", "Not written yet"));
      ph.appendChild(el("h3", null, "This lesson is planned, not published."));
      ph.appendChild(el("p", null,
        "Lessons are written one at a time, in order, so that each one can assume exactly what came " +
        "before it. Writing all fifty-five up front would produce a worse curriculum than writing each " +
        "in response to how the previous one actually went."));
      ph.appendChild(el("p", null,
        "When it exists, it will cover: " + l.summary.charAt(0).toLowerCase() + l.summary.slice(1)));
      wrap.appendChild(ph);

      var mile = el("div", "callout");
      mile.style.marginTop = "24px";
      mile.appendChild(el("span", "lbl", "Phase " + l.phase.number + " milestone"));
      mile.appendChild(el("p", null, l.phase.milestone));
      wrap.appendChild(mile);
    }

    var idx = allLessons.indexOf(l);
    var foot = el("div", "foot");
    foot.appendChild(button("linkbtn", "← Overview", goOverview));
    if (idx > 0) {
      var pv = allLessons[idx - 1];
      foot.appendChild(button("linkbtn", "← " + pv.id + " " + pv.title, function () { goLesson(pv.id); }));
    }
    if (idx + 1 < allLessons.length) {
      var nx = allLessons[idx + 1];
      foot.appendChild(button("linkbtn", "Next: " + nx.id + " " + nx.title + " →", function () { goLesson(nx.id); }));
    }
    wrap.appendChild(foot);

    return wrap;
  }

  /* ---------- on-this-page rail ----------
     Built from whatever is currently visible, so it follows the active tab
     rather than listing the whole lesson. */
  var tocCleanup = null;

  function buildToc(scope) {
    var toc = document.getElementById("toc");
    if (tocCleanup) { tocCleanup(); tocCleanup = null; }
    toc.textContent = "";

    var heads = [].slice.call(scope.querySelectorAll("h2"));
    if (heads.length < 2) { toc.hidden = true; return; }

    var head = el("div", "toc-head");
    head.appendChild(el("span", "eyebrow", "On this page"));
    toc.appendChild(head);

    var list = el("div", "toc-list");
    var links = heads.map(function (h) {
      var link = button("toc-link", h.textContent, function () {
        h.scrollIntoView({ block: "start", behavior: "smooth" });
      });
      list.appendChild(link);
      return link;
    });
    toc.appendChild(list);
    toc.hidden = false;

    /* Highlight whichever heading you have most recently scrolled past. */
    var ticking = false;
    function sync() {
      ticking = false;
      var line = 140, best = 0;
      for (var i = 0; i < heads.length; i++) {
        if (heads[i].getBoundingClientRect().top <= line) best = i;
      }
      links.forEach(function (a, i) { a.classList.toggle("on", i === best); });
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(sync);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    tocCleanup = function () { window.removeEventListener("scroll", onScroll); };
    sync();
  }

  /* ---------- render ---------- */
  function render() {
    var pane = document.getElementById("pane");
    pane.textContent = "";

    if (view.kind === "lesson") {
      var l = lessonById(view.id);
      pane.appendChild(l ? buildLesson(l) : buildOverview());
    } else {
      pane.appendChild(buildOverview());
    }

    var live = pane.querySelector(".panel:not([hidden])") || pane.querySelector(".wrap");
    if (live) buildToc(live);

    var n = totalDone();
    document.getElementById("stat-count").textContent = n + "/" + TOTAL;
    document.getElementById("stat-bar").style.width = (n / TOTAL * 100) + "%";
    document.getElementById("rail-total").textContent = TOTAL + " lessons";
    buildRail();

    if (window.matchMedia("(max-width: 940px)").matches) {
      rail.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
    }
  }

  /* ---------- navigation chrome ---------- */
  var rail = document.getElementById("rail");
  var toggle = document.getElementById("railtoggle");

  document.getElementById("brand").addEventListener("click", goOverview);
  railHome.addEventListener("click", goOverview);
  toggle.addEventListener("click", function () {
    rail.hidden = !rail.hidden;
    toggle.setAttribute("aria-expanded", rail.hidden ? "false" : "true");
  });

  var narrow = window.matchMedia("(max-width: 940px)");
  function syncRail() { if (!narrow.matches) rail.hidden = false; }
  window.addEventListener("resize", syncRail);

  /* ---------- theme ----------
     head.html already applied any saved choice before first paint; this only
     wires the control and keeps it in sync. No stored value means no attribute,
     which leaves prefers-color-scheme in charge. */
  var THEME_KEY = "mlfs:theme:v1";
  var themeButtons = [].slice.call(document.querySelectorAll("[data-theme-set]"));
  var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

  function effectiveTheme() {
    return document.documentElement.getAttribute("data-theme") ||
           (darkQuery.matches ? "dark" : "light");
  }
  function syncTheme() {
    var now = effectiveTheme();
    themeButtons.forEach(function (b) {
      var mine = b.getAttribute("data-theme-set") === now;
      b.classList.toggle("on", mine);
      b.setAttribute("aria-pressed", mine ? "true" : "false");
    });
  }
  themeButtons.forEach(function (b) {
    b.addEventListener("click", function () {
      var next = b.getAttribute("data-theme-set");
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      syncTheme();
    });
  });
  /* Follow the OS until the reader makes a choice of their own. */
  if (darkQuery.addEventListener) {
    darkQuery.addEventListener("change", function () {
      if (!document.documentElement.getAttribute("data-theme")) syncTheme();
    });
  }
  syncTheme();

  if (narrow.matches) rail.hidden = true;
  restoreView();
  render();
})();
</script>
