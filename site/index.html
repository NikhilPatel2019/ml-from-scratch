<template id="lesson-1.1-lesson">
<div class="prose">

<h2>Why we start here</h2>

<p>Strip away every buzzword and machine learning is three claims:</p>

<ol>
  <li><strong>Anything can be turned into a list of numbers.</strong> A house, a customer, a photograph, the word "banana".</li>
  <li><strong>Once things are lists of numbers, "similar" and "different" become arithmetic</strong> — and arithmetic is something a computer does a trillion times a second.</li>
  <li><strong>A model is a large pile of numbers that you adjust until its outputs stop being wrong.</strong></li>
</ol>

<p>Phase 1 makes claims 1 and 2 concrete. Today is claim 1, plus the single operation that claim 2 rests on.</p>

<p>That operation is the <strong>dot product</strong>. To be precise about how central it is: a neuron in a neural network is a dot product followed by one simple function. Attention — the mechanism behind every modern large language model — is dot products. Semantic search is dot products. When a model has 175 billion parameters and needs a GPU cluster, what that hardware is doing, almost exclusively, is dot products.</p>

<p>There is no second idea in this field of comparable importance. You will implement it today in about four lines.</p>

<h2>The Python you need</h2>

<p>If you already program, only the deltas matter:</p>

<div class="codeblock">
<div class="cap">Python, for people who already program</div>
<pre><code class="language-python">xs = [1, 2, 3]              # list: dynamically sized, heterogeneous, indexed from 0
xs[-1]                      # 3  — negative indices count from the end
xs[0:2]                     # [1, 2] — slice, end-exclusive
len(xs)                     # 3

def f(a: list[float]) -> float:   # type hints exist but are NOT enforced.
    return a[0]                   # they are documentation; the runtime ignores them.

d = {"a": 1, "b": 2}        # dict
for k in d: ...             # iterates KEYS, not pairs
for x in xs: ...            # no index — this is the idiomatic loop
for i in range(len(xs)): .. # only when you genuinely need the index

total = 0.0                 # no declarations, no type, no semicolon
raise ValueError("nope")    # exceptions: raise, not throw</code></pre>
</div>

<p>Three gotchas that will bite you:</p>

<ul>
  <li><strong>Indentation is syntax.</strong> Four spaces. A misindented line is a different program, not a style violation.</li>
  <li><strong><code>/</code> is always float division.</strong> <code>5 / 2 == 2.5</code>. Integer division is <code>//</code>.</li>
  <li><strong><code>**</code> is exponentiation.</strong> <code>x ** 0.5</code> is a square root.</li>
</ul>

<h2>A vector is a list of numbers</h2>

<p>Genuinely — that is the whole definition. <code>[3, 4]</code> is a vector. <code>[0.2, -1.7, 0.0, 5.5]</code> is a vector. In code it is an array.</p>

<p>The word sounds intimidating because physics teaches it as "magnitude and direction, drawn as an arrow". Set the arrows aside for a moment. <strong>A vector is an ordered list of numbers where each position means something fixed.</strong></p>

<p>The interesting half is the second one — <em>each position means something fixed</em>. That is what turns a list into a representation:</p>

<div class="codeblock">
<pre><code class="language-python">house    = [1500, 3, 12]     # [square feet, bedrooms, age in years]
another  = [1600, 3, 10]
mansion  = [8000, 7,  2]</code></pre>
</div>

<p>Position 0 is <em>always</em> square footage. Position 1 is <em>always</em> bedrooms. Now these three lists are comparable, and "is this house like that house" has become a maths problem.</p>

<p>That is the entire trick, and every ML system is built on it. Deciding what goes in each position used to be a job title — <em>feature engineering</em>, covered in lesson 2.10. The revolution of deep learning is that networks now <strong>learn</strong> what the positions should mean instead of you specifying them.</p>

<p><strong>Dimensions</strong> just means "how many numbers are in the list". The house vector is 3-dimensional. Sentence embeddings in a modern LLM are typically 768 to 4096-dimensional. You cannot picture 4096 dimensions and you should stop trying — but every operation you learn in 2D works <em>identically</em> in 4096D, unchanged. That is the gift: intuition is built cheaply in two dimensions and then transfers for free.</p>

<h2>The dot product</h2>

<p>Take two vectors of the same length. Multiply them position by position. Add up the results. One number falls out.</p>

<div data-widget="dotsteps"></div>

<p>That is the entire operation. As an algorithm: <em>walk both lists together, multiply each pair, accumulate the total.</em> Exercise 1 asks you to write exactly this, with no help from NumPy.</p>

<h3>What the number means</h3>

<p>This is the part that matters, and where most people's understanding stays shallow.</p>

<p>The dot product measures <strong>agreement</strong>. Look at what happens to each term in the sum:</p>

<div class="tablewrap">
<table>
  <thead><tr><th>Signs</th><th>Contribution</th><th>Reading</th></tr></thead>
  <tbody>
    <tr><td>both positive</td><td>positive</td><td>they agree</td></tr>
    <tr><td>both negative</td><td>positive</td><td>they agree, in the other direction</td></tr>
    <tr><td>one of each</td><td>negative</td><td>they disagree</td></tr>
    <tr><td>either is zero</td><td>nothing</td><td>no opinion</td></tr>
  </tbody>
</table>
</div>

<p>So the total answers: <strong>across all these dimensions, do these two vectors tend to go the same way?</strong> This is much easier to feel than to read, so here are the arrows I told you to set aside. Drag them.</p>

<div data-widget="vectorlab"></div>

<p>The case worth pausing on is the one in the middle. A dot product of <strong>zero means "these two things have nothing to say about each other"</strong>. In geometry that is a right angle. In machine learning it is "unrelated concepts". Same fact, two vocabularies.</p>

<h3>Why this is the atom of the field</h3>

<p>A neuron in a neural network does exactly this:</p>

<div class="figure">
<pre>output = activation( inputs · weights + bias )</pre>
</div>

<p>The weights are a vector the network learned. The dot product asks <em>"how much does this input agree with the pattern I have learned to look for?"</em> A high number means "strong match — fire".</p>

<p>That is what a neuron <strong>is</strong>. Everything else in deep learning — layers, depth, attention, transformers — is about arranging billions of these agreement checks so that useful patterns emerge. When you build a network from scratch in Phase 3, you will be stacking today's function.</p>

<h2>The flaw, and the fix</h2>

<p>The dot product has a bug as a similarity measure: <strong>it is inflated by magnitude.</strong> If you pressed <span class="mono">× 2</span> in the demo above, you already saw it — the dot product doubled while the arrows did not turn at all.</p>

<div class="figure">
<pre>[1, 0] · [100, 0]  =  100
[1, 0] · [  1, 0]  =    1</pre>
</div>

<p>Both pairs point in <em>precisely</em> the same direction. The first scores 100× higher purely because one vector is bigger. If those were documents, a long document would beat a short one on every query regardless of topic. Not what you want.</p>

<p>The fix is to divide out the magnitudes. The <strong>magnitude</strong> (also called length, or norm) is Pythagoras extended to any number of dimensions — square everything, sum, take the root:</p>

<div class="figure">
<pre>|[3, 4]|  =  √(3² + 4²)  =  √25  =  5</pre>
</div>

<p>Divide the dot product by both magnitudes and you get <strong>cosine similarity</strong>:</p>

<div class="figure">
<pre>cos_sim(a, b)  =  (a · b) / (|a| × |b|)</pre>
</div>

<p>The answer is now always between −1 and 1, and magnitude is gone. Only <em>direction</em> survives:</p>

<div class="tablewrap">
<table>
  <thead><tr><th>Value</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td class="num">1.0</td><td>identical direction</td></tr>
    <tr><td class="num">0.7</td><td>strongly related</td></tr>
    <tr><td class="num">0.0</td><td>unrelated, perpendicular</td></tr>
    <tr><td class="num">−1.0</td><td>opposite</td></tr>
  </tbody>
</table>
</div>

<p>This function is how semantic search works, how RAG retrieves documents, how "customers who liked X also liked Y" works, and how a vector database ranks results. It is four lines of arithmetic, and it is exercise 6. Here it is doing the job:</p>

<div data-widget="search"></div>

<h2>Why NumPy exists</h2>

<p>Python is slow, and it is worth knowing precisely <em>why</em>, because "NumPy is optimised" is not an answer — it is a way of not having one.</p>

<p>Every value in a Python list is a full heap object carrying a type pointer and a reference count, and the list holds pointers to them. Adding two of them means following a pointer, checking a type, unboxing a number, adding, then allocating a new object for the result. NumPy stores the raw numbers side by side in one block of memory and pushes the loop into compiled C, where one instruction can operate on several values at once.</p>

<div class="codeblock">
<div class="cap">The vectorised mental model</div>
<pre><code class="language-python">import numpy as np

a = np.array([1.0, 2.0, 3.0])
b = np.array([4.0, 5.0, 6.0])

a + b        # array([5., 7., 9.])   elementwise, no loop
a * b        # array([4., 10., 18.]) elementwise multiply, NOT matrix multiply
a * 2        # array([2., 4., 6.])   the scalar broadcasts across the array
a.sum()      # 6.0
a.shape      # (3,)  — check this when confused. always.</code></pre>
</div>

<p>The mental shift, and it is a real one coming from imperative code: <strong>stop thinking "for each element, do X". Start thinking "apply X to the whole array".</strong></p>

<div class="callout">

  <p>Writing a Python <code>for</code> loop over a NumPy array costs roughly 200× in speed. The tests in this lesson reject it outright. Once all seven pass, run the benchmark and see the gap on your own machine.</p>

<h2>Solutions</h2>

<div class="callout danger">
  <span class="lbl">Read this before you open anything below</span>
  <p>Every solution is collapsed, and opening one is a deliberate act. That is the whole design. <strong>Reading a correct solution produces the feeling of understanding without the substance of it</strong> — you will nod along, it will make complete sense, and you will not be able to reproduce it a week later. Recognition and production are different skills, and only one of them transfers.</p>

<details class="solution">
<summary>Exercise 1 — <code>dot_loop</code></summary>
<div class="codeblock">
<pre><code class="language-python">def dot_loop(a: list[float], b: list[float]) -> float:
    if len(a) != len(b):
        raise ValueError("The lengths of the two lists must be equal.")

    total = 0.0
    for i in range(len(a)):
        total += a[i] * b[i]
    return total</code></pre>
</div>
<p class="why">The accumulator starts at <code>0.0</code> rather than <code>0</code> so the return type is a float even for integer inputs. Indexing with <code>range(len(a))</code> is the one place in this lesson where an index is genuinely needed — you are walking two lists in step.</p>
</details>

<details class="solution">
<summary>Exercise 2 — <code>dot_numpy</code></summary>
<div class="codeblock">
<pre><code class="language-python">def dot_numpy(a: np.ndarray, b: np.ndarray) -> float:
    return float(np.dot(a, b))</code></pre>
</div>
<p class="why"><code>np.matmul(a, b)</code> and <code>a @ b</code> are equally correct here. They agree with <code>np.dot</code> for 1-D inputs and diverge only in higher dimensions. The <code>float()</code> matters more than it looks: without it you return <code>np.float64</code>, which behaves almost like a Python float right up until it does not — it will not JSON-serialise, and it leaks numpy semantics into code that expected a plain number.</p>
</details>

<details class="solution">
<summary>Exercise 3 — <code>magnitude_loop</code></summary>
<div class="codeblock">
<pre><code class="language-python">def magnitude_loop(v: list[float]) -> float:
    squared = [x ** 2 for x in v]
    return math.sqrt(sum(squared))</code></pre>
</div>
<p class="why">A comprehension plus <code>sum()</code> is idiomatic Python and allowed here — exercise 1 already proved you can accumulate by hand, and the point of this one is Pythagoras. <code>sum(x ** 2 for x in v)</code> using a generator instead of a list is marginally better for very long inputs, since it never materialises the intermediate list.</p>
</details>

<details class="solution">
<summary>Exercise 4 — <code>magnitude</code></summary>
<div class="codeblock">
<pre><code class="language-python">def magnitude(v: np.ndarray) -> float:
    return float(np.sqrt(np.sum(np.square(v))))</code></pre>
</div>
<p class="why"><code>np.linalg.norm(v)</code> does the same job in one call and is what you would reach for in real code. Write it out at least once, though — seeing <code>square</code>, <code>sum</code> and <code>sqrt</code> compose into a single expression is where the vectorised style starts to feel natural. Neither version survives extreme inputs: both overflow to <code>inf</code> around <code>1e200</code>, because both square before summing.</p>
</details>

<details class="solution">
<summary>Exercise 5 — <code>normalise</code></summary>
<div class="codeblock">
<pre><code class="language-python">def normalise(v: np.ndarray) -> np.ndarray:
    length = magnitude(v)
    if length == 0:
        raise ValueError("Cannot normalise a zero vector.")
    return v / length</code></pre>
</div>
<p class="why">Calling <code>magnitude(v)</code> rather than rewriting the formula gives you one source of truth. Naming the local <code>length</code> and not <code>magnitude</code> matters — a local of the same name shadows the function, and the next person to add a second call inside this function gets a confusing <code>TypeError</code>.</p>
</details>

<details class="solution">
<summary>Exercise 6 — <code>cosine_similarity</code></summary>
<div class="codeblock">
<pre><code class="language-python">def cosine_similarity(a: np.ndarray, b: np.ndarray) -> float:
    a_magnitude = magnitude(a)
    b_magnitude = magnitude(b)
    if a_magnitude == 0 or b_magnitude == 0:
        raise ValueError("Cannot compute cosine similarity with a zero vector.")
    return float(np.dot(a, b) / (a_magnitude * b_magnitude))</code></pre>
</div>
<p class="why">The zero check is not required by the tests, but the cosine of an angle with a directionless vector is genuinely undefined, so raising beats returning a made-up number.</p>
<p class="why"><code>np.dot(normalise(a), normalise(b))</code> is equally correct and returns the identical value bit for bit — the second route from the walkthrough. It is shorter and inherits the zero-vector check from <code>normalise</code> for free. The version above was chosen only because it mirrors the formula in the docstring. Watch out for the trap in between: calling <code>normalise</code> where you meant <code>magnitude</code> gives you an array where a scalar belongs, and <code>if array == 0</code> raises "the truth value of an array with more than one element is ambiguous".</p>
</details>

<details class="solution">
<summary>Exercise 7 — <code>most_similar</code></summary>
<div class="codeblock">
<pre><code class="language-python">def most_similar(query: np.ndarray, library: dict[str, np.ndarray]) -> str:
    scores = {name: cosine_similarity(query, vector) for name, vector in library.items()}
    return max(scores, key=scores.get)</code></pre>
</div>
<p class="why">Iterating a dict yields its keys, and <code>key=</code> changes what gets <em>compared</em>, not what gets <em>returned</em> — so the comparison runs over scores while the return value is a name. <code>max(scores.values())</code> would hand you <code>0.998</code> with no way back to which item earned it.</p>
<p class="why">This is the definition, not the implementation. See the Compare step, and <code>stretch.py</code>, for the single-matmul version a real system uses.</p>
</details>

</div>

<p>What each exercise is really asking, and how the seven fit together. This explains the <em>mechanisms</em>, not the implementations — the code is yours to write.</p>

<p>The seven come in pairs. Each pair does the same maths twice: once by hand so you own it, once vectorised so you can use it.</p>

<h3>1 and 2 — the dot product, by hand and vectorised</h3>

<p>Exercise 1 is the definition as an algorithm: walk both lists together, multiply each pair, accumulate. The stepper near the top of this page is exactly what your loop does, one iteration per click. The length check matters because the operation is <em>undefined</em> for mismatched lengths — there is no sensible answer, so failing loudly beats guessing.</p>

<p>Exercise 2 is the same result with the loop pushed into compiled C. Worth knowing: <code>np.dot</code> and <code>np.matmul</code> (also spelled <code>@</code>) agree for 1-D inputs but diverge for higher dimensions — <code>np.dot</code> sums over the last axis of one and the second-to-last of the other, while <code>matmul</code> broadcasts stacks of matrices. For two vectors, either is right.</p>

<figcaption>The zero vector is the one case with no answer: it has no direction to preserve, and the division would be by zero. Raising an error there is not defensive padding — it is the honest response to a question with no meaningful result.</figcaption>
</figure>

<h3>6 — cosine similarity, and why the division works</h3>

<p>One identity sits underneath the whole exercise:</p>

<div class="figure">
<pre>a · b  =  |a| × |b| × cos θ</pre>
</div>

<p>The dot product was never purely about agreement — it is agreement <strong>scaled by both lengths</strong>. That is precisely the flaw demonstrated earlier: pressing <span class="mono">× 2</span> doubles the number without turning the arrows at all. Divide both sides by <code>|a| × |b|</code> and the lengths cancel, leaving the angle alone. You are not inventing a metric; you are rearranging an identity to isolate what you actually wanted.</p>

<p>The name is not decoration either. cos(0°) = 1, cos(90°) = 0, cos(180°) = −1 — the function already had the range and the meaning we wanted. Nobody designed that; it fell out.</p>

<h3>7 — search, and the version you have not written yet</h3>

<p>Exercise 7 is short because exercise 6 did the work. The one piece of Python worth pinning down is <code>max(scores, key=scores.get)</code>: iterating a dict yields its <strong>keys</strong>, and <code>key=</code> changes what gets <em>compared</em>, not what gets <em>returned</em>. So the comparison runs over scores while the return value is a name. Reaching for <code>max(d.values())</code> instead gives you <code>0.998</code> with no way back to which item earned it.</p>

<p>That solution is the definition. It is not the implementation a real system uses.</p>

<template id="lesson-1.2-lesson">
<div class="prose">

<p class="lead">In 1.1 you built a search engine and it worked. Here is what I did not tell you: there is more than one way to measure "closest", and they do not always agree — not in an edge case, but routinely, on ordinary data, in a way that changes which document your system returns.</p>

<h2>Two questions, not one</h2>

<p>Take two vectors. There are two completely different things you might mean by "how close are these?"</p>

<p><strong>How far apart are they?</strong> Stand at one and walk to the other. That is <strong>distance</strong>, and it is Pythagoras again — the same formula as <code>magnitude</code>, applied to the gap between the two points instead of to one point.</p>

<div class="codeblock">
<pre><code class="language-python">distance(a, b)  =  |a - b|</code></pre>
</div>

<p>Read it right to left: subtract to get the vector from <code>b</code> to <code>a</code>, then take its length. You already have <code>magnitude</code>. Distance is <code>magnitude</code> of the difference, and that is the whole of exercises 1 and 2.</p>

<p><strong>Do they point the same way?</strong> Ignore how long each one is; ask only about direction. That is the <strong>angle</strong>, and cosine similarity — which you already wrote — is one step away from it.</p>

<p>Two vectors can be far apart and point identically. Two vectors can be close together and point in different directions. Neither measure is wrong. They answer different questions.</p>

<h2>Where they disagree</h2>

<p>Say documents are represented by two numbers: how much they talk about cooking, and how much they talk about baking.</p>

<figure class="diagram">

<h2>Which one do you want?</h2>

<ul>
  <li><strong>Text, embeddings, recommendations</strong> — anything where "length" means "amount of document" rather than "amount of the thing" — use the <strong>angle</strong>. A long article about cats and a short article about cats are about the same thing.</li>
  <li><strong>Positions, coordinates, physical measurements</strong> — anything where magnitude is the signal — use <strong>distance</strong>. Readings of 20&#176;C and 200&#176;C are not "the same, just louder".</li>
</ul>

<p>There is a shortcut worth knowing. <strong>If every vector is normalised to length 1, the two measures rank identically.</strong> They are not equal — still different numbers — but sorting by one gives the same order as sorting by the other. That is why production vector databases store embeddings pre-normalised: you get to use fast distance-search hardware and still get cosine ranking. <code>stretch.py</code> makes you prove it rather than believe it.</p>

<h2>The identity that connects them</h2>

<p>One equation ties the dot product to geometry, and it is worth committing to memory:</p>

<div class="codeblock">
<pre><code class="language-python">a . b  =  |a| &#215; |b| &#215; cos(theta)</code></pre>
</div>

<p>In words: the dot product is the product of the two lengths, scaled by how aligned the directions are. Read it three ways, because each one is used somewhere later.</p>

<ol>
  <li><strong>Solve for cos(theta)</strong> and you get cosine similarity, which is what you wrote in 1.1. You were not inventing a metric. You were rearranging this.</li>
  <li><strong>Set theta to 90&#176;.</strong> cos(90&#176;) = 0, so the whole right-hand side is 0. "Dot product of zero means unrelated" is not an analogy — it is this equation.</li>
  <li><strong>Set both lengths to 1.</strong> The right-hand side becomes just cos(theta), so for unit vectors <em>the dot product already is the cosine</em>, with nothing to divide out.</li>
</ol>

<h2>Two silent failures</h2>

<p>Both of these bite on the easiest possible input, and neither raises anything.</p>

<p><strong>arccos of a number just outside its domain is <code>nan</code>.</strong> <code>arccos</code> is defined on <code>[-1, 1]</code>. Compute the cosine of a vector with <em>itself</em> and floating point hands you 1.0000000000000002, because the division does not land precisely on 1. Two identical vectors — the easiest case imaginable — is where this bites. One call to <code>np.clip</code> fixes it.</p>

<p><strong>And even clipped, a zero angle is not exactly zero.</strong> Ask for the angle between <code>[2,2]</code> and <code>[10,10]</code> and you get <code>1.2e-06</code> degrees. That is <code>arccos</code> being <em>ill-conditioned</em> near 0&#176;: since <code>cos(t) &#8776; 1 - t&#178;/2</code>, the cosine barely moves as the angle moves, so run backwards the angle moves enormously as the cosine moves. A cosine wrong in its last bit comes back as an angle wrong by about <code>1e-6</code> degrees. When you need "do these point the same way?" to full precision, ask it of the <strong>cosine</strong>, which is well-conditioned there, not of the angle.</p>

<p><strong><code>== 0</code> reports False on a textbook right angle.</strong> Two vectors perpendicular in exact arithmetic give you <code>3.06e-17</code>, because 0.1 + 0.2 is not 0.3 and never was. Compare against a tolerance. Build the reflex here, on four lines you can see all of, rather than at 2am inside something you cannot.</p>

<h2>Projection: splitting a vector in two</h2>

<p>This is the idea with the longest reach in the lesson, and it starts with a picture. Shine a light straight down onto the line through <code>b</code>. The shadow <code>a</code> casts on that line is the <strong>projection of a onto b</strong>.</p>

<p>The leftover — <code>a</code> minus its projection — is the <strong>rejection</strong>, and it is always perpendicular to <code>b</code>. That is exercise 5, and it is one line.</p>

<h2>Why projection matters more than it looks</h2>

<p>"Split a vector into the part explained by a direction, and the part that is not" is one of the most reused moves in the field:</p>

<ul>
  <li><strong>Least squares regression</strong> finds the projection of your data onto the space your model can reach. The rejection is the residual — your error.</li>
  <li><strong>PCA</strong> (lesson 2.12) finds the directions that leave the smallest rejection. That is all "principal component" means.</li>
  <li><strong>Attention</strong> in a transformer decides how much of one token's vector to mix into another. The amount is a dot product; the mixing is projection.</li>
  <li><strong>Gram-Schmidt</strong>, which you meet near QR decomposition, is literally "project, subtract the projection, repeat".</li>
</ul>

<p>You are writing four lines. They come back for the rest of the curriculum.</p>

<h2>Where these formulas come from</h2>

<p>Every formula in this lesson can be built rather than memorised, and building one is how you end up able to reconstruct it a year from now. Each derivation below stops one step short of the finished expression — that last step is the exercise, and it is deliberately yours.</p>

<p>Notation, stated once so nothing arrives unannounced: <code>a · b</code> is the dot product from 1.1, and <code>|a|</code> is the length of <code>a</code>, also from 1.1. Nothing else is introduced in this lesson.</p>

<h3>Distance, from something you already have</h3>

<p>Two points, and you want the gap. Subtracting them position by position gives you a third thing — and the useful realisation is that this third thing is <strong>itself a vector</strong>, the one that runs from <code>b</code> to <code>a</code>.</p>

<p>One thing worth noticing before you write it: <code>(&#8722;3)&#178;</code> and <code>3&#178;</code> are the same number. So whichever order you subtract in, the squares are identical — which is why distance can never depend on which point you started from.</p>

<h3>The identity, which is given rather than derived</h3>

<p>This one is not an exercise and not something to work out. It is the fact the rest of the lesson stands on, so here it is in full, with numbers:</p>

<div class="codeblock">
<div class="cap">the dot product, written geometrically</div>
<pre><code>a &#183; b  =  |a| &#215; |b| &#215; cos(theta)

a = [1, 0]      a &#183; b = 1&#215;1 + 0&#215;1 = 1
b = [1, 1]      |a| = 1
                |b| = &#8730;2 = 1.414

                so:  1  =  1 &#215; 1.414 &#215; cos(theta)</code></pre>
</div>

<p>In words: the dot product is the two lengths multiplied together, scaled down by how aligned the directions are. Everything else in this lesson is this equation, rearranged.</p>

<h3>The angle: three questions</h3>

<h3>Projection: let two cases tell you the answer</h3>

<p>This is the one worth deriving rather than being told, because the derivation explains a property you would otherwise have to take on faith.</p>

<p>You want the shadow of <code>a = [3, 3]</code> on the line through <code>b</code>. Here is the same question asked twice, with a <code>b</code> that points the same way but is five times longer. The shadow cannot move — the <em>line</em> is identical, and a shadow falls on a line, not on an arrow.</p>

</figure>

<h3>Rejection: one subtraction</h3>

<p>Once you have the part of <code>a</code> that lies along <code>b</code>, the rest of <code>a</code> is whatever is left when you take that part away. With <code>a = [3, 3]</code> and a shadow of <code>[3, 0]</code>, you should be able to say what the leftover is without writing anything down — and then check that it meets <code>b</code> at a right angle by taking one dot product.</p>

<p>That perpendicularity is not luck. You removed every part of <code>a</code> that pointed along <code>b</code>, so nothing pointing along <code>b</code> can remain.</p>

<h3>Orthogonality: read it off the identity</h3>

<p>Put <code>theta = 90&#176;</code> into <code>a &#183; b = |a| &#215; |b| &#215; cos(theta)</code>. Since <code>cos(90&#176;) = 0</code>, the entire right-hand side collapses, whatever the two lengths are. That is the test, and it is why "a dot product of zero means unrelated" was never an analogy.</p>

<p>The complication is not the maths, it is the arithmetic your computer does. Two vectors that are perpendicular in theory will hand you <code>3.06e-17</code> rather than <code>0</code>, so a test written with <code>==</code> reports a textbook right angle as not a right angle. What you compare against instead is the <code>tol</code> parameter already sitting in the signature.</p>

<h2>What the tests check that you might not</h2>

<p>These are not there to be awkward. Each one is a property that must hold, and each one has caught somebody.</p>

<ul>
  <li><strong>Distance is symmetric.</strong> <code>distance(a, b)</code> must equal <code>distance(b, a)</code>. If you subtract in one order and forget that squaring removes the sign, you will not notice until it matters.</li>
  <li><strong>Exercise 2 must agree with exercise 1.</strong> Two implementations of the same idea, checked against each other on the same input. If they disagree, one of them is wrong and you get to find out which.</li>
  <li><strong>Scaling must not change an angle.</strong> <code>angle_between([2,2], [10,10])</code> is zero. If your answer moves when a vector gets longer, you have not divided out the magnitudes.</li>
  <li><strong>The projection must point along b.</strong> Checked with a cross product, which is zero exactly when two vectors are parallel.</li>
  <li><strong>project + reject must reconstruct a.</strong> The two pieces are a decomposition, so they must add back to what you started with. This is checked on random vectors in six dimensions, where you cannot eyeball it.</li>
  <li><strong>The rejection must be perpendicular to b.</strong> Not approximately, by argument &#8212; measured, with a dot product.</li>
</ul>

<figcaption>The right angle is not a coincidence to check afterwards — it is what subtracting the projection <em>means</em>. You removed every part of <code>a</code> that lay along <code>b</code>, so nothing along <code>b</code> can be left. This split is what least squares, PCA and an attention head are all doing.</figcaption>
</figure>

<p>The formula is a ratio of two dot products, and the reason it is a ratio is the useful part. <code>a·b</code> tells you how aligned the two are, but it grows if <code>b</code> gets longer. Dividing by <code>b·b</code> removes exactly that growth, which is why doubling <code>b</code> does not move the answer. Then you travel that far <em>along</em> <code>b</code>, which means multiplying by <code>b</code>.</p>

<p>You could also write it as <code>np.dot(a, unit_b) * unit_b</code> using your <code>normalise</code> from 1.1. That is the same arithmetic with the normalisation done once explicitly rather than folded into the ratio, and it is arguably clearer about what is happening. Either is correct; knowing they are the same thing is the point.</p>

<p>Exercise 5 is one line, and if it is more than one line you have not used exercise 4. The property the test checks — that the two pieces add back to <code>a</code>, and that the leftover is perpendicular to <code>b</code> — is not a coincidence to verify, it is the definition. You are splitting a vector into two components along perpendicular directions.</p>

<h2>6 — the tolerance</h2>

<figure class="diagram" data-solution="6">
<svg viewBox="0 0 620 220" role="img" aria-label="A number line near zero. A dot product of 3.06e-17 from two genuinely perpendicular vectors sits just off zero. A tolerance of 1e-9 includes it. A tolerance of 1e-30 excludes it and reports a right angle as not a right angle. A tolerance of 0.1 is so wide it also admits a visible 45 degree angle.">
  <line x1="60" y1="96" x2="560" y2="96" class="sep"></line>
  <line x1="70" y1="88" x2="70" y2="104" class="conn"></line>
  <text x="70" y="124" class="lbl-sm" text-anchor="middle">0</text>

  <line x1="150" y1="88" x2="150" y2="104" class="conn-hl"></line>
  <text x="150" y="80" class="lbl-hl" text-anchor="middle">3.06e−17</text>
  <text x="150" y="124" class="lbl-sm" text-anchor="middle">a real right angle</text>

  <line x1="330" y1="88" x2="330" y2="104" class="conn"></line>
  <text x="330" y="124" class="lbl-sm" text-anchor="middle">1e−9</text>

  <line x1="520" y1="88" x2="520" y2="104" class="conn"></line>
  <text x="520" y="124" class="lbl-sm" text-anchor="middle">0.1</text>

  <rect x="60" y="150" width="172" height="52" rx="4" class="box"></rect>
  <text x="78" y="172" class="head">tol = 1e−30</text>
  <text x="78" y="192" class="lbl-sm">rejects a real right angle</text>

  <rect x="244" y="150" width="172" height="52" rx="4" class="box-hl"></rect>
  <text x="262" y="172" class="head">tol = 1e−9</text>
  <text x="262" y="192" class="lbl-sm">the useful middle</text>

  <rect x="428" y="150" width="172" height="52" rx="4" class="box"></rect>
  <text x="446" y="172" class="head">tol = 0.1</text>
  <text x="446" y="192" class="lbl-sm">admits a 45° angle</text>
</svg>
<figcaption><code>== 0</code> is the leftmost box taken to its limit: a tolerance of exactly nothing, which rejects every real right angle a computer will ever hand you. Picking <code>tol</code> is a decision about what "close enough" means for your data, not a default to copy.</figcaption>
</figure>

<p>The trap is <code>== 0</code>. The subtler question is what tolerance to pick, and it is worth thinking about for a minute rather than copying <code>1e-9</code> because it was in the signature.</p>

<p>Too tight — say <code>1e-30</code> — and genuinely perpendicular vectors are reported as not perpendicular, because the rounding error is bigger than your threshold. Too loose — say <code>0.1</code> — and vectors that are visibly not perpendicular pass. The default here is a reasonable middle for vectors of modest size. For very large or very small vectors, an absolute tolerance on the dot product is the wrong tool entirely; you would scale it by the magnitudes, or compare the cosine instead. That is what <code>np.isclose</code>'s <code>rtol</code> exists for.</p>

<h2>7 — the same search, one thing changed</h2>

<p>This is exercise 7 of 1.1 with <code>cosine_similarity</code> swapped for <code>distance</code> and <code>max</code> swapped for <code>min</code>. If it took you longer than that, check whether you rewrote something you already had.</p>

<p>The interesting part is not the code, it is the result. Run it beside <code>most_similar</code> from 1.1 on the same library and watch them disagree. The disagreement is the lesson; the function is just how you get to see it.</p>

<p>The empty-library check is worth a thought too. Returning <code>None</code> would push the failure somewhere further away — some caller would do <code>results[None]</code> half a second later and you would debug the wrong function. Raising here puts the error where the mistake is.</p>

<template id="lesson-1.3-lesson">

<p class="lead">For two lessons you have worked with one vector at a time. Real data does not arrive one at a time — it arrives as a table, one row per thing. This lesson is about doing something to every row at once, without a loop, and it ends with the search from 1.1 written the way a real system writes it.</p>

<h2>A matrix is a stack of the vectors you already have</h2>

<div class="codeblock">
<pre><code>X = [[8, 7, 0],      &#8592; "cooking"      one row = one thing
     [7, 9, 0],      &#8592; "baking"
     [0, 0, 8],      &#8592; "rust"
     [1, 0, 9]]      &#8592; "python"</code></pre>
</div>

<p>Not a new kind of object with new rules. What is new is doing something to all of them at once, and the whole lesson is the two tools that let you.</p>

<h2>Shape is the thing you check</h2>

<p>Every numpy array has a <code>.shape</code>: a tuple saying how big it is along each axis. For a table that is <code>(rows, columns)</code>, written here as <code>(n, d)</code> — <strong>n</strong> things, each with <strong>d</strong> numbers.</p>

<h2><code>axis</code>: which direction do you collapse?</h2>

<p><code>X.sum()</code> adds everything and gives one number. Usually you want one number <em>per row</em> or one <em>per column</em>, and <code>axis</code> says which.</p>

<p>The rule that makes this stick: <strong>the axis you name is the one that disappears.</strong></p>

<h2>Broadcasting: the rule, and then the reason</h2>

<p>You want to subtract three column averages from a <code>(2, 3)</code> table. Different shapes, and numpy does it anyway. The rule is shorter than its reputation:</p>

<ol>
  <li><strong>Line the shapes up from the right.</strong></li>
  <li>Two dimensions are compatible if they are <strong>equal</strong>, or if <strong>one of them is 1</strong>.</li>
  <li>A shape that runs out on the left is treated as 1s.</li>
</ol>

<figure class="diagram">
<svg viewBox="0 0 620 250" role="img" aria-label="Two worked cases. A two by three table against a shape three row broadcasts, because three matches three and two stretches against one. A two by three table against a shape two array fails, because three against two are unequal and neither is one.">

  <text x="52" y="68" class="head">this works</text>
  <text x="52" y="98" class="lbl">X       (2, 3)</text>
  <text x="52" y="120" class="lbl">mean       (3)</text>
  <text x="52" y="142" class="lbl">mean    (1, 3)</text>
  <text x="52" y="168" class="lbl-sm">3 vs 3: equal</text>
  <text x="52" y="186" class="lbl-sm">2 vs 1: stretch it</text>
  <text x="180" y="142" class="lbl-sm">&#8592; missing left is 1</text>

  <rect x="322" y="40" width="270" height="170" rx="4" class="box-hl"></rect>
  <text x="344" y="68" class="head">this is the one you will hit</text>

<figcaption>You wanted those two numbers to go <em>down</em> the rows. Numpy lined them up against the columns, because lining up from the right is the only rule it has.</figcaption>
</figure>

<h2><code>keepdims</code>, and the bug that says nothing</h2>

<p>This is the sharpest edge in the lesson. You want every row of <code>X</code> scaled to length 1, and you have one length per row — shape <code>(n,)</code>. Divide, and numpy lines that up against the <strong>columns</strong>.</p>

<figure class="diagram">

<div class="callout">
  <span class="lbl">Why this one gets a whole section</span>
  <p>On a <strong>square</strong> table the bug is completely silent: the shapes are compatible, nothing raises, the answer is wrong. The tests for exercise 4 use a non-square table on purpose so numpy raises instead — but a real dataset will not do you that favour.</p>
</div>

<h2>Transpose, and every dot product at once</h2>

<p><code>X.T</code> swaps rows and columns. <code>(4, 3)</code> becomes <code>(3, 4)</code>, and what was at <code>[i, j]</code> is now at <code>[j, i]</code>. Nothing is computed; the same numbers are read the other way round.</p>

<div class="codeblock">
<pre><code>A = [[1, 2],          A.T = [[1, 3, 5],
     [3, 4],                 [2, 4, 6]]
     [5, 6]]

shape (3, 2)                 shape (2, 3)</code></pre>
</div>

<p>Now the other half. <code>@</code> between two matrices pairs <strong>every row of the left with every column of the right</strong>, and each pairing is a dot product:</p>

<div class="codeblock">
<pre><code>A = [[1, 2],     B = [[1, 0, 1],      A @ B = [[1,  4,  7],
     [3, 4],          [0, 2, 3]]               [3,  8, 15],
     [5, 6]]                                   [5, 12, 23]]

    (3, 2)     @     (2, 3)      -&gt;            (3, 3)</code></pre>
</div>

<p>Check one by hand: entry <code>[0, 1]</code> is row 0 of <code>A</code> against column 1 of <code>B</code>, which is <code>1&#215;0 + 2&#215;2 = 4</code>.</p>

<p>Read the shapes. The inner numbers must match — they are the length of the vectors being dotted — and they vanish, leaving the outer ones. That is how you predict a matmul's shape without thinking about the arithmetic, and it is worth doing every time before you write the line.</p>

<p><strong>Now put the two halves together.</strong> You want every row of <code>X</code> dotted with every row of <code>X</code>. <code>@</code> pairs rows on the left with <em>columns</em> on the right. So what does the right-hand side need to be? That question is exercise 5, and the answer is one operation where a loop would have been <em>n</em>&#178; of them.</p>

<h2>A new axis out of nothing</h2>

<p>Sometimes you need every <em>pair</em> of rows rather than every pair of dot products — every difference, so you can take every distance. <code>X[:, None, :]</code> inserts an empty axis. Read it as "every row, a new empty axis, every column".</p>

<figure class="diagram">

<h2>Build each one in stages</h2>

<p>Every exercise past the second is two or three operations composed. Do not write the whole line and then debug it. Write one operation, print its <code>.shape</code>, check it is what you predicted, then add the next.</p>

<p>That loop feels slow for about ten minutes and then stops being slow, because you start predicting correctly. It is the single habit this lesson exists to build.</p>

<h2>What the tests check that you might not</h2>

<ul>
  <li><strong>Shape follows the rows, not the columns.</strong> Exercise 2 is tested on a 4&#215;3 as well as a 2&#215;2, so a divisor lined up the wrong way cannot pass by coincidence.</li>
  <li><strong>Centring moves the data without changing its spread.</strong> Checked by confirming the differences between rows are identical before and after.</li>
  <li><strong>Directions survive normalisation.</strong> Every row of the result must be a positive multiple of the row it came from — scaling a row must not turn it.</li>
  <li><strong>The Gram matrix equals its own transpose.</strong> Row <em>i</em> dotted with row <em>j</em> is the same number as row <em>j</em> dotted with row <em>i</em>, so anything else means the pairing went wrong.</li>
  <li><strong>The distance matrix has a zero diagonal.</strong> A row is zero distance from itself. If your diagonal is not zero, your indices are crossed.</li>
  <li><strong>Scaling the library must not reorder a cosine ranking.</strong> Exercise 7 is tested with rows scaled by 90&#215;, because cosine is supposed to ignore exactly that.</li>

<figcaption><code>@</code> wants columns on its right-hand side, and <code>.T</code> turns rows into columns. Put together, every row meets every row — <em>n</em>&#178; dot products in one operation.</figcaption>

<p>Two facts, combined: <code>.T</code> turns rows into columns, and <code>@</code> pairs rows on the left with columns on the right. Once you see that the second one wants columns and the first one produces them, the exercise is one operation.</p>

<p>The habit to take from this is shape arithmetic. <code>(n, d) @ (d, n)</code> gives <code>(n, n)</code>: the inner numbers must match and they vanish, the outer ones survive. Do that before writing the line and matmul stops being a source of surprises.</p>

<p>Three checks you can do in your head, and should: the result is square, it equals its own transpose, and entry <code>[i, i]</code> is a row dotted with itself, which is its length squared. If any of those fails, you have paired the wrong things.</p>

<p>The move is the new axis. Both operands are the same data; inserting an empty dimension in different places makes broadcasting produce every pair rather than element-by-element results.</p>

<p>Then the collapse. The components live on the last axis now, and <code>axis=-1</code> says "the last one" without you having to count. Getting into that habit early pays off once arrays have four and five axes.</p>

<p>What this exercise does <em>not</em> tell you is that it does not scale, and that is what <code>stretch.py</code> is for. You build an <code>(n, n, d)</code> array to produce an <code>(n, n)</code> answer, so you pay <em>d</em> times the memory of your result. At <code>d = 128</code> that is a factor of 128, and it is the reason production code uses an algebraic identity instead. The stretch file walks you to it.</p>

<p>Three lessons have now written the same search three times. 1.1 looped a dictionary and returned one name. 1.2 did the same by distance. This one does not loop at all.</p>

<p>Build it in stages and check the shape at each: normalise the rows, normalise the query, and one matmul gives you <em>n</em> similarities. That last step is worth sitting with — a matrix against a vector is the same pairing rule as a matrix against a matrix, with the right-hand side happening to have one column.</p>

<p><code>np.argsort</code> returns the positions that would sort an array, ascending. You want descending, and there are at least three ways to get it; the one you pick is a style choice, but be able to say which you used and why. Then one comprehension turns positions into names, which is the single loop this exercise allows.</p>

<p>The test that scales the library by 90&#215; is the one that matters. Cosine is supposed to ignore length, so a ranking that moves when you scale a row is not a cosine ranking, however plausible its numbers look.</p>

<h2>The same numbers, a different question</h2>

<p>In 1.3 a matrix was a filing cabinet. <code>X</code> had one row per document and one column per feature, and every operation was about organising numbers.</p>

<p>This lesson takes the same object &#8212; the same grid, stored the same way &#8212; and asks something else of it. Not <em>what does this matrix hold</em>, but <strong>what does this matrix do</strong>.</p>

<p>The answer is that a matrix is a function. It takes a vector in and hands a vector back, and the way it does that has a shape you can see. Both readings are used constantly, often on the same page. When the matrix holds your data it is a table; when it multiplies your data it is a transformation. A shape of <code>(3, 2)</code> that meant "three things, two features" yesterday means "takes 2-D in, gives 3-D out" today.</p>

<h2>A matrix takes a vector and gives back a vector</h2>

<p>Start small enough to check by hand. There are two ways to read <code>M @ v</code>, they always agree, and one of them explains far more than the other.</p>

<h2>Where the basis vectors land</h2>

<p>The <strong>basis vectors</strong> are the plainest ones there are: one 1, everything else 0. Run <code>[1, 0]</code> through the column reading and the weights are 1 and 0, so what comes out is column 0, untouched. <code>[0, 1]</code> picks out column 1.</p>

</figure>

<p>And knowing those two is enough to know where <em>everything</em> goes, because every vector is built from the basis. <code>v = [4, 5]</code> is 4 of the first arrow and 5 of the second, so afterwards it is 4 of wherever the first one went and 5 of wherever the second went: <code>4&#215;[2, 0] + 5&#215;[&#8722;1, 3] = [3, 15]</code>. The same arithmetic as before, read as a sentence.</p>

<p>Exercise 3 has you build this rather than take it from me, and the shape is the interesting part. <code>M</code> is <code>(d_out, d_in)</code>, and one image per input axis is <code>(d_in, d_out)</code>. Those are not the same shape.</p>

<h2>Rows and columns: the convention clash</h2>

<p>Here is the practical problem, and it is the one that will cost you real time. Every textbook, every video and every paper writes a transformation as acting on a single column vector, <code>M @ v</code>. Your data, since 1.3, is a table with <strong>one thing per row</strong>, because that is how records are stored.</p>

<figure class="diagram">
<svg viewBox="0 0 620 272" role="img" aria-label="What you have: X of shape n by d_in, and M of shape d_out by d_in. What you want: n by d_out. The matmul rule pairs the last axis on the left with the first on the right and they must be equal. Lining up d_in against d_out fails, so another arrangement is needed.">
  <text x="40" y="32" class="head">what you have</text>
  <rect x="40" y="44" width="216" height="42" rx="4" class="box"></rect>
  <text x="58" y="70" class="lbl">X      (n, d_in)</text>
  <rect x="40" y="96" width="216" height="42" rx="4" class="box"></rect>
  <text x="58" y="122" class="lbl">M      (d_out, d_in)</text>

  <text x="330" y="32" class="head">what you want</text>
  <rect x="330" y="44" width="216" height="42" rx="4" class="box-hl"></rect>
  <text x="348" y="70" class="lbl-hl">(n, d_out)</text>
  <text x="348" y="122" class="lbl-sm">one moved row for each</text>
  <text x="348" y="140" class="lbl-sm">row you started with</text>

  <line x1="40" y1="164" x2="580" y2="164" class="sep"></line>
  <text x="40" y="190" class="lbl">@ pairs the LAST axis on the left with the FIRST on the right,</text>
  <text x="40" y="210" class="lbl">and those two numbers must be equal.</text>
  <text x="40" y="234" class="lbl-sm">(n, d_in) against (d_out, d_in) puts d_in opposite d_out, which fails.</text>
  <text x="40" y="256" class="lbl-sm">Write down the other arrangements, transposes included. One ends at (n, d_out).</text>
</svg>
<figcaption>Do not try both orders until one stops raising an error. On a square matrix both orders run and only one is right &#8212; the 1.3 <code>keepdims</code> lesson in new clothes. This is exercise 2, and when you read <code>x @ W.T</code> in someone's PyTorch code, it is this.</figcaption>
</figure>

<h2>What "linear" actually means</h2>

<p>"Linear" is not a soft word for "roughly straight". It is two rules, and a function either obeys them for every input or it is not linear: <code>f(a + b) == f(a) + f(b)</code>, and <code>f(s&#215;a) == s&#215;f(a)</code>. Adding first is the same as adding after; scaling first is the same as scaling after.</p>

<figure class="diagram">
<svg viewBox="0 0 620 255" role="img" aria-label="On the left, the linear function M times v: f of a plus b is one three, and f of a plus f of b is also one three, and f of zero is zero zero. On the right, the affine function M times v plus the constant one one: g of a plus b is two four while g of a plus g of b is three five, differing by the constant, and g of zero is one one, so the origin moved.">
  <text x="40" y="32" class="head">linear: f(v) = M @ v</text>
  <text x="40" y="62" class="lbl">f(a + b) = M @ [1, 1] = [1, 3]</text>
  <text x="40" y="84" class="lbl">f(a) + f(b) = [2, 0] + [&#8722;1, 3] = [1, 3]</text>
  <text x="40" y="108" class="lbl-hl">the same</text>
  <text x="40" y="140" class="lbl">f(0) = [0, 0]</text>
  <text x="40" y="160" class="lbl-sm">the origin cannot move</text>

  <text x="330" y="32" class="head">affine: g(v) = M @ v + [1, 1]</text>
  <text x="330" y="62" class="lbl">g(a + b) = [1, 3] + [1, 1] = [2, 4]</text>
  <text x="330" y="84" class="lbl">g(a) + g(b) = [3, 1] + [0, 4] = [3, 5]</text>
  <text x="330" y="108" class="lbl-hl">different, by exactly the bias</text>
  <text x="330" y="140" class="lbl">g(0) = [1, 1]</text>
  <text x="330" y="160" class="lbl-sm">the origin moved</text>

  <line x1="40" y1="186" x2="580" y2="186" class="sep"></line>
  <text x="40" y="212" class="lbl-sm">The right-hand side picked the bias up twice, once for each term. That is the whole failure.</text>
  <text x="40" y="236" class="lbl-sm">A neural network layer is the right-hand column: a matrix, and then a shift.</text>
</svg>
<figcaption>Put <code>s = 0</code> in the second rule and you get <code>f(0) = 0</code>: a linear function can never move the origin. A bias does, which is why <code>M @ v + c</code> has its own name &#8212; <strong>affine</strong> &#8212; and why exercise 4 spends its time here.</figcaption>
</figure>

<p>If you drew a grid on the plane and applied a matrix to every point, the grid lines would stay straight, stay parallel and stay evenly spaced, and the origin would not move. That is the picture those two rules make, and it is what 3Blue1Brown's chapter 3 animates.</p>

<h2>Decide where the basis goes, and the matrix writes itself</h2>

<p>Read the rule backwards and it becomes a construction kit. To build a transformation, decide where you want the basis vectors to land and write those down as the columns.</p>

<h2>Turning by an angle</h2>

<p>Rotation is the same construction, and it needs one fact from trigonometry that is smaller than it looks. Walk the point <code>[1, 0]</code> counter-clockwise around the unit circle by some angle. Where is it? <strong>That is the definition of cosine and sine.</strong> They are not formulas to memorise; they are the names of the two coordinates of that point.</p>

<h2>One after another</h2>

<p>You have a transformation <code>A</code> and another one <code>B</code>, and you want the result of doing <code>A</code> and then <code>B</code>. The composition of two linear functions is itself linear &#8212; neither step can bend a straight line &#8212; and every linear function is a matrix. So a <strong>single matrix</strong> does the pair, and finding it is exercise 6.</p>

<p>The order is where everyone slips, so use the shapes rather than the story. If the first transformation is <code>(k, d_in)</code> and the second is <code>(d_out, k)</code>, only one of the two possible products has the <code>k</code>s meeting in the middle, and it leaves you with <code>(d_out, d_in)</code> &#8212; the shape a single transformation from <code>d_in</code> to <code>d_out</code> has to have.</p>

<h2>Why this makes neural networks click</h2>

<p>A layer of a neural network does exactly two things to the rows it is handed: moves them with a matrix, and adds a bias to every row. That is exercise 7, and the <code>(n, d)</code> in, <code>(n, d_out)</code> out shape is why a network can process a whole batch at once.</p>

<h2>The one that costs people an afternoon</h2>

<p>Exercise 2 is the whole lesson's pinch point, and it is not about transformations at all &#8212; it is about two conventions meeting. A transformation matrix is written to act on a single vector standing up as a column. Your data, since 1.3, lies down: one thing per row.</p>

<div class="codeblock">
<div class="cap">exercises.py &#8212; the only file you edit</div>
<pre><code class="language-python">def transform(M: np.ndarray, X: np.ndarray) -&gt; np.ndarray:
    """EXERCISE 2 &#8212; move every row of your data at once.

    THIS IS THE ONE THAT BITES, and it is worth slowing down for. M is
    written to act on a single column vector, and your rows are not
    columns. So a transpose belongs somewhere in this expression, and
    the way to find where is the way 1.3 taught you &#8212; write the shapes
    down and line them up:

        (n, d_in) against (d_out, d_in). Which pairing is even defined,
        and what does the one that works leave you holding?
    """
    raise NotImplementedError("exercise 2")</code></pre>
</div>

<p>Resist trying both orders until one stops raising. On a square matrix both orders run, and only one of them is right &#8212; that is the <code>keepdims</code> bug from 1.3 in a new costume, and the tests use a non-square matrix so it cannot hide.</p>

<h2>Every one is checked for shape</h2>

<p>As in 1.3, the tests assert the shape as well as the values. Here the shapes carry meaning: <code>(d_out, d_in)</code> says what a transformation takes in and gives back, and a stack of layers is readable as a chain of those shapes.</p>

<h2>What the tests check that you might not</h2>

<ul>
  <li><strong>Weighting by a basis vector picks out a column.</strong> Exercise 1 is checked with <code>[1, 0]</code> and <code>[0, 1]</code> as well as ordinary weights, because that special case is exercise 3 arriving early.</li>
  <li><strong>Squashing to fewer dimensions is still a transformation.</strong> A <code>(1, 2)</code> matrix turns every row into one number, and the shape of that answer is <code>(n, 1)</code> rather than <code>(n,)</code>.</li>
  <li><strong>Which way a rotation turns.</strong> Counter-clockwise is the convention, and getting it backwards sends <code>[1, 0]</code> to <code>[0, -1]</code>. The test says so in its message.</li>
  <li><strong>A rotation preserves every length.</strong> Checked with <code>np.linalg.norm</code> on six random vectors, because a matrix that turns things and also stretches them is not a rotation.</li>
  <li><strong>45&#176; twice is 90&#176; once.</strong> Composition, one exercise early, and a good check that your matrix is a rotation rather than something that merely gets <code>[1, 0]</code> right.</li>
  <li><strong>Order, in both exercises that have one.</strong> <code>compose</code> is tested against applying the two transformations one at a time, and the stack in exercise 7 is tested against layers applied in the order they are listed.</li>
  <li><strong>A real Python <code>bool</code> from exercise 4.</strong> The same trap as 1.2 exercise 6: <code>np.all</code> hands you something that prints <code>True</code> and fails <code>is True</code>.</li>
</ul>

<h2>Build each one in stages</h2>

<p>Everything after exercise 2 is one or two operations. The habit from 1.3 still pays: write one operation, print its <code>.shape</code>, check it against what you predicted, then add the next.</p>

<p>For this lesson there is a second habit worth adding. When a transformation looks wrong, apply it to <code>[1, 0]</code> and <code>[0, 1]</code> and see where they went. That is two lines, and it tells you what your matrix actually does rather than what you meant it to do.</p>

<h2>Then run the demo</h2>

<p>Once all seven pass, run the file directly. It moves the four corners of a square through a scaling, a shear and a rotation, prints where the basis landed in each case, and then shows the same pair of transformations composed in both orders.</p>

<h2>The stretch, if you want it</h2>

<p><code>stretch.py</code> is optional and not scored, and this one is the most convincing file in the lesson. You collapse a whole stack of layers into a single layer &#8212; without algebra, by asking where the zero vector and the basis vectors go &#8212; and then break the collapse by putting <code>tanh</code> between the layers.</p>

<p>The two numbers you print are the argument for activation functions. Having measured them yourself is different from having been told.</p>

<template id="lesson-1.4-walkthrough">
<div class="prose">

<p class="lead">The mechanisms, not the implementations. No code here &#8212; that is yours to write, and there is nothing on this page you can copy.</p>

<h2>1 — combine_columns, and why it is done by hand</h2>

<p>The arithmetic here is the same arithmetic you would get from taking a dot product with each row, and no test can tell which one you wrote. The exercise exists because the two readings lead to different places.</p>

<p>The row reading says "the answer is a pile of dot products". True, and it stops there. The column reading says "the answer is the columns, mixed in the proportions <code>v</code> asks for" &#8212; and that keeps paying: it explains where the basis vectors land, it explains why a matrix is completely described by two arrows, and in 1.5 it explains what happens when a matrix has columns that duplicate each other.</p>

<p>Two error cases, and they are not decoration. Rows of different lengths are not a matrix, which 1.3 established. Weights that do not match the number of columns are a question with no answer &#8212; you would be asking for three lots of a column that does not exist.</p>

<h2>2 — transform, and the two conventions</h2>

<p>This is the exercise that costs people an afternoon, and none of the difficulty is about transformations. It is that two communities write the same operation differently, and both are in your code at once.</p>

<p>Mathematics writes the vector standing up, as a column, so a transformation multiplies from the left: <code>M @ v</code>. Data storage lies the vector down, as a row, because a row is a record and records go in tables. Both conventions are entrenched and neither is going to give way, so the translation is a permanent part of the job.</p>

<p>The way through is to stop reading the expression and start reading the shapes. <code>@</code> pairs the last axis of what is on its left with the first axis of what is on its right, and those two numbers have to be equal. You have <code>(n, d_in)</code> and <code>(d_out, d_in)</code>, you want <code>(n, d_out)</code>, and transposing either operand is allowed. There are only a few arrangements; write them out and one of them is the answer.</p>

<p>The failure mode is worth naming because it recurs: on a square matrix both arrangements run without complaint and one of them silently transposes your data. Non-square inputs turn a silent wrong answer into a loud error, which is why the tests use them.</p>

<h2>3 — basis_images, and the shape that surprises</h2>

<p>You can write this one from the sentence in the lesson and be right. Build it instead, by feeding the identity through exercise 2, because the shape that comes back is the part worth meeting.</p>

<p><code>M</code> is <code>(d_out, d_in)</code>. One image per input axis, with each image having <code>d_out</code> components, is <code>(d_in, d_out)</code>. The two are transposes of each other, and the reason is the convention clash from exercise 2 all over again: columns are where the images live in <code>M</code>, and rows are where they live when you ask for them as data.</p>

<p>If your answer is the right shape for the wrong reason, the identity check catches it: every basis vector of <code>np.eye(4)</code> must come back exactly where it started.</p>

<h2>4 — is_linear, and what a counterexample proves</h2>

<p>The two rules are the whole definition, so the code is a direct transcription: make some vectors, check the first rule, check the second, report whether both held.</p>

<p>Three decisions inside it are worth making deliberately. The vectors should come from a seeded generator, so that a run that passes today passes tomorrow for the same reason. The scalar must not be 0 or 1 &#8212; both are fixed points of the second rule for almost any function, so they prove nothing. And the comparison is against a tolerance, never <code>==</code>: floating point makes an exact comparison fail on functions that are perfectly linear, which is 1.2 exercise 6's lesson arriving in a new place.</p>

<p>The return type is the other half of 1.2 exercise 6. <code>np.allclose</code> gives you a real Python <code>bool</code>; <code>np.all</code> gives you a numpy boolean that prints identically, compares equal, and fails <code>is True</code>. The test asserts the type, so that this is a message rather than a mystery.</p>

<p>One thing to be honest with yourself about: a check like this can find a counterexample, and that is all. Passing means "I did not catch it", not "it is linear". That asymmetry &#8212; cheap to disprove, expensive to prove &#8212; is worth carrying well beyond this lesson.</p>

<h2>5 — rotation, and reading a point off a circle</h2>

<p>The temptation is to look the matrix up, and the exercise is worth more than the four numbers it produces. What you are practising is building a transformation out of a decision about where the basis goes, and rotation is the case where that skill has an answer you can check by drawing.</p>

<p>Cosine and sine are not two formulas. They are the two coordinates of the point you arrive at by walking counter-clockwise around the unit circle from <code>[1, 0]</code>. Say that out loud once and the first column of the matrix is not something you derive, it is something you read.</p>

<p>The second column is the exercise. <code>[0, 1]</code> begins a quarter turn ahead of <code>[1, 0]</code>, and a rotation moves everything by the same angle, so it stays a quarter turn ahead. Read that point off the same circle. Doing it at 90&#176; first &#8212; where every number is 0, 1 or &#8722;1 &#8212; lets you check the picture against arithmetic before you commit to the general case.</p>

<p>When it passes, the two properties in the tests are worth understanding rather than just satisfying: a rotation changes no length, and doing 45&#176; twice does what 90&#176; does once. A matrix that gets <code>[1, 0]</code> right and fails either of those is not a rotation.</p>

<h2>6 — compose, and the order that reads backwards</h2>

<p>Two facts meet here. A composition of linear functions is linear, because neither step can bend a straight line. And every linear function is a matrix. Put those together and a single matrix must exist that does both transformations, which is not obvious until you notice it cannot be otherwise.</p>

<p>Everyone gets the order wrong once, because the product reads right to left while the sentence reads left to right. Do not fix that by remembering a rule. Fix it by asking which arrangement the shapes permit: with <code>(k, d_in)</code> first and <code>(d_out, k)</code> second, only one order has the <code>k</code>s meeting, and it is the one that leaves <code>(d_out, d_in)</code>.</p>

<p>That the two orders differ at all is the genuinely new thing in this lesson. Addition, dot products and every arithmetic operation so far have not cared about order. Matrix multiplication does, and the test shows it with a turn and a mirror, which you can check by drawing on paper if the numbers ever look wrong.</p>

<h2>7 — forward, and what you have actually built</h2>

<p>The loop over layers is the job, so the exercise is not about avoiding it. What matters is that the loop runs over the <em>stack</em>, not the data: each layer moves every row at once, which is the difference between something that runs on a batch of five and something that runs on a batch of fifty thousand.</p>

<p>The bias is 1.3's broadcasting, and its shape says so. <code>(d_out,)</code> against <code>(n, d_out)</code> lines up from the right, the missing axis stretches, and one row of numbers is added to every row of the batch. If you find yourself building an <code>(n, d_out)</code> bias, stop and reread the broadcasting rule &#8212; you are copying something the library will do for free.</p>

<p>Now look at what you have when the tests pass: a batch of inputs, matrices that change the dimension as they go, biases, and a defined order. That is a neural network's forward pass, with one thing missing. The missing thing is anything non-linear between the layers, and everything you proved in exercise 6 says why that matters &#8212; the stack, as it stands, is one matrix and one bias in an elaborate costume.</p>

<p><code>stretch.py</code> is where you show that rather than believe it: collapse the stack into a single layer by asking where the zero vector and the basis vectors go, count the parameters you threw away, then put <code>tanh</code> between the layers and watch the collapse stop working.</p>

<p class="lead">Passing tests is the floor, not the finish. This is the part that decides whether any of it stays with you.</p>

<h2>You are done when</h2>

<p>Not when the tests pass &#8212; when you can answer these out loud, without looking anything up:</p>

<ol class="checkq">
  <li><code>M</code> is <code>(3, 2)</code>. How many components does its input have, and its output? Which of those two numbers is the row count?</li>
  <li>Where in a matrix do you look to find where <code>[0, 1]</code> lands? State it as a rule, not as an answer about one matrix.</li>
  <li>Your data <code>X</code> is <code>(100, 3)</code> and <code>M</code> is <code>(5, 3)</code>. Write the expression that moves every row, and say what shape comes out. What goes wrong in the other order?</li>
  <li>State the two rules that make a function linear. Which one does <code>f(v) = M @ v + c</code> break, and what happens to the origin under it?</li>
  <li>Why is a neural network layer affine rather than linear?</li>
  <li>Without computing anything: does a rotation change the length of a vector? Answer from the picture rather than the arithmetic.</li>
  <li>Give two transformations you can picture where the other order gives a different answer, and say where one specific point ends up in each case.</li>
  <li>Ten linear layers with nothing between them are equivalent to how many layers? Say why in one sentence, using the word "composition".</li>
  <li>What does <code>tanh</code> between the layers change about that answer?</li>
</ol>

<p>If one of those makes you hesitate, the fix is not to re-read this page. Open a Python prompt, build a 2&#215;2 matrix, and apply it to <code>[1, 0]</code> and <code>[0, 1]</code>. This lesson is learned by watching where two arrows go.</p>

<h2>Write your notes</h2>

<p><code>notes.md</code> in the lesson folder holds the same questions plus one more, asking which bug raised an error and which one handed you plausible numbers. Answer them in your own words &#8212; the <em>things I got wrong</em> section will be the most valuable thing in your repository six months from now.</p>

<div class="callout">
  <span class="lbl">What this sets up</span>
  <p>You can move space in any direction you like. Lesson <strong>1.5</strong> asks the opposite question: given where something <em>landed</em>, can you get back to where it started? Sometimes yes, sometimes no &#8212; and the cases where you cannot are the ones that explain what "singular", "rank" and "solving <code>Ax = b</code>" actually mean. Exercise 2 of this lesson, where a <code>(1, 2)</code> matrix squashes every row to a single number, is already an example of a transformation nobody can undo.</p>
