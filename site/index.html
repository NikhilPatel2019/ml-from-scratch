.btn-quiet {
  appearance: none; border: 1px solid var(--rule-firm); background: var(--paper);
  color: var(--ink-2); border-radius: 8px; font-family: var(--f-body); font-size: 13px;
  font-weight: 500; padding: 9px 14px; cursor: pointer; transition: color .15s, border-color .15s;
}
.btn-quiet:hover { color: var(--ink); border-color: var(--ink-3); }
.btn-quiet.ok { color: var(--done); border-color: var(--done); }
.btn-danger {
  appearance: none; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
  background: none; color: var(--danger); border-radius: 8px; font-family: var(--f-body);
  font-size: 13px; font-weight: 500; padding: 9px 14px; cursor: pointer; transition: background .15s;
}
.btn-danger:hover { background: var(--danger-wash); }

.confirm {
  margin-top: 14px; padding: 15px 17px; border-radius: 9px; background: var(--danger-wash);
  border: 1px solid color-mix(in srgb, var(--danger) 36%, transparent);
}
.confirm p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
.confirm b { font-weight: 600; }
.confirm-row { display: flex; gap: 10px; margin-top: 13px; flex-wrap: wrap; }
.btn-yes {
  appearance: none; border: 0; background: var(--danger); color: var(--on-accent);
  border-radius: 7px; font-family: var(--f-body); font-size: 12.5px; font-weight: 600;
  padding: 8px 13px; cursor: pointer;
}
.btn-no {
  appearance: none; border: 1px solid var(--rule-firm); background: var(--surface);
  color: var(--ink-2); border-radius: 7px; font-family: var(--f-body); font-size: 12.5px;
  font-weight: 500; padding: 8px 13px; cursor: pointer;
}

.keys {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px;
  margin-top: 12px; background: var(--rule); border: 1px solid var(--rule);
  border-radius: 11px; overflow: hidden;
}
.keyrow { background: var(--surface); padding: 13px 16px; display: flex; gap: 11px; align-items: center; }
.keyrow kbd {
  font-family: var(--f-mono); font-size: 10.5px; border: 1px solid var(--rule-firm);
  border-radius: 4px; padding: 2px 6px; color: var(--ink-2); flex: none;
}
.keyrow span { font-size: 13.5px; color: var(--ink-2); }


/* ============================================================
   lesson
   ============================================================ */

.panel[hidden] { display: none !important; }

.prose .lead {
  font-size: 18.5px; line-height: 1.6; color: var(--ink-2);
  max-width: 62ch; margin-bottom: 1.4em;
}
.prose > .lead:first-child { margin-top: 0; }


.prose { font-size: 16.5px; line-height: 1.72; color: var(--ink); }
.prose > * + * { margin-top: 1.1em; }
.prose h2 {
  font-size: 24px; margin-top: 2.2em; padding-top: .9em;
  border-top: 1px solid var(--rule); letter-spacing: -.015em;
  scroll-margin-top: calc(var(--topbar-h) + 66px);
}
.prose h3 { font-size: 18.5px; margin-top: 1.9em; font-family: var(--f-body); font-weight: 600; }
.prose p { margin-block: 0; max-width: 66ch; }
.prose strong { font-weight: 600; }
.prose ul, .prose ol { max-width: 64ch; padding-left: 1.3em; margin-block: 0; }
.prose li + li { margin-top: .45em; }
.prose code:not(pre code) {
  font-size: .875em; background: var(--surface-2); padding: 1.5px 5px;
  border-radius: 4px; border: 1px solid var(--rule); color: var(--accent-ink);
}
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 2.2em 0; }

pre {
  margin: 0; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 10px; padding: 15px 17px; overflow-x: auto;
  font-size: 13.5px; line-height: 1.62; box-shadow: var(--shadow-sm);
}
pre code { font-family: var(--f-mono); color: var(--ink); background: none; }
.codeblock { margin-top: 1.2em; }
.codeblock .cap {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: .05em; text-transform: uppercase; margin-bottom: 7px;
}

.hljs-keyword, .hljs-built_in { color: var(--accent-ink); font-weight: 500; }
.hljs-string, .hljs-meta .hljs-string { color: var(--done); }
.hljs-number, .hljs-literal { color: var(--active); }
.hljs-comment { color: var(--ink-3); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--ink); font-weight: 600; }
.hljs-params { color: var(--ink-2); }
.hljs-attr, .hljs-variable { color: var(--ink); }

.tablewrap { overflow-x: auto; margin-top: 1.3em; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 15px; border-bottom: 1px solid var(--rule); }
th { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 500; background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.callout {
  margin-top: 1.4em; padding: 16px 19px; border-radius: 10px;
  background: var(--active-wash); border: 1px solid color-mix(in srgb, var(--active) 30%, transparent);
  font-size: 15px; line-height: 1.62;
}
.callout .lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--active); display: block; margin-bottom: 5px; font-weight: 600; }
.callout p { margin: 0; max-width: 64ch; }
.callout p + p { margin-top: .7em; }

.figure {
  margin-top: 1.3em; padding: 18px 20px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--rule); overflow-x: auto;
  box-shadow: var(--shadow-sm);
}
.figure pre { border: 0; padding: 0; background: none; box-shadow: none; font-size: 13.5px; color: var(--ink-2); }

.placeholder {
  margin-top: 26px; padding: 30px 28px; border-radius: 12px;
  border: 1px dashed var(--rule-firm); background: var(--surface);
  display: flex; flex-direction: column; gap: 12px;
}
.placeholder h3 { font-family: var(--f-body); font-size: 15px; font-weight: 600; }
.placeholder p { margin: 0; color: var(--ink-2); font-size: 14.5px; max-width: 60ch; }

.foot { margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-3); display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: 0; padding: 5px 0; font: inherit; color: var(--ink-3); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:hover { color: var(--ink-2); }

/* ============================================================
   interactive widgets
   ============================================================ */
.widget {
  margin-top: 1.6em;
  border: 1px solid var(--rule); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow);
  overflow: hidden;
}
.widget-head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.widget-head .wt { font-family: var(--f-body); font-size: 13.5px; font-weight: 600; }
.widget-head .wh { font-size: 12.5px; color: var(--ink-3); }
.widget-body { padding: 18px; }
.widget-foot {
  padding: 12px 18px; border-top: 1px solid var(--rule);
  font-size: 13.5px; color: var(--ink-2); line-height: 1.55;
}
.widget-foot b { color: var(--ink); font-weight: 600; }

.ctrls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.pill {
  appearance: none; font-family: var(--f-mono); font-size: 11.5px;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--rule-firm); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; transition: all .15s;
}
.pill:hover { color: var(--ink); border-color: var(--ink-3); }
.pill.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.ctrl-label { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }

/* vector lab */
.veclab { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 22px; align-items: start; }
.veclab svg { width: 100%; height: auto; display: block; touch-action: none; }
.vec-handle { cursor: grab; }
.vec-handle:active { cursor: grabbing; }

/* SVG is themed with classes, not var() in presentation attributes,
   which browsers do not reliably resolve. */
.veclab .g-line { stroke: var(--rule); stroke-width: 1; }
.veclab .g-axis { stroke: var(--rule-firm); stroke-width: 1.5; }
.veclab .g-arc  { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 3 3; }
.veclab .ln-a { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.veclab .ln-b { stroke: var(--active); stroke-width: 2.5; stroke-linecap: round; }
.veclab .fl-a { fill: var(--accent); }
.veclab .fl-b { fill: var(--active); }
.veclab .grip { stroke: var(--surface); stroke-width: 2.5; }
.veclab .vtag { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }

.readouts { display: flex; flex-direction: column; gap: 10px; }
.ro {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 9px 12px; border-radius: 8px; background: var(--surface-2);
  border: 1px solid var(--rule);
}
.ro .k { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.ro .v { font-family: var(--f-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ro.hero-ro { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.ro.hero-ro .v { font-size: 21px; color: var(--accent-ink); }
.ro.hero-ro .k { color: var(--accent-ink); }
.ro .v.pos { color: var(--done); }
.ro .v.neg { color: var(--active); }

/* step-through */
.grid-steps { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.srow { display: flex; align-items: center; gap: 6px; }
.srow .rlab { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); width: 62px; flex: none; text-align: right; padding-right: 6px; }
.cell {
  width: 52px; height: 40px; flex: none; display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums;
  border: 1px solid var(--rule); border-radius: 7px; background: var(--surface-2);
  color: var(--ink-2); transition: all .2s;
}
.cell.live { border-color: var(--accent); background: var(--accent-wash); color: var(--accent-ink); font-weight: 600; }
.cell.settled { color: var(--ink); }
.cell.blank { color: var(--rule-firm); }
.op { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); width: 14px; text-align: center; flex: none; }
.total-line {
  margin-top: 14px; padding: 12px 15px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--rule);
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.total-line .lbl { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
.total-line .eq { font-family: var(--f-mono); font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.total-line .sum { font-family: var(--f-mono); font-size: 20px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: auto; }

/* search demo */
.searchgrid { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 22px; align-items: start; }
.sliders { display: flex; flex-direction: column; gap: 13px; }
.slider-row { display: flex; flex-direction: column; gap: 5px; }
.slider-row .top { display: flex; justify-content: space-between; align-items: baseline; }
.slider-row .nm { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.slider-row .vl { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

.results { display: flex; flex-direction: column; gap: 5px; }
.result {
  display: grid; grid-template-columns: minmax(0, 1fr) 58px; gap: 10px;
  align-items: center; padding: 7px 10px; border-radius: 8px;
  border: 1px solid transparent; transition: all .2s;
}
.result.top { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.result .nm { font-size: 13.5px; color: var(--ink-2); }
.result.top .nm { color: var(--ink); font-weight: 600; }
.result .track { height: 5px; border-radius: 3px; background: var(--rule); margin-top: 5px; overflow: hidden; }
.result .track > i { display: block; height: 100%; background: var(--ink-3); border-radius: 3px; transition: width .25s; }
.result.top .track > i { background: var(--accent); }
.result .sc { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-3); text-align: right; }
.result.top .sc { color: var(--accent-ink); font-weight: 600; }

/* static diagrams */
figure { margin: 1.6em 0 0; }
figure svg { width: 100%; height: auto; display: block; color: var(--ink-2); }
figcaption {
  margin-top: 10px; font-size: 13.5px; color: var(--ink-3); line-height: 1.55;
  max-width: 64ch;
}
.diagram {
  padding: 20px; border: 1px solid var(--rule); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow-sm); overflow-x: auto;
}
.diagram .box { fill: var(--surface-2); stroke: currentColor; stroke-width: 1; }
.diagram .box-hl { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
.diagram .lbl { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; }
.diagram .lbl-sm { fill: var(--ink-3); font-family: var(--f-mono); font-size: 10.5px; }
.diagram .lbl-hl { fill: var(--accent-ink); font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.diagram .head { fill: var(--ink); font-family: var(--f-body); font-size: 13px; font-weight: 600; }
.diagram .conn { stroke: currentColor; stroke-width: 1; fill: none; }
.diagram .conn-hl { stroke: var(--accent); stroke-width: 1.5; fill: none; }
.diagram .arrowfill { fill: currentColor; }
.diagram .sep { stroke: var(--rule); stroke-width: 1; }

/* ============================================================
   responsive
   ============================================================ */
.railtoggle { display: none; }
@media (max-width: 1080px) {
  .veclab, .searchgrid { grid-template-columns: minmax(0, 1fr); }
  .veclab svg { max-width: 340px; margin: 0 auto; }
}
/* Five things in the top bar, and a phone has room for three: the search
   field becomes an icon, and the tick count goes to Home. */
@media (max-width: 780px) {
  .topbar { gap: 10px; padding: 0 14px; }
  .searchbtn { padding: 0 9px; }
  .searchbtn-t, .searchbtn kbd { display: none; }
  .searchbtn-i { display: block; }
  .topstat { display: none; }
}
@media (max-width: 940px) {
  /* minmax(0, 1fr), not 1fr: a bare 1fr refuses to shrink below the widest
     thing inside it, and the step bar is wider than a phone. */
  .shell { grid-template-columns: minmax(0, 1fr); }
  .wrap { padding: 26px 20px 80px; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 14px 18px 20px; }
  .rail[hidden] { display: none !important; }
  .railtoggle { display: inline-flex; }
}
@media (max-width: 560px) {
  .prose { font-size: 16px; }
  .widget-body { padding: 14px; }
  .cell { width: 44px; height: 36px; font-size: 13px; }
  .srow .rlab { width: 48px; font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}


/* ============================================================
   solutions — collapsed by default, opening is a deliberate act
   ============================================================ */
.callout.danger {
  background: var(--danger-wash);
  border-color: color-mix(in srgb, var(--danger) 34%, transparent);
}
.callout.danger .lbl { color: var(--danger); }

.solution {
  margin-top: 12px; background: var(--surface);
  border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
}
.solution + .solution { margin-top: 8px; }
.solution > summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; font-family: var(--f-body); font-size: 14px; font-weight: 600;
  color: var(--ink-2); transition: color .15s, background .15s;
}
.solution > summary::-webkit-details-marker { display: none; }
.solution > summary::before {
  content: ""; flex: none; width: 8px; height: 8px;
  border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(-45deg); transition: transform .18s;
}
.solution > summary:hover { color: var(--ink); background: var(--surface-2); }
.solution[open] > summary { color: var(--ink); border-bottom: 1px solid var(--rule); }
.solution[open] > summary::before { transform: rotate(45deg); }
.solution > summary code { font-size: .9em; }
.solution .codeblock { margin: 14px 16px 0; }
.solution .why {
  margin: 12px 16px; font-size: 14px; line-height: 1.6;
  color: var(--ink-2); max-width: 64ch;
}



/* ============================================================
   theme toggle — the page followed the OS with no way to override
   ============================================================ */
.themetoggle {
  display: inline-flex; flex: none; padding: 2px; gap: 2px;
  border: 1px solid var(--rule-firm); border-radius: 8px; background: var(--surface);
}
.themetoggle button {
  appearance: none; border: 0; background: none; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--ink-3); padding: 5px 10px; border-radius: 6px;
  transition: background .15s, color .15s;
}
.themetoggle button:hover { color: var(--ink); }
.themetoggle button.on { background: var(--accent-wash); color: var(--accent-ink); }

/* ============================================================
   crumb bar — the lesson header
   ============================================================ */
.crumbs {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3);
}
.crumb {
  appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
  font: inherit; color: var(--accent-ink);
}
.crumb:hover { color: var(--accent); }
.crumb-sep { color: var(--rule-firm); }
.crumb-now { color: var(--ink); }



/* ============================================================
   real test results (HANDOFF step 5)
   ============================================================ */

.pastebox {
  width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--rule-firm); background: var(--surface);
  color: var(--ink); font-family: var(--f-mono); font-size: 12px; line-height: 1.5;
  resize: vertical;
}
.paste-msg { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
.paste-msg.bad { color: var(--danger); }

/* A checkbox the runner owns must not look like one you can set. */


.copybtn {
  appearance: none; flex: none; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--rule-firm); border-radius: 6px; padding: 4px 10px;
  transition: color .15s, border-color .15s;
}
.copybtn:hover { color: var(--ink); border-color: var(--ink-3); }
.copybtn.ok { color: var(--done); border-color: var(--done); }
.copybtn.warn { color: var(--active); border-color: var(--active); }

/* The command and its copy control as one chip, so it reads as a thing you take. */
.cmdchip {
  appearance: none; display: flex; align-items: center; gap: 10px; cursor: pointer;
  font-family: var(--f-mono); font-size: 12.5px; color: var(--accent-ink);
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius: 8px; padding: 10px 13px; transition: border-color .15s; flex: none;
}
.cmdchip:hover { border-color: var(--accent); }
.cmdchip .copylabel {
  font-size: 10.5px; color: var(--ink-3);
  border-left: 1px solid var(--rule); padding-left: 10px;
}
.cmdchip .copylabel.ok { color: var(--done); }
.cmdchip .copylabel.warn { color: var(--active); }

/* ============================================================
   lesson — three steps: read, implement, compare
   ============================================================ */
/* Full bleed: the header sits on --paper, the steps on a --surface band,
   and each has its own 1060px column. */
.lesson { min-width: 0; }
.lesson-head { max-width: 1060px; padding: 26px 40px 0; }
.lesson-h1 {
  font-family: var(--f-display); font-size: 36px; font-weight: 600;
  letter-spacing: -.022em; line-height: 1.14; margin: 16px 0 0;
}
.lesson-lede { font-size: 17px; line-height: 1.55; color: var(--ink-2); margin: 11px 0 0; max-width: 62ch; }

.facts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
  gap: 1px; margin-top: 20px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 11px; overflow: hidden;
}
.facts > div { background: var(--surface); padding: 12px 15px; }
.fact-k {
  display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
}
.fact-v { display: block; font-size: 13px; color: var(--ink); margin-top: 4px; line-height: 1.4; }

/* Tabs joined to the band below them: 1px of overlap, and the active one
   carries an inset top rule in accent, or --active where a gate is waiting. */
.stepper { display: flex; gap: 5px; margin-top: 24px; padding-bottom: 1px; overflow-x: auto; scrollbar-width: none; }
.stepper::-webkit-scrollbar { display: none; }
.step-btn {
  appearance: none; cursor: pointer; text-align: left; font-family: var(--f-body);
  padding: 11px 18px 13px; border-radius: 10px 10px 0 0; min-width: 160px; flex: none;
  border: 1px solid var(--rule); border-bottom: 0; margin-bottom: -1px;
  background: var(--paper); color: var(--ink-3);
}
.step-btn.is-done { color: var(--done); }
.step-btn.on {
  background: var(--surface); color: var(--ink);
  border-color: var(--rule-firm); box-shadow: inset 0 2px 0 var(--accent);
}
.step-btn.on.is-warn {
  border-color: color-mix(in srgb, var(--active) 42%, transparent);
  box-shadow: inset 0 2px 0 var(--active);
}
.step-n {
  display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .07em;
  text-transform: uppercase; opacity: .8;
}
.step-label { display: block; font-size: 14.5px; font-weight: 600; margin-top: 3px; }

.lesson-band { border-top: 1px solid var(--rule); background: var(--surface); min-height: 520px; }
.lesson-inner { max-width: 1060px; padding: 32px 40px 70px; }

/* ---------- step 1: watch first ---------- */
.watch {
  border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  border-radius: 12px; overflow: hidden; background: var(--accent-wash);
}
.watch-head {
  padding: 14px 20px 13px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
}
.watch-k {
  font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--accent-ink);
}
.watch-sub { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.watch-list { display: grid; gap: 1px; background: color-mix(in srgb, var(--accent) 18%, transparent); }
.watch-row {
  background: var(--surface); padding: 15px 20px; display: flex; gap: 16px;
  align-items: flex-start; text-decoration: none; color: var(--ink);
}
.watch-row:hover { background: var(--surface-2); }
.watch-when {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; flex: none; width: 46px; padding-top: 4px;
  color: var(--accent-ink);
}
.watch-body { min-width: 0; flex: 1; }
.watch-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.watch-title { font-size: 15.5px; font-weight: 600; line-height: 1.4; color: var(--accent-ink); }
.watch-len { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); }
.watch-why { display: block; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); margin-top: 4px; max-width: 64ch; }
.watch-out { font-family: var(--f-mono); font-size: 13px; color: var(--accent); flex: none; padding-top: 3px; }
.watch-careful { padding: 13px 20px; display: flex; gap: 11px; align-items: flex-start; }
.watch-careful-k {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--active); flex: none; padding-top: 3px;
}
.watch-careful p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); max-width: 68ch; }
.watch-careful b { color: var(--ink); font-weight: 600; }

/* ---------- step headers, shared ---------- */
.step-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.step-kicker {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--accent);
}
.step-h2 {
  font-family: var(--f-display); font-size: 27px; font-weight: 600;
  letter-spacing: -.018em; margin: 9px 0 0;
}
.step-lead { font-size: 16px; line-height: 1.65; color: var(--ink-2); margin: 13px 0 0; max-width: 68ch; }
.cmdchip.plain { background: var(--paper); border-color: var(--rule-firm); }

/* ---------- step 2: one tick per exercise ---------- */
.exrows {
  display: grid; gap: 1px; margin-top: 20px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 11px; overflow: hidden;
}
.exrow {
  background: var(--surface); padding: 14px 18px; display: flex; gap: 13px;
  align-items: flex-start; width: 100%; border: 0; cursor: pointer;
  font-family: var(--f-body); text-align: left; transition: background .15s;
}
.exrow:hover { background: var(--surface-2); }
.exrow.is-optional { opacity: .75; }
.exbox {
  width: 19px; height: 19px; border-radius: 5px; flex: none; display: grid;
  place-items: center; font-size: 11px; margin-top: 1px; color: var(--on-accent);
  background: var(--paper); border: 1.5px solid var(--rule-firm);
}
.exrow.is-optional .exbox { border-style: dashed; }
.exrow.is-on .exbox { background: var(--done); border-color: var(--done); }
.exrow.is-runner .exbox { box-shadow: 0 0 0 2px color-mix(in srgb, var(--done) 22%, transparent); }
.exn {
  font-family: var(--f-mono); font-size: 11px; color: var(--ink-3);
  flex: none; width: 18px; text-align: right; padding-top: 2px;
}
.exbody { min-width: 0; flex: 1; text-align: left; }
.exhead { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
.exname { font-family: var(--f-mono); font-size: 13.5px; color: var(--ink); }
.exrow.is-on .exname { color: var(--ink-3); }
.exopt {
  font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-3);
  border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px;
}
.exsum { display: block; font-size: 13.5px; line-height: 1.5; color: var(--ink-3); margin-top: 3px; }
.exmsg {
  display: block; font-family: var(--f-mono); font-size: 12px; line-height: 1.5;
  color: var(--danger); margin-top: 5px; word-break: break-word;
}
.exbans {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3);
  flex: none; width: 84px; text-align: right; padding-top: 3px; line-height: 1.5;
}

.notebox {
  margin-top: 18px; padding: 16px 19px; border-radius: 11px;
  background: var(--paper); border: 1px solid var(--rule);
}
.notebox-k {
  display: block; font-family: var(--f-mono); font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
}
.notebox p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); max-width: 70ch; }
.notebox code { font-family: var(--f-mono); font-size: .9em; }
.notebox.is-active {
  background: var(--active-wash);
  border-color: color-mix(in srgb, var(--active) 30%, transparent);
}
.notebox.is-active .notebox-k { color: var(--active); }
.notebox.is-active p { color: var(--ink); font-size: 15px; }

/* One strip at the foot of every step, naming the next action. */
.stepfoot {
  display: flex; gap: 14px; align-items: center; justify-content: space-between;
  flex-wrap: wrap; margin-top: 26px; padding: 16px 19px; border-radius: 11px;
  background: var(--accent-wash);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}
.stepfoot .body { font-size: 15px; line-height: 1.5; max-width: 58ch; color: var(--ink-2); }
.stepfoot .body b { color: var(--ink); font-weight: 600; }
.stepfoot code { font-family: var(--f-mono); font-size: .9em; }
.btn-quiet {
  appearance: none; border: 1px solid var(--rule-firm); border-radius: 8px;
  background: var(--surface); color: var(--ink-2); font-family: var(--f-body);
  font-size: 13.5px; font-weight: 500; padding: 10px 16px; cursor: pointer; flex: none;
}
.btn-quiet:hover { color: var(--ink); border-color: var(--ink-3); }
.exfoot { margin: 14px 0 0; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); line-height: 1.6; }
.exfoot b { color: var(--ink-2); font-weight: 400; }

/* ---------- step 3: the gate, then one solution per exercise ---------- */
.gate { max-width: 700px; }
.gate p { margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: var(--ink-2); max-width: 66ch; }
.gate code { font-family: var(--f-mono); font-size: .9em; }
.gate-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.gate-foot { margin-top: 16px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }

.solutions { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
.solution-card {
  border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--paper);
}
.sol-head { padding: 16px 20px 15px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.sol-top { display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap; }
.sol-n {
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--accent-ink);
  background: var(--accent-wash); border-radius: 5px; padding: 3px 7px; flex: none;
}
.sol-name { font-family: var(--f-mono); font-size: 14.5px; font-weight: 500; color: var(--ink); }
.sol-headline { font-size: 14px; color: var(--ink-3); line-height: 1.45; }
.sol-tick {
  margin-left: auto; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .05em;
  text-transform: uppercase; color: var(--done);
  background: color-mix(in srgb, var(--done) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--done) 32%, transparent);
  border-radius: 5px; padding: 3px 7px; flex: none;
}
.sol-mech { margin: 11px 0 0; font-size: 15px; line-height: 1.65; color: var(--ink-2); max-width: 66ch; }
.sol-trap {
  margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--danger); max-width: 66ch;
  padding-left: 13px; border-left: 2px solid color-mix(in srgb, var(--danger) 45%, transparent);
}
/* The figure sits between the reasoning and the code, because it explains the
   first and you are meant to have seen it before you ask for the second. */
.sol-figure { padding: 4px 20px 18px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.sol-figure figure { margin: 0; }
.sol-figure figcaption { max-width: 68ch; }

.sol-toggle {
  appearance: none; border: 0; width: 100%; text-align: left; cursor: pointer;
  padding: 11px 20px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  color: var(--accent-ink); background: var(--paper);
}
.sol-toggle[aria-expanded="true"] { color: var(--ink-2); background: var(--surface-2); }
.solution-card pre {
  margin: 0; padding: 17px 20px; font-family: var(--f-mono); font-size: 12.5px;
  line-height: 1.75; overflow-x: auto; color: var(--ink); border-top: 1px solid var(--rule);
}
.sol-why { padding: 14px 20px 16px; border-top: 1px solid var(--rule); background: var(--surface); }
.sol-why-k {
  display: block; font-family: var(--f-mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
}
.sol-why p { margin: 0; font-size: 14.5px; line-height: 1.65; color: var(--ink-2); max-width: 68ch; }

.lesson-foot {
  margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: 12px; color: var(--ink-3);
}
.lesson-foot .linkbtn { font-family: inherit; font-size: inherit; }
.lesson-foot .is-end { color: var(--rule-firm); }

/* The closing questions ride at the end of Compare: the design has no fourth
   step, and they are the last thing you do before the next lesson. */
.closeout { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--rule); }
.checkq { max-width: 64ch; padding-left: 1.3em; }
.checkq li + li { margin-top: .55em; }

/* ---------- step 1 reads in two columns ---------- */
.step1 { display: grid; grid-template-columns: minmax(0, 1fr) 196px; gap: 40px; align-items: start; }
.step1-main { min-width: 0; }
.step-side-inner { position: sticky; top: 70px; }
.side-k {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
  padding-bottom: 9px; border-bottom: 1px solid var(--rule);
}
.side-body + .side-k, .side-toc + .side-k, .side-after + .side-k { padding-top: 22px; }
.side-toc { display: flex; flex-direction: column; gap: 1px; margin-top: 9px; }
.side-link {
  appearance: none; border: 0; background: none; cursor: pointer; text-align: left;
  font-family: var(--f-body); font-size: 12.5px; line-height: 1.4; color: var(--ink-3);
  padding: 5px 10px; border-left: 2px solid transparent;
}
.side-link:hover { color: var(--ink-2); }
.side-link.on { color: var(--accent-ink); font-weight: 500; border-left-color: var(--accent); }
.side-body { font-size: 12.5px; line-height: 1.55; color: var(--ink-2); margin: 10px 0 0; }
.side-after { display: block; margin-top: 10px; text-decoration: none; }
.side-after-t { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.4; color: var(--accent-ink); }
.side-after-l { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); margin-top: 3px; }
.side-after-w { display: block; font-size: 11.5px; line-height: 1.5; color: var(--ink-2); margin-top: 5px; }

.resources-foot {
  margin-top: 26px; border: 1px solid var(--rule); border-radius: 11px;
  background: var(--surface); overflow: hidden;
}
.resources-foot > summary {
  cursor: pointer; list-style: none; padding: 14px 18px;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
  display: flex; align-items: center; gap: 10px;
}
.resources-foot > summary::-webkit-details-marker { display: none; }
.resources-foot > summary::before {
  content: ""; width: 8px; height: 8px; flex: none;
  border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(-45deg); transition: transform .18s;
}
.resources-foot[open] > summary::before { transform: rotate(45deg); }
.resources-foot[open] > summary { border-bottom: 1px solid var(--rule); color: var(--ink); }
.resources-body { padding: 4px 18px 18px; }

@media (max-width: 1080px) {
  .step1 { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .step-side-inner { position: static; }
}
@media (max-width: 720px) {
  .lesson-head { padding: 22px 20px 0; }
  .lesson-inner { padding: 26px 20px 60px; }
}

{"phases":[{"id":"p1","number":1,"title":"Foundations","subtitle":"the maths, built in code","blurb":"All of machine learning stands on four ideas: vectors, matrix multiplication, the derivative, and probability. Learn these properly and the rest of the field is recombination. We learn them by writing them, not by reading proofs.","milestone":"Minimise a function you have never seen before, from scratch, and explain every line.","lessons":[{"id":"1.1","title":"Vectors and the dot product","summary":"Python and NumPy essentials, what a vector really is, and the single operation that everything else is built from.","status":"available","written":true,"exercises":[{"name":"dot_loop","summary":"the dot product, by hand","optional":false,"forbids":["no numpy","no sum()"]},{"name":"dot_numpy","summary":"the same thing, vectorised","optional":false,"forbids":["no loops"]},{"name":"magnitude_loop","summary":"magnitude, by hand","optional":false,"forbids":["no numpy"]},{"name":"magnitude","summary":"magnitude, vectorised","optional":false,"forbids":["no loops"]},{"name":"normalise","summary":"normalise","optional":false,"forbids":["no loops"]},{"name":"cosine_similarity","summary":"cosine similarity","optional":false,"forbids":["no loops"]},{"name":"most_similar","summary":"the payoff: a two-line search engine","optional":false,"forbids":[]}],"dir":"lessons/01-foundations/01-vectors","watch":{"before":[{"title":"3Blue1Brown — Essence of Linear Algebra, ch. 1 “Vectors”","length":"~10 min","why":"The geometric picture, animated far better than the demo below. Watch for the three views of a vector; you already have the CS one.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},{"title":"ch. 2 — Linear combinations, span, and basis vectors","length":"~10 min","why":"Why the numbers in a vector are coordinates rather than just values. Pays off in 1.4, and hugely in 2.12.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},{"title":"Keith Galli — Complete Python NumPy Tutorial","length":"~1 hr","why":"Purely practical. Type along with the notebook. You can stop after reshaping.","url":"https://github.com/KeithGalli/NumPy"}],"after":{"title":"ch. 9 — Dot products and duality","length":"~14 min","why":"Only once your code passes. The second half, on duality, is genuinely hard and not needed yet — losing the thread there is expected.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"}},"solutions":[{"n":1,"name":"dot_loop","headline":"the definition as an algorithm","mechanism":"Walk both lists together, multiply each pair, accumulate. The length check matters because the operation is undefined for mismatched lengths — there is no sensible answer, so failing loudly beats guessing.","code":"def dot_loop(a: list[float], b: list[float]) -> float:\n    if len(a) != len(b):\n        raise ValueError(\"The lengths of the two lists must be equal.\")\n\n    total = 0.0\n    for i in range(len(a)):\n        total += a[i] * b[i]\n    return total","why":"The accumulator starts at 0.0 rather than 0 so the return type is a float even for integer inputs. Indexing with range(len(a)) is the one place in this lesson where an index is genuinely needed — you are walking two lists in step."},{"n":2,"name":"dot_numpy","headline":"the same result, loop pushed into C","mechanism":"np.dot and np.matmul (also spelled @) agree for 1-D inputs and diverge only in higher dimensions: np.dot sums over the last axis of one and the second-to-last of the other, while matmul broadcasts stacks of matrices. For two vectors, either is right.","code":"def dot_numpy(a: np.ndarray, b: np.ndarray) -> float:\n    return float(np.dot(a, b))","why":"The float() matters more than it looks: without it you return np.float64, which behaves almost like a Python float right up until it does not — it will not JSON-serialise, and it leaks numpy semantics into code that expected a plain number."},{"n":3,"name":"magnitude_loop","headline":"Pythagoras, nothing more","mechanism":"The length of [3, 4] is the hypotenuse of a right triangle with legs 3 and 4. Squaring removes signs so direction cannot cancel length out; the root brings the answer back to the original units.","code":"def magnitude_loop(v: list[float]) -> float:\n    squared = [x ** 2 for x in v]\n    return math.sqrt(sum(squared))","why":"A comprehension plus sum() is idiomatic Python and allowed here — exercise 1 already proved you can accumulate by hand, and the point of this one is Pythagoras. Using a generator, sum(x ** 2 for x in v), is marginally better for very long inputs since it never materialises the intermediate list."},{"n":4,"name":"magnitude","headline":"the same sum, vectorised","mechanism":"square, sum, sqrt — composed into a single expression. Nothing about this changes when the vector has 4096 components instead of two, which is why two-dimensional intuition is worth building.","code":"def magnitude(v: np.ndarray) -> float:\n    return float(np.sqrt(np.sum(np.square(v))))","why":"np.linalg.norm(v) does the same job in one call and is what you would reach for in real code. Write it out at least once, though — seeing square, sum and sqrt compose is where the vectorised style starts to feel natural. Neither version survives extreme inputs: both overflow to inf around 1e200, because both square before summing.","trap":"Both versions overflow to inf around 1e200 — squaring before summing is the reason."},{"n":5,"name":"normalise","headline":"keep the direction, throw away the length","mechanism":"Dividing a vector by its own magnitude leaves it pointing exactly where it was, with length precisely 1. Every such vector lands on the unit circle. The zero vector is the one case with no answer: no direction to preserve, and the division would be by zero.","code":"def normalise(v: np.ndarray) -> np.ndarray:\n    length = magnitude(v)\n    if length == 0:\n        raise ValueError(\"Cannot normalise a zero vector.\")\n    return v / length","why":"Calling magnitude(v) rather than rewriting the formula gives you one source of truth. Naming the local `length` and not `magnitude` matters — a local of the same name shadows the function, and the next person to add a second call inside this function gets a confusing TypeError."},{"n":6,"name":"cosine_similarity","headline":"why the division works","mechanism":"One identity sits underneath the whole exercise: a · b = |a| × |b| × cos θ. The dot product was never purely about agreement — it is agreement scaled by both lengths. Divide both sides by |a| × |b| and the lengths cancel, leaving the angle alone. You are not inventing a metric; you are rearranging an identity to isolate what you actually wanted.","code":"def cosine_similarity(a: np.ndarray, b: np.ndarray) -> float:\n    a_magnitude = magnitude(a)\n    b_magnitude = magnitude(b)\n    if a_magnitude == 0 or b_magnitude == 0:\n        raise ValueError(\"Cannot compute cosine similarity with a zero vector.\")\n    return float(np.dot(a, b) / (a_magnitude * b_magnitude))","why":"np.dot(normalise(a), normalise(b)) is equally correct and returns the identical value bit for bit — shorter, and it inherits the zero-vector check from normalise for free. The version above was chosen only because it mirrors the formula in the docstring. The zero check is not required by the tests, but the cosine of an angle with a directionless vector is genuinely undefined, so raising beats returning a made-up number.","trap":"Calling normalise where you meant magnitude gives you an array where a scalar belongs — then `if array == 0` raises “the truth value of an array with more than one element is ambiguous”."},{"n":7,"name":"most_similar","headline":"search, and the version you have not written yet","mechanism":"Short, because exercise 6 did the work. Iterating a dict yields its keys, and key= changes what gets compared, not what gets returned — so the comparison runs over scores while the return value is a name.","code":"def most_similar(query: np.ndarray, library: dict[str, np.ndarray]) -> str:\n    scores = {name: cosine_similarity(query, vector) for name, vector in library.items()}\n    return max(scores, key=scores.get)","why":"This is the definition, not the implementation. Stacking the library into a matrix and running L @ q scores everything in a single call — identical arithmetic, one operation instead of n. That is what a vector database actually runs over millions of rows, and it is what stretch.py asks for.","trap":"max(scores.values()) hands you 0.998 with no way back to which item earned it."}],"headings":[{"step":"lesson","text":"Why we start here"},{"step":"lesson","text":"The Python you need"},{"step":"lesson","text":"A vector is a list of numbers"},{"step":"lesson","text":"The dot product"},{"step":"lesson","text":"The flaw, and the fix"},{"step":"lesson","text":"Why NumPy exists"},{"step":"exercises","text":"What the file looks like"},{"step":"exercises","text":"Then run the benchmark"},{"step":"exercises","text":"Optional: the stretch"},{"step":"exercises","text":"Solutions"},{"step":"walkthrough","text":"Exercise walkthrough"},{"step":"closeout","text":"You are done when"},{"step":"closeout","text":"Write your notes"},{"step":"resources","text":"What to watch"}]},{"id":"1.2","title":"Vector geometry","summary":"Length, distance, angle, cosine similarity, projection. Why 'similarity' turns out to be a geometry problem.","status":"available","written":true,"exercises":[{"name":"distance_loop","summary":"Euclidean distance, by hand","optional":false,"forbids":["no numpy"]},{"name":"distance","summary":"the same thing, vectorised","optional":false,"forbids":["no loops"]},{"name":"angle_between","summary":"the angle between two vectors, in DEGREES","optional":false,"forbids":["no loops"]},{"name":"project","summary":"the projection of a onto b","optional":false,"forbids":["no loops"]},{"name":"reject","summary":"the part of a that b cannot explain","optional":false,"forbids":["no loops"]},{"name":"is_orthogonal","summary":"do these two vectors have nothing to say about each other?","optional":false,"forbids":["no loops"]},{"name":"nearest","summary":"the payoff: the same search, by distance instead of angle","optional":false,"forbids":[]}],"dir":"lessons/01-foundations/02-geometry","watch":{"before":[{"title":"3Blue1Brown — ch. 9, “Dot products and duality”","length":"~14 min","why":"The one held back from 1.1. The first half is exactly this lesson. Stop at the halfway mark — duality is hard and not needed yet.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},{"title":"3Blue1Brown — ch. 3, “Linear transformations and matrices”","length":"~11 min","why":"Optional here. It is the bridge into 1.3 and 1.4, and seeing it twice will not hurt.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"}],"after":{"title":"numpy.linalg.norm — the axis parameter","length":"~5 min read","why":"Once your code passes. This is how the stretch file collapses an (n, n, d) array to (n, n) without a loop, and it is most of lesson 1.3.","url":"https://numpy.org/doc/stable/reference/generated/numpy.linalg.norm.html"}},"solutions":[{"n":1,"name":"distance_loop","headline":"Pythagoras between two points","mechanism":"One formula, three steps, in this order: subtract the two points position by position to get the gap, square each difference, add the squares, take the root. Squaring is what makes the order of subtraction irrelevant — (a-b)² and (b-a)² are the same number — which is why distance(a, b) always equals distance(b, a). The length check comes first because the operation is undefined for mismatched lengths: there is no sensible answer, so failing loudly beats guessing.","code":"def distance_loop(a: list[float], b: list[float]) -> float:\n    if len(a) != len(b):\n        raise ValueError(\"The two points must have the same number of components.\")\n\n    total = 0.0\n    for x, y in zip(a, b):\n        total += (x - y) ** 2\n    return math.sqrt(total)","why":"zip(a, b) walks two sequences in step and is the idiomatic form when you do not need the index for anything else. Accumulating with an explicit loop and indexing by range(len(a)) is equally correct and is what most people write first; both are fine here. A comprehension — math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b))) — collapses it to one line, and is worth writing out once you have seen the loop, because the loop is the thing you are proving you can do.","trap":"Starting the accumulator at 0 rather than 0.0 makes the return type depend on the input: integer points would give you an int back on some paths, and the annotation says float."},{"n":2,"name":"distance","headline":"the length of one particular vector","mechanism":"The whole exercise is noticing which vector to measure. a - b is itself a vector — the one that points from b to a — and its length is the distance between the two points. So distance is not a new formula. It is the magnitude you wrote in 1.1, handed the difference instead of a single point.","code":"def distance(a: np.ndarray, b: np.ndarray) -> float:\n    return float(np.linalg.norm(a - b))","why":"np.linalg.norm is what you would reach for in real code, for readability rather than robustness. It does not rescale: it squares and sums exactly as the long form np.sqrt(np.sum(np.square(v))) does, so a gap of [1e-200, 1e-200] comes back as 0.0 from both, and a gap of [1e200, 1e200] as inf. The standard library's math.hypot is the one that rescales — math.hypot(*v) gets 1.414e-200 and 1.414e200 for those same two gaps. Writing the long form once, as in 1.1, is worth it to see square-sum-sqrt compose; reaching for norm afterwards is a shorter spelling of the same arithmetic, not a more careful one.","trap":"np.linalg.norm returns np.float64, not a Python float. It behaves like one until something checks — it will not JSON-serialise, and `type(x) is float` is False. The float() wrapper is the difference between an annotation that is true and one that is decoration."},{"n":3,"name":"angle_between","headline":"the identity, rearranged, in degrees","mechanism":"Start from a · b = |a| |b| cos θ and solve for θ. Divide both sides by the two lengths and the right-hand side is just cos θ; that quotient is exactly the cosine_similarity you wrote in 1.1. Then arccos turns a cosine back into an angle, and a unit conversion turns radians into degrees. Three of the four steps are things you already had.","code":"def angle_between(a: np.ndarray, b: np.ndarray) -> float:\n    a_len = np.linalg.norm(a)\n    b_len = np.linalg.norm(b)\n    if a_len == 0 or b_len == 0:\n        raise ValueError(\"A zero vector has no direction, so there is no angle.\")\n\n    cos_theta = np.clip(np.dot(a, b) / (a_len * b_len), -1.0, 1.0)\n    return float(np.degrees(np.arccos(cos_theta)))","why":"The clip has to come before arccos, not after. Once arccos has been handed 1.0000000000000002 it has already returned nan, and clipping nan gives you nan — the fix has to happen while there is still something to fix. Naming a_len and b_len rather than calling norm twice inside the expression is not only tidier; it also gives the zero check something to test that the reader can see is the same value used in the division.","trap":"arccos is ill-conditioned near 0° and 180°. Even clipped, the angle between [2,2] and [10,10] comes back as 1.2e-06 degrees rather than 0, because cos t ≈ 1 - t²/2 there means a cosine wrong in its last bit becomes an angle wrong by about 1e-6 degrees. When you need \"do these point the same way\" to full precision, ask the cosine, not the angle."},{"n":4,"name":"project","headline":"how far along b, then travel that far","mechanism":"Two moves. First a plain number: (a · b) / (b · b), which says how many copies of b you have to travel. Then multiply b by it. The numerator is the alignment between a and b; the denominator is b's own squared length, and it is there to cancel b's size out of the answer. That is why doubling b changes nothing — the numerator doubles and the denominator quadruples, so the scalar halves, and then you travel half as far along a vector twice as long.","code":"def project(a: np.ndarray, b: np.ndarray) -> np.ndarray:\n    b_squared = np.dot(b, b)\n    if b_squared == 0:\n        raise ValueError(\"There is no line through the zero vector to project onto.\")\n\n    return (np.dot(a, b) / b_squared) * b","why":"Normalising b first and writing np.dot(a, unit_b) * unit_b is the same arithmetic, with the scaling done explicitly rather than folded into the ratio. Either is correct. The ratio form is shorter and does one fewer square root; the normalised form is more obviously \"project onto a direction\". Knowing they are the same expression is worth more than picking one.","trap":"Raise only when b is zero. A zero a is not an error: there is simply nothing to cast, and the answer is the zero vector. Guarding both makes project([0,0], [1,0]) raise when the docstring says it should return [0., 0.] — and the message blames b, which was fine."},{"n":5,"name":"reject","headline":"everything the projection did not explain","mechanism":"Subtract the shadow from the original. What is left cannot have any component along b — you just removed all of it — so the result is perpendicular to b, always, for every a and b. That is not a property to verify afterwards; it is what subtraction of the projection means.","code":"def reject(a: np.ndarray, b: np.ndarray) -> np.ndarray:\n    return a - project(a, b)","why":"Calling project rather than repeating its formula gives you one source of truth: fix a bug in the ratio and both functions get it. It also inherits project's zero-vector check for free, which is the right behaviour — if there is no line to project onto, there is no decomposition either. The pair is a decomposition, and the test proves it by checking that project(a, b) + reject(a, b) reconstructs a on random six-dimensional input, where no amount of eyeballing would help.","trap":"This is the four lines with the longest reach in phase 1. Least squares finds the projection of your data onto what the model can express, and the rejection is the residual. PCA looks for directions that leave the smallest rejection. An attention head decides how much of one token to mix into another; the amount is a dot product and the mixing is a projection."},{"n":6,"name":"is_orthogonal","headline":"never compare a float with ==","mechanism":"Perpendicular means the dot product is zero — that falls straight out of the identity, since cos 90° = 0 makes the whole right-hand side zero. In floating point it is never exactly zero. Two vectors that are perpendicular in exact arithmetic hand you 3.06e-17, because 0.1 + 0.2 is not 0.3 and never was. So the test is not \"is it zero\" but \"is it close enough to zero\", and tol is where you say what close enough means.","code":"def is_orthogonal(a: np.ndarray, b: np.ndarray, tol: float = 1e-9) -> bool:\n    return bool(abs(np.dot(a, b)) < tol)","why":"The zero vector needs no special case: its dot product with anything is exactly 0, which is inside any tolerance, so it returns True on its own. That is the convention every library uses. Picking tol is a real decision rather than a default to copy — too tight and genuinely perpendicular vectors are rejected because the rounding error exceeds your threshold; too loose and a visible angle passes. An absolute tolerance on the dot product is also the wrong tool for very large or very small vectors, where you would scale by the magnitudes or compare the cosine instead. That is what np.isclose's rtol is for.","trap":"abs(np.dot(a, b)) < tol compares two numpy scalars and returns np.True_, not True. The annotation says bool, and the test asserts `is True`, which np.True_ fails. numpy 2 makes this worse by naming the type \"bool\": type(x).__name__ prints bool and lies to you. Only isinstance(x, bool) or repr(type(x)) tells you the truth."},{"n":7,"name":"nearest","headline":"1.1's search with two words changed","mechanism":"Score every item, then pick the best score. Identical in shape to most_similar from 1.1, with distance in place of cosine_similarity and min in place of max. The min is the interesting half: \"most similar\" wants the largest number, \"nearest\" wants the smallest, and that single flip is why the two searches disagree about a long document.","code":"def nearest(query: np.ndarray, library: dict[str, np.ndarray]) -> str:\n    if not library:\n        raise ValueError(\"An empty library has no nearest item.\")\n\n    scores = {name: distance(query, vector) for name, vector in library.items()}\n    return min(scores, key=scores.get)","why":"Iterating a dict yields its keys, and key= changes what gets compared, not what gets returned — so the comparison runs over distances while the value that comes back is a name. Raising on an empty library rather than returning None puts the error where the mistake is; None would travel, and some caller would fail on results[None] half a second later in a function that was never at fault.","trap":"min(scores.values()) hands you 1.41 with no way back to which item earned it. The whole point of key= is that you rank by one thing and return another."}],"headings":[{"step":"lesson","text":"Two questions, not one"},{"step":"lesson","text":"Where they disagree"},{"step":"lesson","text":"Which one do you want?"},{"step":"lesson","text":"The identity that connects them"},{"step":"lesson","text":"Two silent failures"},{"step":"lesson","text":"Projection: splitting a vector in two"},{"step":"lesson","text":"Why projection matters more than it looks"},{"step":"lesson","text":"Where these formulas come from"},{"step":"exercises","text":"The shape of the file"},{"step":"exercises","text":"What the tests check that you might not"},{"step":"exercises","text":"Then run the demo"},{"step":"exercises","text":"The stretch, if you want it"},{"step":"walkthrough","text":"1 and 2 — distance, twice"},{"step":"walkthrough","text":"3 — the angle, and the two things that go wrong"},{"step":"walkthrough","text":"4 and 5 — projection and rejection"},{"step":"walkthrough","text":"6 — the tolerance"},{"step":"walkthrough","text":"7 — the same search, one thing changed"},{"step":"closeout","text":"You are done when"},{"step":"closeout","text":"Write your notes"},{"step":"resources","text":"Watch"},{"step":"resources","text":"Reference, when you hit it"},{"step":"resources","text":"Later, not now"}]},{"id":"1.3","title":"Matrices as data","summary":"Shape, indexing, slicing, broadcasting, transpose. Thinking in two dimensions without loops.","status":"available","written":true,"exercises":[{"name":"shape_of","summary":"how big is this table, and is it even a table?","optional":false,"forbids":["no numpy"]},{"name":"row_lengths","summary":"the length of every row, all at once","optional":false,"forbids":["no loops"]},{"name":"centre","summary":"move the data so its average sits at the origin","optional":false,"forbids":["no loops"]},{"name":"unit_rows","summary":"scale every row to length 1, keeping its direction","optional":false,"forbids":["no loops"]},{"name":"gram","summary":"every pairwise dot product, in one operation","optional":false,"forbids":["no loops"]},{"name":"pairwise_distances","summary":"the distance from every row to every other row","optional":false,"forbids":["no loops"]},{"name":"rank_all","summary":"the payoff: score a whole library in one operation","optional":false,"forbids":[]}],"dir":"lessons/01-foundations/03-matrices","watch":{"before":[{"title":"3Blue1Brown — ch. 3, “Linear transformations and matrices”","length":"~11 min","why":"It treats a matrix as a movement of space; this lesson treats it as a table of data. Both are true and they are not the same idea. Watch anyway — 1.4 is entirely the other view.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},{"title":"NumPy docs — Broadcasting","length":"~15 min read","why":"Read it after the broadcasting section below, so you are checking your understanding rather than forming it. “General Broadcasting Rules” is the whole thing in six lines.","url":"https://numpy.org/doc/stable/user/basics.broadcasting.html"}],"after":{"title":"3Blue1Brown — ch. 4, “Matrix multiplication as composition”","length":"~10 min","why":"Only once exercise 5 passes. You will have written a matmul as “every pairwise dot product”; this says what it means when neither side is data.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"}},"solutions":[{"n":1,"name":"shape_of","headline":"what .shape is, written by hand","mechanism":"A shape is two facts about a table: how many rows it has, and how long they are. Count the rows, measure the first one, then check that every other row agrees with it. The empty table has to be handled before any of that, because measuring rows[0] of an empty list raises IndexError before your own check ever runs. Once this is written, .shape stops being magic — numpy records the same two numbers, and refuses, as you do here, to guess when the input is not a rectangle.","code":"def shape_of(rows: list[list[float]]) -> tuple[int, int]:\n    if not rows:\n        return (0, 0)\n\n    width = len(rows[0])\n    for row in rows:\n        if len(row) != width:\n            raise ValueError(\"Every row must be the same length; this is not a matrix.\")\n    return (len(rows), width)","why":"Naming the first row's length gives the check and the return value one visible quantity, and any(len(r) != width for r in rows) collapses the loop into one line if you prefer it. Raising on ragged input matters because plain lists never check themselves. Current numpy does refuse np.array([[1, 2], [3]]), but only at the moment you convert, and not at all if something passed dtype=object — then you get an array of Python lists, and the failure turns up much later as a TypeError about lists rather than a complaint about shape. Checking where the data comes in puts the error next to the mistake.","trap":"Reading len(rows[0]) before checking that rows is non-empty. shape_of([]) then raises IndexError instead of returning (0, 0), and the message points at your indexing rather than at the empty input."},{"n":2,"name":"row_lengths","headline":"the axis you name is the one that disappears","mechanism":"Square every entry, add along axis 1, take the root. The squaring and the root are the magnitude from 1.1; the only new decision is the axis. You start at (n, d) and you want (n,), so the d has to go, and d is axis 1. Deriving it from the shapes like that is right every time, which is more than can be said for remembering whether axis 0 means rows.","code":"def row_lengths(X: np.ndarray) -> np.ndarray:\n    return np.sqrt(np.sum(X ** 2, axis=1))","why":"np.linalg.norm(X, axis=1) is the one-call version and the one to reach for in real code — for readability, not robustness. It does not rescale: numpy squares and sums exactly as this does, so a row of 1e-200 comes back with length 0.0 from either version, and a row of 1e200 comes back as inf. Composing square, sum and sqrt yourself once is still worth it, because exercise 6 needs that composition on a three-dimensional array.","trap":"axis=0 instead of axis=1 gives d column lengths instead of n row lengths. On a square matrix both have shape (n,), so the shape passes and only the values are wrong — [5.83, 12.65] instead of [5, 13] for the docstring example. The test's 4×3 case exists so that mistake shows up as shape (3,) where (4,) was expected."},{"n":3,"name":"centre","headline":"one row of means, broadcast down every row","mechanism":"X.mean(axis=0) collapses the rows and leaves one mean per column, shape (d,). Subtracting (d,) from (n, d) is a broadcast: lined up from the right, d matches d, and the missing left dimension is treated as 1 and stretched across all n rows. So the one row of means is applied to every row of the table, without ever being copied.","code":"def centre(X: np.ndarray) -> np.ndarray:\n    return X - X.mean(axis=0)","why":"X.mean(axis=0) and np.mean(X, axis=0) are the same call. keepdims=True would give a (1, d) row, which also broadcasts correctly, but it is not needed: a (d,) array already lines up against the columns, and the columns are where you want it. That is the contrast with exercise 4, where the reduction runs along the other axis and the result has to be turned into a column. Centring moves the data without changing its shape — every pairwise distance is identical before and after — which is why it is safe as the first step of PCA and of regression.","trap":"axis=1 gives n row means instead of d column means. Subtracting an (n,) array from (n, d) lines n up against d: a broadcast error on a rectangular table, and a silent wrong answer on a square one. It is the same family of bug as exercise 4, arriving one exercise early."},{"n":4,"name":"unit_rows","headline":"keep the axis you collapsed","mechanism":"normalise from 1.1, applied to every row at once. The row lengths are a reduction along axis 1, and keepdims=True leaves that axis in place with size 1, so the lengths come back as a column of shape (n, 1). Dividing (n, d) by (n, 1): d against 1 stretches, n against n matches, and each row is divided by its own length.","code":"def unit_rows(X: np.ndarray) -> np.ndarray:\n    lengths = np.sqrt(np.sum(X ** 2, axis=1, keepdims=True))\n    if np.any(lengths == 0):\n        raise ValueError(\"A row of length zero has no direction to keep.\")\n    return X / lengths","why":"Inserting the axis after the fact — row_lengths(X)[:, np.newaxis] — is exactly equivalent: the same column axis, added after the reduction instead of kept during it. Reaching for it is a good sign, because it means the fix came from understanding what was wrong with the shape rather than from remembering a keyword. If you reuse row_lengths that way, compute it once into a variable; calling it twice, once for the check and once for the division, computes every row's length twice. lengths == 0 is correct here, unlike the orthogonality test in 1.2. That test asked whether a number was approximately zero; this guard protects a division, and division only fails at exactly zero.","trap":"Dividing by the (n,) lengths from exercise 2. On a rectangular table numpy raises and names both shapes. On a square table it raises nothing and hands back plausible floats — rows of length 0.674 and 1.361 where every row should be exactly 1."},{"n":5,"name":"gram","headline":"rows on the left, columns on the right","mechanism":"@ pairs every row of the left-hand matrix with every column of the right-hand one, and each pairing is a dot product. X.T turns the rows of X into columns. So X @ X.T pairs every row of X with every row of X, and entry [i, j] is row i dotted with row j. Read the shapes: (n, d) @ (d, n) — the inner d's must match, because they are the length of the vectors being dotted, and they vanish, leaving (n, n).","code":"def gram(X: np.ndarray) -> np.ndarray:\n    return X @ X.T","why":"np.dot(X, X.T) and np.matmul(X, X.T) are the same operation for two-dimensional arrays; @ is the one to write. The result has three properties you can check in your head, and should: it is square, it equals its own transpose because row i · row j is the same number as row j · row i, and its diagonal is each row dotted with itself — its length squared. If any of those fails, the pairing went wrong.","trap":"X.T @ X instead of X @ X.T. That pairs every column with every column and gives a (d, d) matrix — a real and useful object, the shape of the covariance matrix you will meet in PCA, but not this one. On a square X the shape matches and only the values betray it; the test's 6×4 case turns it into a (4, 4) where (6, 6) was expected."},{"n":6,"name":"pairwise_distances","headline":"every pair, by inventing an axis","mechanism":"X[:, None, :] has shape (n, 1, d) and X[None, :, :] has shape (1, n, d): the same numbers, each with an empty axis in a different place. Subtracting them, broadcasting stretches both empty axes and produces (n, n, d) — every row minus every row, n² small vectors of d components each. Collapsing the last axis to lengths, with square, sum and sqrt, leaves the (n, n) distance matrix.","code":"def pairwise_distances(X: np.ndarray) -> np.ndarray:\n    diffs = X[:, None, :] - X[None, :, :]\n    return np.sqrt(np.sum(diffs ** 2, axis=-1))","why":"np.newaxis is None, and is arguably the more readable spelling. axis=-1 and axis=2 are identical for (n, d) input; -1 means \"the last axis\" and keeps meaning it if the rank ever changes. The cost is the (n, n, d) intermediate, which is d times the memory of the answer. stretch.py measures it, and walks you to the identity |a − b|² = a·a − 2(a·b) + b·b, which builds the same matrix from gram(X) and two vectors of squared row lengths and never allocates the intermediate at all.","trap":"Leaving off the square root. Squared distances rank in the same order as real ones, so a search built on them still works and the mistake can live for a long time: the diagonal is still zero and the matrix is still symmetric. Only the values are wrong — 25 where 5 should be — which is what the test's [0, 1] check catches."},{"n":7,"name":"rank_all","headline":"the whole library, one matmul","mechanism":"Normalise every row with unit_rows and normalise the query; for unit vectors the cosine is a plain dot product, so there is nothing left to divide. (n, d) @ (d,) gives (n,): the matrix-vector case of the same row-against-column pairing, one similarity per library item. np.argsort returns the positions that would sort that array ascending, so negating it puts the best first, and one comprehension turns positions into names.","code":"def rank_all(query: np.ndarray, X: np.ndarray, names: list[str]) -> list[str]:\n    query_length = np.sqrt(np.sum(query ** 2))\n    if query_length == 0:\n        raise ValueError(\"A zero query has no direction to compare against.\")\n\n    similarities = unit_rows(X) @ (query / query_length)\n    order = np.argsort(-similarities, kind=\"stable\")\n    return [names[i] for i in order]","why":"Reusing unit_rows is the point, and not for tidiness: its zero-row guard comes along for free. Recomputing the norms inline ranks ordinary input correctly but loses that guard — a zero row gets a similarity of nan and argsort quietly sorts it last, and a zero query makes every similarity nan and hands back the library in stored order as if that were a ranking. kind=\"stable\" makes the order of ties deterministic, which is index order. The default happened to keep that order in testing, but numpy does not promise it. Reversing an ascending argsort with [::-1] also works, but it reverses the order of ties as well.","trap":"Ranking by the raw dot product without normalising. Long rows win regardless of direction — the flaw 1.1 fixed, reintroduced at scale. The test rescales the library for exactly this reason, one row by 90× and another by 50×: raw dot products then put c first, and a cosine ranking must not move when a row gets longer."}],"headings":[{"step":"lesson","text":"A matrix is a stack of the vectors you already have"},{"step":"lesson","text":"Shape is the thing you check"},{"step":"lesson","text":"axis: which direction do you collapse?"},{"step":"lesson","text":"Broadcasting: the rule, and then the reason"},{"step":"lesson","text":"keepdims, and the bug that says nothing"},{"step":"lesson","text":"Transpose, and every dot product at once"},{"step":"lesson","text":"A new axis out of nothing"},{"step":"exercises","text":"Every one is checked for shape"},{"step":"exercises","text":"Build each one in stages"},{"step":"exercises","text":"What the tests check that you might not"},{"step":"exercises","text":"Then run the demo"},{"step":"exercises","text":"The stretch, if you want it"},{"step":"walkthrough","text":"1 — shape_of, and why you write it by hand once"},{"step":"walkthrough","text":"2 — row_lengths, and the axis rule"},{"step":"walkthrough","text":"3 — centre, and your first real broadcast"},{"step":"walkthrough","text":"4 — unit_rows, and the bug that says nothing"},{"step":"walkthrough","text":"5 — gram, and reading a matmul by its shapes"},{"step":"walkthrough","text":"6 — pairwise_distances, and the cost of elegance"},{"step":"walkthrough","text":"7 — rank_all, and what you have actually built"},{"step":"closeout","text":"You are done when"},{"step":"closeout","text":"Write your notes"},{"step":"resources","text":"Watch and read"},{"step":"resources","text":"Reference, when you hit it"},{"step":"resources","text":"After the exercises pass"},{"step":"resources","text":"Deliberately not yet"}]},{"id":"1.4","title":"Matrices as transformations","summary":"Matrix multiplication as a function that moves space. This is the one that makes neural networks click.","status":"available","written":true,"exercises":[{"name":"combine_columns","summary":"a matrix times a vector, read as columns","optional":false,"forbids":["no numpy"]},{"name":"transform","summary":"move every row of your data at once","optional":false,"forbids":["no loops"]},{"name":"basis_images","summary":"where do the basis vectors land?","optional":false,"forbids":["no loops"]},{"name":"is_linear","summary":"is this function secretly a matrix?","optional":false,"forbids":["no loops"]},{"name":"rotation","summary":"build a rotation out of where the basis lands","optional":false,"forbids":["no loops"]},{"name":"compose","summary":"one matrix that does both, in order","optional":false,"forbids":["no loops"]},{"name":"forward","summary":"the payoff: a stack of layers, which is most of a network","optional":false,"forbids":[]}],"dir":"lessons/01-foundations/04-transformations","watch":{"before":[{"title":"3Blue1Brown — ch. 3, “Linear transformations and matrices”","length":"~11 min","why":"1.3 warned you this video was describing something else. This is the something else. One sentence to take away: the columns are where the basis vectors land.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},{"title":"3Blue1Brown — ch. 4, “Matrix multiplication as composition”","length":"~10 min","why":"Watch it before exercise 6 rather than after. Doing one transformation and then another is itself a transformation, and the order of the product reads backwards from the order of the actions.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"}],"after":{"title":"3Blue1Brown — “But what is a neural network?”","length":"~19 min","why":"Only once exercise 7 passes. The circles and arrows are a matrix, a bias and a squashing function — and you will have written two of the three.","url":"https://www.3blue1brown.com/topics/neural-networks"}},"headings":[{"step":"lesson","text":"The same numbers, a different question"},{"step":"lesson","text":"A matrix takes a vector and gives back a vector"},{"step":"lesson","text":"Where the basis vectors land"},{"step":"lesson","text":"Rows and columns: the convention clash"},{"step":"lesson","text":"What \"linear\" actually means"},{"step":"lesson","text":"Decide where the basis goes, and the matrix writes itself"},{"step":"lesson","text":"Turning by an angle"},{"step":"lesson","text":"One after another"},{"step":"lesson","text":"Why this makes neural networks click"},{"step":"exercises","text":"The one that costs people an afternoon"},{"step":"exercises","text":"Every one is checked for shape"},{"step":"exercises","text":"What the tests check that you might not"},{"step":"exercises","text":"Build each one in stages"},{"step":"exercises","text":"Then run the demo"},{"step":"exercises","text":"The stretch, if you want it"},{"step":"walkthrough","text":"1 — combine_columns, and why it is done by hand"},{"step":"walkthrough", tatus":"planned","written":false},{"id":"3.3","title":"Backpropagation by hand","summary":"Derive it on a three-neuron network, on paper, until there is no magic left in it.","status":"planned","written":false},{"id":"3.4","title":"Build an autograd engine","summary":"The crown jewel of this phase. A computation graph, a backward pass, and everything PyTorch does, in miniature.","status":"planned","written":false},{"id":"3.5","title":"Train a network on your own engine","summary":"Your code, your gradients, a real classification problem, and a loss curve that goes down.","status":"planned","written":false},{"id":"3.6","title":"PyTorch","summary":"Tensors, autograd, nn.Module and the canonical training loop — now with nothing left to take on faith.","status":"planned","written":false},{"id":"3.7","title":"Optimisers","summary":"SGD, momentum, RMSProp, Adam — and precisely what problem each one was invented to fix.","status":"planned","written":false},{"id":"3.8","title":"Making deep networks trainable","summary":"Initialisation, vanishing and exploding gradients, batch normalisation and layer normalisation.","status":"planned","written":false},{"id":"3.9","title":"Regularisation in deep learning","summary":"Dropout, weight decay, early stopping and augmentation — keeping a large model honest.","status":"planned","written":false},{"id":"3.10","title":"Convolutional networks","summary":"Build one from scratch, understand what a filter learns, then classify real images.","status":"planned","written":false},{"id":"3.11","title":"Transfer learning","summary":"Why almost nobody trains from scratch any more, and how to fine-tune responsibly.","status":"planned","written":false},{"id":"3.12","title":"Sequence models","summary":"RNNs and LSTMs, and a precise account of why they break on long sequences.","status":"planned","written":false},{"id":"3.13","title":"Embeddings","summary":"word2vec, and representation learning as the central idea of modern artificial intelligence.","status":"planned","written":false},{"id":"3.14","title":"Training at scale","summary":"GPUs, batching, mixed precision and checkpointing — the engineering that makes big models possible.","status":"planned","written":false}]},{"id":"p4","number":4,"title":"Transformers and LLMs","subtitle":"from attention to a working GPT","blurb":"Attention derived rather than memorised, a byte-pair tokeniser you implement yourself, and a small GPT written line by line and trained on a corpus you choose.","milestone":"A working GPT you wrote yourself, generating text.","lessons":[{"id":"4.1","title":"Attention from first principles","summary":"Derived, not memorised. Queries, keys and values as a solution to a problem you will feel first.","status":"planned","written":false},{"id":"4.2","title":"Self-attention and multi-head attention","summary":"Why several attention heads beat one, and how position gets encoded into an order-blind architecture.","status":"planned","written":false},{"id":"4.3","title":"The transformer block","summary":"Residual connections, normalisation, feed-forward layers, and encoder versus decoder.","status":"planned","written":false},{"id":"4.4","title":"Tokenisation","summary":"Implement byte-pair encoding, then discover why so many odd model behaviours start right here.","status":"planned","written":false},{"id":"4.5","title":"Build GPT from scratch","summary":"The full architecture, written line by line and trained on a small corpus until it generates text.","status":"planned","written":false},{"id":"4.6","title":"Pretraining and scaling laws","summary":"What 'emergence' does and does not mean, and how compute, data and parameters trade off.","status":"planned","written":false},{"id":"4.7","title":"Fine-tuning","summary":"Full fine-tuning, LoRA and PEFT, and instruction tuning — adapting a model you did not train.","status":"planned","written":false},{"id":"4.8","title":"Alignment","summary":"RLHF and DPO: how a text predictor becomes something you can h
