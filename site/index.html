.btn-quiet {
  appearance: none; border: 1px solid var(--rule-firm); background: var(--paper);
  color: var(--ink-2); border-radius: 8px; font-family: var(--f-body); font-size: 13px;
  font-weight: 500; padding: 9px 14px; cursor: pointer; transition: color .15s, border-color .15s;
}
.btn-quiet:hover { color: var(--ink); border-color: var(--ink-3); }
.btn-quiet.ok { color: var(--done); border-color: var(--done); }
.btn-danger {
  appearance: none; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
  background: none; color: var(--danger); border-radius: 8px; font-family: var(--f-body);
  font-size: 13px; font-weight: 500; padding: 9px 14px; cursor: pointer; transition: background .15s;
}
.btn-danger:hover { background: var(--danger-wash); }

.confirm {
  margin-top: 14px; padding: 15px 17px; border-radius: 9px; background: var(--danger-wash);
  border: 1px solid color-mix(in srgb, var(--danger) 36%, transparent);
}
.confirm p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
.confirm b { font-weight: 600; }
.confirm-row { display: flex; gap: 10px; margin-top: 13px; flex-wrap: wrap; }
.btn-yes {
  appearance: none; border: 0; background: var(--danger); color: var(--on-accent);
  border-radius: 7px; font-family: var(--f-body); font-size: 12.5px; font-weight: 600;
  padding: 8px 13px; cursor: pointer;
}
.btn-no {
  appearance: none; border: 1px solid var(--rule-firm); background: var(--surface);
  color: var(--ink-2); border-radius: 7px; font-family: var(--f-body); font-size: 12.5px;
  font-weight: 500; padding: 8px 13px; cursor: pointer;
}

.keys {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px;
  margin-top: 12px; background: var(--rule); border: 1px solid var(--rule);
  border-radius: 11px; overflow: hidden;
}
.keyrow { background: var(--surface); padding: 13px 16px; display: flex; gap: 11px; align-items: center; }
.keyrow kbd {
  font-family: var(--f-mono); font-size: 10.5px; border: 1px solid var(--rule-firm);
  border-radius: 4px; padding: 2px 6px; color: var(--ink-2); flex: none;
}
.keyrow span { font-size: 13.5px; color: var(--ink-2); }


/* ============================================================
   lesson
   ============================================================ */

.panel[hidden] { display: none !important; }

.prose .lead {
  font-size: 18.5px; line-height: 1.6; color: var(--ink-2);
  max-width: 62ch; margin-bottom: 1.4em;
}
.prose > .lead:first-child { margin-top: 0; }


.prose { font-size: 16.5px; line-height: 1.72; color: var(--ink); }
.prose > * + * { margin-top: 1.1em; }
.prose h2 {
  font-size: 24px; margin-top: 2.2em; padding-top: .9em;
  border-top: 1px solid var(--rule); letter-spacing: -.015em;
  scroll-margin-top: calc(var(--topbar-h) + 66px);
}
.prose h3 { font-size: 18.5px; margin-top: 1.9em; font-family: var(--f-body); font-weight: 600; }
.prose p { margin-block: 0; max-width: 66ch; }
.prose strong { font-weight: 600; }
.prose ul, .prose ol { max-width: 64ch; padding-left: 1.3em; margin-block: 0; }
.prose li + li { margin-top: .45em; }
.prose code:not(pre code) {
  font-size: .875em; background: var(--surface-2); padding: 1.5px 5px;
  border-radius: 4px; border: 1px solid var(--rule); color: var(--accent-ink);
}
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 2.2em 0; }

pre {
  margin: 0; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 10px; padding: 15px 17px; overflow-x: auto;
  font-size: 13.5px; line-height: 1.62; box-shadow: var(--shadow-sm);
}
pre code { font-family: var(--f-mono); color: var(--ink); background: none; }
.codeblock { margin-top: 1.2em; }
.codeblock .cap {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: .05em; text-transform: uppercase; margin-bottom: 7px;
}

.hljs-keyword, .hljs-built_in { color: var(--accent-ink); font-weight: 500; }
.hljs-string, .hljs-meta .hljs-string { color: var(--done); }
.hljs-number, .hljs-literal { color: var(--active); }
.hljs-comment { color: var(--ink-3); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--ink); font-weight: 600; }
.hljs-params { color: var(--ink-2); }
.hljs-attr, .hljs-variable { color: var(--ink); }

.tablewrap { overflow-x: auto; margin-top: 1.3em; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 15px; border-bottom: 1px solid var(--rule); }
th { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 500; background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.callout {
  margin-top: 1.4em; padding: 16px 19px; border-radius: 10px;
  background: var(--active-wash); border: 1px solid color-mix(in srgb, var(--active) 30%, transparent);
  font-size: 15px; line-height: 1.62;
}
.callout .lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--active); display: block; margin-bottom: 5px; font-weight: 600; }
.callout p { margin: 0; max-width: 64ch; }
.callout p + p { margin-top: .7em; }

.figure {
  margin-top: 1.3em; padding: 18px 20px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--rule); overflow-x: auto;
  box-shadow: var(--shadow-sm);
}
.figure pre { border: 0; padding: 0; background: none; box-shadow: none; font-size: 13.5px; color: var(--ink-2); }

.placeholder {
  margin-top: 26px; padding: 30px 28px; border-radius: 12px;
  border: 1px dashed var(--rule-firm); background: var(--surface);
  display: flex; flex-direction: column; gap: 12px;
}
.placeholder h3 { font-family: var(--f-body); font-size: 15px; font-weight: 600; }
.placeholder p { margin: 0; color: var(--ink-2); font-size: 14.5px; max-width: 60ch; }

.foot { margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-3); display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: 0; padding: 5px 0; font: inherit; color: var(--ink-3); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:hover { color: var(--ink-2); }

/* ============================================================
   interactive widgets
   ============================================================ */
.widget {
  margin-top: 1.6em;
  border: 1px solid var(--rule); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow);
  overflow: hidden;
}
.widget-head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.widget-head .wt { font-family: var(--f-body); font-size: 13.5px; font-weight: 600; }
.widget-head .wh { font-size: 12.5px; color: var(--ink-3); }
.widget-body { padding: 18px; }
.widget-foot {
  padding: 12px 18px; border-top: 1px solid var(--rule);
  font-size: 13.5px; color: var(--ink-2); line-height: 1.55;
}
.widget-foot b { color: var(--ink); font-weight: 600; }

.ctrls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.pill {
  appearance: none; font-family: var(--f-mono); font-size: 11.5px;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--rule-firm); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; transition: all .15s;
}
.pill:hover { color: var(--ink); border-color: var(--ink-3); }
.pill.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.ctrl-label { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }

/* vector lab */
.veclab { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 22px; align-items: start; }
.veclab svg { width: 100%; height: auto; display: block; touch-action: none; }
.vec-handle { cursor: grab; }
.vec-handle:active { cursor: grabbing; }

/* SVG is themed with classes, not var() in presentation attributes,
   which browsers do not reliably resolve. */
.veclab .g-line { stroke: var(--rule); stroke-width: 1; }
.veclab .g-axis { stroke: var(--rule-firm); stroke-width: 1.5; }
.veclab .g-arc  { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 3 3; }
.veclab .ln-a { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.veclab .ln-b { stroke: var(--active); stroke-width: 2.5; stroke-linecap: round; }
.veclab .fl-a { fill: var(--accent); }
.veclab .fl-b { fill: var(--active); }
.veclab .grip { stroke: var(--surface); stroke-width: 2.5; }
.veclab .vtag { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }

.readouts { display: flex; flex-direction: column; gap: 10px; }
.ro {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 9px 12px; border-radius: 8px; background: var(--surface-2);
  border: 1px solid var(--rule);
}
.ro .k { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.ro .v { font-family: var(--f-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ro.hero-ro { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.ro.hero-ro .v { font-size: 21px; color: var(--accent-ink); }
.ro.hero-ro .k { color: var(--accent-ink); }
.ro .v.pos { color: var(--done); }
.ro .v.neg { color: var(--active); }

/* step-through */
.grid-steps { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.srow { display: flex; align-items: center; gap: 6px; }
.srow .rlab { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); width: 62px; flex: none; text-align: right; padding-right: 6px; }
.cell {
  width: 52px; height: 40px; flex: none; display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums;
  border: 1px solid var(--rule); border-radius: 7px; background: var(--surface-2);
  color: var(--ink-2); transition: all .2s;
}
.cell.live { border-color: var(--accent); background: var(--accent-wash); color: var(--accent-ink); font-weight: 600; }
.cell.settled { color: var(--ink); }
.cell.blank { color: var(--rule-firm); }
.op { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); width: 14px; text-align: center; flex: none; }
.total-line {
  margin-top: 14px; padding: 12px 15px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--rule);
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.total-line .lbl { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
.total-line .eq { font-family: var(--f-mono); font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.total-line .sum { font-family: var(--f-mono); font-size: 20px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: auto; }

/* search demo */
.searchgrid { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 22px; align-items: start; }
.sliders { display: flex; flex-direction: column; gap: 13px; }
.slider-row { display: flex; flex-direction: column; gap: 5px; }
.slider-row .top { display: flex; justify-content: space-between; align-items: baseline; }
.slider-row .nm { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.slider-row .vl { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

.results { display: flex; flex-direction: column; gap: 5px; }
.result {
  display: grid; grid-template-columns: minmax(0, 1fr) 58px; gap: 10px;
  align-items: center; padding: 7px 10px; border-radius: 8px;
  border: 1px solid transparent; transition: all .2s;
}
.result.top { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.result .nm { font-size: 13.5px; color: var(--ink-2); }
.result.top .nm { color: var(--ink); font-weight: 600; }
.result .track { height: 5px; border-radius: 3px; background: var(--rule); margin-top: 5px; overflow: hidden; }
.result .track > i { display: block; height: 100%; background: var(--ink-3); border-radius: 3px; transition: width .25s; }
.result.top .track > i { background: var(--accent); }
.result .sc { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-3); text-align: right; }
.result.top .sc { color: var(--accent-ink); font-weight: 600; }

/* static diagrams */
figure { margin: 1.6em 0 0; }
figure svg { width: 100%; height: auto; display: block; color: var(--ink-2); }
figcaption {
  margin-top: 10px; font-size: 13.5px; color: var(--ink-3); line-height: 1.55;
  max-width: 64ch;
}
.diagram {
  padding: 20px; border: 1px solid var(--rule); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow-sm); overflow-x: auto;
}
.diagram .box { fill: var(--surface-2); stroke: currentColor; stroke-width: 1; }
.diagram .box-hl { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
.diagram .lbl { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; }
.diagram .lbl-sm { fill: var(--ink-3); font-family: var(--f-mono); font-size: 10.5px; }
.diagram .lbl-hl { fill: var(--accent-ink); font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.diagram .head { fill: var(--ink); font-family: var(--f-body); font-size: 13px; font-weight: 600; }
.diagram .conn { stroke: currentColor; stroke-width: 1; fill: none; }
.diagram .conn-hl { stroke: var(--accent); stroke-width: 1.5; fill: none; }
.diagram .arrowfill { fill: currentColor; }
.diagram .sep { stroke: var(--rule); stroke-width: 1; }

/* ============================================================
   responsive
   ============================================================ */
.railtoggle { display: none; }
@media (max-width: 1080px) {
  .veclab, .searchgrid { grid-template-columns: minmax(0, 1fr); }
  .veclab svg { max-width: 340px; margin: 0 auto; }
}
/* Five things in the top bar, and a phone has room for three: the search
   field becomes an icon, and the tick count goes to Home. */
@media (max-width: 780px) {
  .topbar { gap: 10px; padding: 0 14px; }
  .searchbtn { padding: 0 9px; }
  .searchbtn-t, .searchbtn kbd { display: none; }
  .searchbtn-i { display: block; }
  .topstat { display: none; }
}
@media (max-width: 940px) {
  /* minmax(0, 1fr), not 1fr: a bare 1fr refuses to shrink below the widest
     thing inside it, and the step bar is wider than a phone. */
  .shell { grid-template-columns: minmax(0, 1fr); }
  .wrap { padding: 26px 20px 80px; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 14px 18px 20px; }
  .rail[hidden] { display: none !important; }
  .railtoggle { display: inline-flex; }
}
@media (max-width: 560px) {
  .prose { font-size: 16px; }
  .widget-body { padding: 14px; }
  .cell { width: 44px; height: 36px; font-size: 13px; }
  .srow .rlab { width: 48px; font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}


/* ============================================================
   solutions — collapsed by default, opening is a deliberate act
   ============================================================ */
.callout.danger {
  background: var(--danger-wash);
  border-color: color-mix(in srgb, var(--danger) 34%, transparent);
}
.callout.danger .lbl { color: var(--danger); }

.solution {
  margin-top: 12px; background: var(--surface);
  border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
}
.solution + .solution { margin-top: 8px; }
.solution > summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; font-family: var(--f-body); font-size: 14px; font-weight: 600;
  color: var(--ink-2); transition: color .15s, background .15s;
}
.solution > summary::-webkit-details-marker { display: none; }
.solution > summary::before {
  content: ""; flex: none; width: 8px; height: 8px;
  border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(-45deg); transition: transform .18s;
}
.solution > summary:hover { color: var(--ink); background: var(--surface-2); }
.solution[open] > summary { color: var(--ink); border-bottom: 1px solid var(--rule); }
.solution[open] > summary::before { transform: rotate(45deg); }
.solution > summary code { font-size: .9em; }
.solution .codeblock { margin: 14px 16px 0; }
.solution .why {
  margin: 12px 16px; font-size: 14px; line-height: 1.6;
  color: var(--ink-2); max-width: 64ch;
}



/* ============================================================
   theme toggle — the page followed the OS with no way to override
   ============================================================ */
.themetoggle {
  display: inline-flex; flex: none; padding: 2px; gap: 2px;
  border: 1px solid var(--rule-firm); border-radius: 8px; background: var(--surface);
}
.themetoggle button {
  appearance: none; border: 0; background: none; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--ink-3); padding: 5px 10px; border-radius: 6px;
  transition: background .15s, color .15s;
}
.themetoggle button:hover { color: var(--ink); }
.themetoggle button.on { background: var(--accent-wash); color: var(--accent-ink); }

/* ============================================================
   crumb bar — the lesson header
   ============================================================ */
.crumbs {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3);
}
.crumb {
  appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
  font: inherit; color: var(--accent-ink);
}
.crumb:hover { color: var(--accent); }
.crumb-sep { color: var(--rule-firm); }
.crumb-now { color: var(--ink); }



/* ============================================================
   real test results (HANDOFF step 5)
   ============================================================ */

.pastebox {
  width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--rule-firm); background: var(--surface);
  color: var(--ink); font-family: var(--f-mono); font-size: 12px; line-height: 1.5;
  resize: vertical;
}
.paste-msg { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
.paste-msg.bad { color: var(--danger); }

/* A checkbox the runner owns must not look like one you can set. */


.copybtn {
  appearance: none; flex: none; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--rule-firm); border-radius: 6px; padding: 4px 10px;
  transition: color .15s, border-color .15s;
}
.copybtn:hover { color: var(--ink); border-color: var(--ink-3); }
.copybtn.ok { color: var(--done); border-color: var(--done); }
.copybtn.warn { color: var(--active); border-color: var(--active); }

/* The command and its copy control as one chip, so it reads as a thing you take. */
.cmdchip {
  appearance: none; display: flex; align-items: center; gap: 10px; cursor: pointer;
  font-family: var(--f-mono); font-size: 12.5px; color: var(--accent-ink);
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius: 8px; padding: 10px 13px; transition: border-color .15s; flex: none;
}
.cmdchip:hover { border-color: var(--accent); }
.cmdchip .copylabel {
  font-size: 10.5px; color: var(--ink-3);
  border-left: 1px solid var(--rule); padding-left: 10px;
}
.cmdchip .copylabel.ok { color: var(--done); }
.cmdchip .copylabel.warn { color: var(--active); }

/* ============================================================
   lesson — three steps: read, implement, compare
   ============================================================ */
/* Full bleed: the header sits on --paper, the steps on a --surface band,
   and each has its own 1060px column. */
.lesson { min-width: 0; }
.lesson-head { max-width: 1060px; padding: 26px 40px 0; }
.lesson-h1 {
  font-family: var(--f-display); font-size: 36px; font-weight: 600;
  letter-spacing: -.022em; line-height: 1.14; margin: 16px 0 0;
}
.lesson-lede { font-size: 17px; line-height: 1.55; color: var(--ink-2); margin: 11px 0 0; max-width: 62ch; }

.facts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
  gap: 1px; margin-top: 20px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 11px; overflow: hidden;
}
.facts > div { background: var(--surface); padding: 12px 15px; }
.fact-k {
  display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
}
.fact-v { display: block; font-size: 13px; color: var(--ink); margin-top: 4px; line-height: 1.4; }

/* Tabs joined to the band below them: 1px of overlap, and the active one
   carries an inset top rule in accent, or --active where a gate is waiting. */
.stepper { display: flex; gap: 5px; margin-top: 24px; padding-bottom: 1px; overflow-x: auto; scrollbar-width: none; }
.stepper::-webkit-scrollbar { display: none; }
.step-btn {
  appearance: none; cursor: pointer; text-align: left; font-family: var(--f-body);
  padding: 11px 18px 13px; border-radius: 10px 10px 0 0; min-width: 160px; flex: none;
  border: 1px solid var(--rule); border-bottom: 0; margin-bottom: -1px;
  background: var(--paper); color: var(--ink-3);
}
.step-btn.is-done { color: var(--done); }
.step-btn.on {
  background: var(--surface); color: var(--ink);
  border-color: var(--rule-firm); box-shadow: inset 0 2px 0 var(--accent);
}
.step-btn.on.is-warn {
  border-color: color-mix(in srgb, var(--active) 42%, transparent);
  box-shadow: inset 0 2px 0 var(--active);
}
.step-n {
  display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .07em;
  text-transform: uppercase; opacity: .8;
}
.step-label { display: block; font-size: 14.5px; font-weight: 600; margin-top: 3px; }

.lesson-band { border-top: 1px solid var(--rule); background: var(--surface); min-height: 520px; }
.lesson-inner { max-width: 1060px; padding: 32px 40px 70px; }

/* ---------- step 1: watch first ---------- */
.watch {
  border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  border-radius: 12px; overflow: hidden; background: var(--accent-wash);
}
.watch-head {
  padding: 14px 20px 13px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
}
.watch-k {
  font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--accent-ink);
}
.watch-sub { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.watch-list { display: grid; gap: 1px; background: color-mix(in srgb, var(--accent) 18%, transparent); }
.watch-row {
  background: var(--surface); padding: 15px 20px; display: flex; gap: 16px;
  align-items: flex-start; text-decoration: none; color: var(--ink);
}
.watch-row:hover { background: var(--surface-2); }
.watch-when {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; flex: none; width: 46px; padding-top: 4px;
  color: var(--accent-ink);
}
.watch-body { min-width: 0; flex: 1; }
.watch-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.watch-title { font-size: 15.5px; font-weight: 600; line-height: 1.4; color: var(--accent-ink); }
.watch-len { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); }
.watch-why { display: block; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); margin-top: 4px; max-width: 64ch; }
.watch-out { font-family: var(--f-mono); font-size: 13px; color: var(--accent); flex: none; padding-top: 3px; }
.watch-careful { padding: 13px 20px; display: flex; gap: 11px; align-items: flex-start; }
.watch-careful-k {
  font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--active); flex: none; padding-top: 3px;
}
.watch-careful p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); max-width: 68ch; }
.watch-careful b { color: var(--ink); font-weight: 600; }

/* ---------- step headers, shared ---------- */
.step-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.step-kicker {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--accent);
}
.step-h2 {
  font-family: var(--f-display); font-size: 27px; font-weight: 600;
  letter-spacing: -.018em; margin: 9px 0 0;
}
.step-lead { font-size: 16px; line-height: 1.65; color: var(--ink-2); margin: 13px 0 0; max-width: 68ch; }
.cmdchip.plain { background: var(--paper); border-color: var(--rule-firm); }

/* ---------- step 2: one tick per exercise ---------- */
.exrows {
  display: grid; gap: 1px; margin-top: 20px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 11px; overflow: hidden;
}
.exrow {
  background: var(--surface); padding: 14px 18px; display: flex; gap: 13px;
  align-items: flex-start; width: 100%; border: 0; cursor: pointer;
  font-family: var(--f-body); text-align: left; transition: background .15s;
}
.exrow:hover { background: var(--surface-2); }
.exrow.is-optional { opacity: .75; }
.exbox {
  width: 19px; height: 19px; border-radius: 5px; flex: none; display: grid;
  place-items: center; font-size: 11px; margin-top: 1px; color: var(--on-accent);
  background: var(--paper); border: 1.5px solid var(--rule-firm);
}
.exrow.is-optional .exbox { border-style: dashed; }
.exrow.is-on .exbox { background: var(--done); border-color: var(--done); }
.exrow.is-runner .exbox { box-shadow: 0 0 0 2px color-mix(in srgb, var(--done) 22%, transparent); }
.exn {
  font-family: var(--f-mono); font-size: 11px; color: var(--ink-3);
  flex: none; width: 18px; text-align: right; padding-top: 2px;
}
.exbody { min-width: 0; flex: 1; text-align: left; }
.exhead { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
.exname { font-family: var(--f-mono); font-size: 13.5px; color: var(--ink); }
.exrow.is-on .exname { color: var(--ink-3); }
.exopt {
  font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-3);
  border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px;
}
.exsum { display: block; font-size: 13.5px; line-height: 1.5; color: var(--ink-3); margin-top: 3px; }
.exmsg {
  display: block; font-family: var(--f-mono); font-size: 12px; line-height: 1.5;
  color: var(--danger); margin-top: 5px; word-break: break-word;
}
.exbans {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3);
  flex: none; width: 84px; text-align: right; padding-top: 3px; line-height: 1.5;
}

.notebox {
  margin-top: 18px; padding: 16px 19px; border-radius: 11px;
  background: var(--paper); border: 1px solid var(--rule);
}
.notebox-k {
  display: block; font-family: var(--f-mono); font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
}
.notebox p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); max-width: 70ch; }
.notebox code { font-family: var(--f-mono); font-size: .9em; }
.notebox.is-active {
  background: var(--active-wash);
  border-color: color-mix(in srgb, var(--active) 30%, transparent);
}
.notebox.is-active .notebox-k { color: var(--active); }
.notebox.is-active p { color: var(--ink); font-size: 15px; }

/* One strip at the foot of every step, naming the next action. */
.stepfoot {
  display: flex; gap: 14px; align-items: center; justify-content: space-between;
  flex-wrap: wrap; margin-top: 26px; padding: 16px 19px; border-radius: 11px;
  background: var(--accent-wash);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}
.stepfoot .body { font-size: 15px; line-height: 1.5; max-width: 58ch; color: var(--ink-2); }
.stepfoot .body b { color: var(--ink); font-weight: 600; }
.stepfoot code { font-family: var(--f-mono); font-size: .9em; }
.btn-quiet {
  appearance: none; border: 1px solid var(--rule-firm); border-radius: 8px;
  background: var(--surface); color: var(--ink-2); font-family: var(--f-body);
  font-size: 13.5px; font-weight: 500; padding: 10px 16px; cursor: pointer; flex: none;
}
.btn-quiet:hover { color: var(--ink); border-color: var(--ink-3); }
.exfoot { margin: 14px 0 0; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); line-height: 1.6; }
.exfoot b { color: var(--ink-2); font-weight: 400; }

/* ---------- step 3: the gate, then one solution per exercise ---------- */
.gate { max-width: 700px; }
.gate p { margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: var(--ink-2); max-width: 66ch; }
.gate code { font-family: var(--f-mono); font-size: .9em; }
.gate-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.gate-foot { margin-top: 16px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }

.solutions { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
.solution-card {
  border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--paper);
}
.sol-head { padding: 16px 20px 15px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.sol-top { display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap; }
.sol-n {
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--accent-ink);
  background: var(--accent-wash); border-radius: 5px; padding: 3px 7px; flex: none;
}
.sol-name { font-family: var(--f-mono); font-size: 14.5px; font-weight: 500; color: var(--ink); }
.sol-headline { font-size: 14px; color: var(--ink-3); line-height: 1.45; }
.sol-tick {
  margin-left: auto; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .05em;
  text-transform: uppercase; color: var(--done);
  background: color-mix(in srgb, var(--done) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--done) 32%, transparent);
  border-radius: 5px; padding: 3px 7px; flex: none;
}
.sol-mech { margin: 11px 0 0; font-size: 15px; line-height: 1.65; color: var(--ink-2); max-width: 66ch; }
.sol-trap {
  margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--danger); max-width: 66ch;
  padding-left: 13px; border-left: 2px solid color-mix(in srgb, var(--danger) 45%, transparent);
}
.sol-toggle {
  appearance: none; border: 0; width: 100%; text-align: left; cursor: pointer;
  padding: 11px 20px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em;
  color: var(--accent-ink); background: var(--paper);
}
.sol-toggle[aria-expanded="true"] { color: var(--ink-2); background: var(--surface-2); }
.solution-card pre {
  margin: 0; padding: 17px 20px; font-family: var(--f-mono); font-size: 12.5px;
  line-height: 1.75; overflow-x: auto; color: var(--ink); border-top: 1px solid var(--rule);
}
.sol-why { padding: 14px 20px 16px; border-top: 1px solid var(--rule); background: var(--surface); }
.sol-why-k {
  display: block; font-family: var(--f-mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
}
.sol-why p { margin: 0; font-size: 14.5px; line-height: 1.65; color: var(--ink-2); max-width: 68ch; }

.lesson-foot {
  margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: 12px; color: var(--ink-3);
}
.lesson-foot .linkbtn { font-family: inherit; font-size: inherit; }
.lesson-foot .is-end { color: var(--rule-firm); }

/* The closing questions ride at the end of Compare: the design has no fourth
   step, and they are the last thing you do before the next lesson. */
.closeout { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--rule); }
.checkq { max-width: 64ch; padding-left: 1.3em; }
.checkq li + li { margin-top: .55em; }

/* ---------- step 1 reads in two columns ---------- */
.step1 { display: grid; grid-template-columns: minmax(0, 1fr) 196px; gap: 40px; align-items: start; }
.step1-main { min-width: 0; }
.step-side-inner { position: sticky; top: 70px; }
.side-k {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
  padding-bottom: 9px; border-bottom: 1px solid var(--rule);
}
.side-body + .side-k, .side-toc + .side-k, .side-after + .side-k { padding-top: 22px; }
.side-toc { display: flex; flex-direction: column; gap: 1px; margin-top: 9px; }
.side-link {
  appearance: none; border: 0; background: none; cursor: pointer; text-align: left;
  font-family: var(--f-body); font-size: 12.5px; line-height: 1.4; color: var(--ink-3);
  padding: 5px 10px; border-left: 2px solid transparent;
}
.side-link:hover { color: var(--ink-2); }
.side-link.on { color: var(--accent-ink); font-weight: 500; border-left-color: var(--accent); }
.side-body { font-size: 12.5px; line-height: 1.55; color: var(--ink-2); margin: 10px 0 0; }
.side-after { display: block; margin-top: 10px; text-decoration: none; }
.side-after-t { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.4; color: var(--accent-ink); }
.side-after-l { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); margin-top: 3px; }
.side-after-w { display: block; font-size: 11.5px; line-height: 1.5; color: var(--ink-2); margin-top: 5px; }

.resources-foot {
  margin-top: 26px; border: 1px solid var(--rule); border-radius: 11px;
  background: var(--surface); overflow: hidden;
}
.resources-foot > summary {
  cursor: pointer; list-style: none; padding: 14px 18px;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
  display: flex; align-items: center; gap: 10px;
}
.resources-foot > summary::-webkit-details-marker { display: none; }
.resources-foot > summary::before {
  content: ""; width: 8px; height: 8px; flex: none;
  border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(-45deg); transition: transform .18s;
}
.resources-foot[open] > summary::before { transform: rotate(45deg); }
.resources-foot[open] > summary { border-bottom: 1px solid var(--rule); color: var(--ink); }
.resources-body { padding: 4px 18px 18px; }

@media (max-width: 1080px) {
  .step1 { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .step-side-inner { position: static; }
}
@media (max-width: 720px) {
  .lesson-head { padding: 22px 20px 0; }
  .lesson-inner { padding: 26px 20px 60px; }
}

   search palette (HANDOFF step 8)

{"phases":[{"id":"p1","number":1,"title":"Foundations","subtitle":"the maths, built in code","blurb":"All of machine learning stands on four ideas: vectors, matrix multiplication, the derivative, and probability. Learn these properly and the rest of the field is recombination. We learn them by writing them, not by reading proofs.","milestone":"Minimise a function you have never seen before, from scratch, and explain every line.","lessons":[{"id":"1.1","title":"Vectors and the dot product","summary":"Python and NumPy essentials, what a vector really is, and the single operation that everything else is built from.","status":"available","written":true,"exercises":[{"name":"dot_loop","summary":"the dot product, by hand","optional":false,"forbids":["no numpy","no sum()"]},{"name":"dot_numpy","summary":"the same thing, vectorised","optional":false,"forbids":["no loops"]},{"name":"magnitude_loop","summary":"magnitude, by hand","optional":false,"forbids":["no numpy"]},{"name":"magnitude","summary":"magnitude, vectorised","optional":false,"forbids":["no loops"]},{"name":"normalise","summary":"normalise","optional":false,"forbids":[]},{"name":"cosine_similarity","summary":"cosine similarity","optional":false,"forbids":[]},{"name":"most_similar","summary":"the payoff: a two-line search engine","optional":false,"forbids":[]}],"dir":"lessons/01-foundations/01-vectors","watch":{"before":[{"title":"3Blue1Brown — Essence of Linear Algebra, ch. 1 “Vectors”","length":"~10 min","why":"The geometric picture, animated far better than the demo below. Watch for the three views of a vector; you already have the CS one.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},{"title":"ch. 2 — Linear combinations, span, and basis vectors","length":"~10 min","why":"Why the numbers in a vector are coordinates rather than just values. Pays off in 1.4, and hugely in 2.12.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},{"title":"Keith Galli — Complete Python NumPy Tutorial","length":"~1 hr","why":"Purely practical. Type along with the notebook. You can stop after reshaping.","url":"https://github.com/KeithGalli/NumPy"}],"after":{"title":"ch. 9 — Dot products and duality","length":"~14 min","why":"Only once your code passes. The second half, on duality, is genuinely hard and not needed yet — losing the thread there is expected.","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"}},"solutions":[{"n":1,"name":"dot_loop","headline":"the definition as an algorithm","mechanism":"Walk both lists together, multiply each pair, accumulate. The length check matters because the operation is undefined for mismatched lengths — there is no sensible answer, so failing loudly beats guessing.","code":"def dot_loop(a: list[float], b: list[float]) -> float:\n    if len(a) != len(b):\n        raise ValueError(\"The lengths of the two lists must be equal.\")\n\n    total = 0.0\n    for i in range(len(a)):\n        total += a[i] * b[i]\n    return total","why":"The accumulator starts at 0.0 rather than 0 so the return type is a float even for integer inputs. Indexing with range(len(a)) is the one place in this lesson where an index is genuinely needed — you are walking two lists in step."},{"n":2,"name":"dot_numpy","headline":"the same result, loop pushed into C","mechanism":"np.dot and np.matmul (also spelled @) agree for 1-D inputs and diverge only in higher dimensions: np.dot sums over the last axis of one and the second-to-last of the other, while matmul broadcasts stacks of matrices. For two vectors, either is right.","code":"def dot_numpy(a: np.ndarray, b: np.ndarray) -> float:\n    return float(np.dot(a, b))","why":"The float() matters more than it looks: without it you return np.float64, which behaves almost like a Python float right up until it does not — it will not JSON-serialise, and it leaks numpy semantics into code that expected a plain number."},{"n":3,"name":"magnitude_loop","headline":"Pythagoras, nothing more","mechanism":"The length of [3, 4] is the hypotenuse of a right triangle with legs 3 and 4. Squaring removes signs so direction cannot cancel length out; the root brings the answer back to the original units.","code":"def magnitude_loop(v: list[float]) -> float:\n    squared = [x ** 2 for x in v]\n    return math.sqrt(sum(squared))","why":"A comprehension plus sum() is idiomatic Python and allowed here — exercise 1 already proved you can accumulate by hand, and the point of this one is Pythagoras. Using a generator, sum(x ** 2 for x in v), is marginally better for very long inputs since it never materialises the intermediate list."},{"n":4,"name":"magnitude","headline":"the same sum, vectorised","mechanism":"square, sum, sqrt — composed into a single expression. Nothing about this changes when the vector has 4096 components instead of two, which is why two-dimensional intuition is worth building.","code":"def magnitude(v: np.ndarray) -> float:\n    return float(np.sqrt(np.sum(np.square(v))))","why":"np.linalg.norm(v) does the same job in one call and is what you would reach for in real code. Write it out at least once, though — seeing square, sum and sqrt compose is where the vectorised style starts to feel natural. Neither version survives extreme inputs: both overflow to inf around 1e200, because both square before summing.","trap":"Both versions overflow to inf around 1e200 — squaring before summing is the reason."},{"n":5,"name":"normalise","headline":"keep the direction, throw away the length","mechanism":"Dividing a vector by its own magnitude leaves it pointing exactly where it was, with length precisely 1. Every such vector lands on the unit circle. The zero vector is the one case with no answer: no direction to preserve, and the division would be by zero.","code":"def normalise(v: np.ndarray) -> np.ndarray:\n    length = magnitude(v)\n    if length == 0:\n        raise ValueError(\"Cannot normalise a zero vector.\")\n    return v / length","why":"Calling magnitude(v) rather than rewriting the formula gives you one source of truth. Naming the local `length` and not `magnitude` matters — a local of the same name shadows the function, and the next person to add a second call inside this function gets a confusing TypeError."},{"n":6,"name":"cosine_similarity","headline":"why the division works","mechanism":"One identity sits underneath the whole exercise: a · b = |a| × |b| × cos θ. The dot product was never purely about agreement — it is agreement scaled by both lengths. Divide both sides by |a| × |b| and the lengths cancel, leaving the angle alone. You are not inventing a metric; you are rearranging an identity to isolate what you actually wanted.","code":"def cosine_similarity(a: np.ndarray, b: np.ndarray) -> float:\n    a_magnitude = magnitude(a)\n    b_magnitude = magnitude(b)\n    if a_magnitude == 0 or b_magnitude == 0:\n        raise ValueError(\"Cannot compute cosine similarity with a zero vector.\")\n    return float(np.dot(a, b) / (a_magnitude * b_magnitude))","why":"np.dot(normalise(a), normalise(b)) is equally correct and returns the identical value bit for bit — shorter, and it inherits the zero-vector check from normalise for free. The version above was chosen only because it mirrors the formula in the docstring. The zero check is not required by the tests, but the cosine of an angle with a directionless vector is genuinely undefined, so raising beats returning a made-up number.","trap":"Calling normalise where you meant magnitude gives you an array where a scalar belongs — then `if array == 0` raises “the truth value of an array with more than one element is ambiguous”."},{"n":7,"name":"most_similar","headline":"search, and the version you have not written yet","mechanism":"Short, because exercise 6 did the work. Iterating a dict yields its keys, and key= changes what gets compared, not what gets returned — so the comparison runs over scores while the return value is a name.","code":"def most_similar(query: np.ndarray, library: dict[str, np.ndarray]) -> str:\n    scores = {name: cosine_similarity(query, vector) for name, vector in library.items()}\n    return max(scores, key=scores.get)","why":"This is the definition, not the implementation. Stacking the library into a matrix and running L @ q scores everything in a single call — identical arithmetic, one operation instead of n. That is what a vector database actually runs over millions of rows, and it is what stretch.py asks for.","trap":"max(scores.values()) hands you 0.998 with no way back to which item earned it."}],"headings":[{"step":"lesson","text":"Why we start here"},{"step":"lesson","text":"The Python you need"},{"step":"lesson","text":"A vector is a list of numbers"},{"step":"lesson","text":"The dot product"},{"step":"lesson","text":"The flaw, and the fix"},{"step":"lesson","text":"Why NumPy exists"},{"step":"exercises","text":"What the file looks like"},{"step":"exercises","text":"Then run the benchmark"},{"step":"exercises","text":"Optional: the stretch"},{"step":"exercises","text":"Solutions"},{"step":"walkthrough","text":"Exercise walkthrough"},{"step":"closeout","text":"You are done when"},{"step":"closeout","text":"Write your notes"},{"step":"resources","text":"What to watch"}]},{"id":"1.2","title":"Vector geometry","summary":"Length, distance, angle, cosine similarity, projection. Why 'similarity' turns out to be a geometry problem.","status":"planned","written":false},{"id":"1.3","title":"Matrices as data","summary":"Shape, indexing, slicing, broadcasting, transpose. Thinking in two dimensions without loops.","status":"planned","written":false},{"id":"1.4","title":"Matrices as transformations","summary":"Matrix multiplication as a function that moves space. This is the one that makes neural networks click.","status":"planned","written":false},{"id":"1.5","title":"Systems, inverses, and rank","summary":"Solving Ax = b, the cases where you cannot, and what 'singular' actually means.","status":"planned","written":false},{"id":"1.6","title":"Functions and slopes","summary":"The derivative discovered numerically, in code, before a single symbol of calculus notation.","status":"planned","written":false},{"id":"1.7","title":"Derivative rules","summary":"Power, product and quotient rules — and the handful of derivatives you will actually reuse forever.","status":"planned","written":false},{"id":"1.8","title":"The chain rule","summary":"The most important single fact in deep learning. Backpropagation is the chain rule and nothing more.","status":"planned","written":false},{"id":"1.9","title":"Partial derivatives and the gradient","summary":"Calculus in many dimensions, and what it means to point downhill in 4096-dimensional space.","status":"planned","written":false},{"id":"1.10","title":"Gradient descent","summary":"Implement it, watch it converge, then deliberately break it and learn why it diverged.","status":"planned","written":false},{"id":"1.11","title":"Probability I","summary":"Random variables, distributions, expectation and variance — the language uncertainty is written in.","status":"planned","written":false},{"id":"1.12","title":"Probability II","summary":"Bayes' theorem, likelihood, and the derivation of where loss functions actually come from.","status":"planned","written":false},{"id":"1.13","title":"The statistics you need","summary":"The normal distribution, sampling, correlation, and the traps that catch practitioners.","status":"planned","written":false}]},{"id":"p2","number":2,"title":"Classical Machine Learning","subtitle":"where every core concept is easiest to see","blurb":"Most industry ML is still this. It is also where loss, overfitting, evaluation and regularisation are visible in two dimensions, before deep learning hides them behind a billion parameters.","milestone":"Take a raw, messy CSV to a validated and honestly-evaluated model, and defend every choice you made.","lessons":[{"id":"2.1","title":"What 'learning' actually is","summary":"The universal recipe underneath every model in this repository: data, model, loss, optimiser.","status":"planned","written":false},{"id":"2.2","title":"Linear regression from scratch","summary":"Both routes: the closed-form solution, and gradient descent. Then why anyone bothers with the second.","status":"planned","written":false},{"id":"2.3","title":"Making training work","summary":"Feature scaling, learning rates, and how to debug a model that will not converge.","status":"planned","written":false},{"id":"2.4","title":"Logistic regression","summary":"The sigmoid, decision boundaries, and cross-entropy loss — classification from first principles.","status":"planned","written":false},{"id":"2.5","title":"Overfitting and the bias-variance tradeoff","summary":"Train/validation/test, cross-validation, and why your model looked brilliant right up until it shipped.","status":"planned","written":false},{"id":"2.6","title":"Regularisation","summary":"L1 and L2, and a real intuition for why penalising large weights makes a model generalise.","status":"planned","written":false},{"id":"2.7","title":"Evaluation","summary":"Accuracy is a trap. Precision, recall, F1, ROC-AUC and confusion matrices, and when each one lies.","status":"planned","written":false},{"id":"2.8","title":"scikit-learn","summary":"Now that you have built it by hand, learn the tool everyone actually uses.","status":"planned","written":false},{"id":"2.9","title":"Trees, forests, and gradient boosting","summary":"Decision trees to random forests to XGBoost and LightGBM — still the champions on tabular data.","status":"planned","written":false},{"id":"2.10","title":"Feature engineering","summary":"Encoding, missing data, and data leakage — the number one bug in real-world machine learning.","status":"planned","written":false},{"id":"2.11","title":"Clustering","summary":"k-means, hierarchical clustering and DBSCAN: finding structure with no labels at all.","status":"planned","written":false},{"id":"2.12","title":"PCA and dimensionality reduction","summary":"Where the linear algebra from Phase 1 pays off spectacularly, and eigenvectors finally earn their keep.","status":"planned","written":false},{"id":"2.13","title":"Capstone: end to end","summary":"A real, messy dataset from raw file to evaluated model, with every decision written down and justified.","status":"planned","written":false}]},{"id":"p3","number":3,"title":"Deep Learning","subtitle":"build the engine before you drive it","blurb":"You will write your own automatic differentiation engine — roughly 150 lines that explain the whole of PyTorch — and train a network on it before touching a framework.","milestone":"An autograd engine you wrote yourself, training a network you designed yourself.","lessons":[{"id":"3.1","title":"The perceptron, and why linear models fail","summary":"XOR: the four data points that stalled an entire field for a decade.","status":"planned","written":false},{"id":"3.2","title":"Multi-layer networks","summary":"Activations, hidden layers, and the universal approximation theorem in plain language.","status":"planned","written":false},{"id":"3.3","title":"Backpropagation by hand","summary":"Derive it on a three-neuron network, on paper, until there is no magic left in it.","status":"planned","written":false},{"id":"3.4","title":"Build an autograd engine","summary":"The crown jewel of this phase. A computation graph, a backward pass, and everything PyTorch does, in miniature.","status":"planned","written":false},{"id":"3.5","title":"Train a network on your own engine","summary":"Your code, your gradients, a real classification problem, and a loss curve that goes down.","status":"planned","written":false},{"id":"3.6","title":"PyTorch","summary":"Tensors, autograd, nn.Module and the canonical training loop — now with nothing left to take on faith.","status":"planned","written":false},{"id":"3.7","title":"Optimisers","summary":"SGD, momentum, RMSProp, Adam — and precisely what problem each one was invented to fix.","status":"planned","written":false},{"id":"3.8","title":"Making deep networks trainable","summary":"Initialisation, vanishing and exploding gradients, batch normalisation and layer normalisation.","status":"planned","written":false},{"id":"3.9","title":"Regularisation in deep learning","summary":"Dropout, weight decay, early stopping and augmentation — keeping a large model honest.","status":"planned","written":false},{"id":"3.10","title":"Convolutional networks","summary":"Build one from scratch, understand what a filter learns, then classify real images.","status":"planned","written":false},{"id":"3.11","title":"Transfer learning","summary":"Why almost nobody trains from scratch any more, and how to fine-tune responsibly.","status":"planned","written":false},{"id":"3.12","title":"Sequence models","summary":"RNNs and LSTMs, and a precise account of why they break on long sequences.","status":"planned","written":false},{"id":"3.13","title":"Embeddings","summary":"word2vec, and representation learning as the central idea of modern artificial intelligence.","status":"planned","written":false},{"id":"3.14","title":"Training at scale","summary":"GPUs, batching, mixed precision and checkpointing — the engineering that makes big models possible.","status":"planned","written":false}]},{"id":"p4","number":4,"title":"Transformers and LLMs","subtitle":"from attention to a working GPT","blurb":"Attention derived rather than memorised, a byte-pair tokeniser you implement yourself, and a small GPT written line by line and trained on a corpus you choose.","milestone":"A working GPT you wrote yourself, generating text.","lessons":[{"id":"4.1","title":"Attention from first principles","summary":"Derived, not memorised. Queries, keys and values as a solution to a problem you will feel first.","status":"planned","written":false},{"id":"4.2","title":"Self-attention and multi-head attention","summary":"Why several attention heads beat one, and how position gets encoded into an order-blind architecture.","status":"planned","written":false},{"id":"4.3","title":"The transformer block","summary":"Residual connections, normalisation, feed-forward layers, and encoder versus decoder.","status":"planned","written":false},{"id":"4.4","title":"Tokenisation","summary":"Implement byte-pair encoding, then discover why so many odd model behaviours start right here.","status":"planned","written":false},{"id":"4.5","title":"Build GPT from scratch","summary":"The full architecture, written line by line and trained on a small corpus until it generates text.","status":"planned","written":false},{"id":"4.6","title":"Pretraining and scaling laws","summary":"What 'emergence' does and does not mean, and how compute, data and parameters trade off.","status":"planned","written":false},{"id":"4.7","title":"Fine-tuning","summary":"Full fine-tuning, LoRA and PEFT, and instruction tuning — adapting a model you did not train.","status":"planned","written":false},{"id":"4.8","title":"Alignment","summary":"RLHF and DPO: how a text predictor becomes something you can hold a conversation with.","status":"planned","written":false},{"id":"4.9","title":"Inference","summary":"Sampling, temperature, top-k and top-p, the KV cache, and quantisation.","status":"planned","written":false},{"id":"4.10","title":"Embeddings, vector search and RAG","summary":"Retrieval done properly rather than cargo-culted — and this is where lesson 1.1 comes back around.","status":"planned","written":false},{"id":"4.11","title":"Evaluations","summary":"The most underrated skill in applied AI, and the one that separates demos from products.","status":"planned","written":false},{"id":"4.12","title":"Agents and tool use","summary":"The current frontier: planning, tool calling, and where it genuinely does not work yet.","status":"planned","written":false}]},{"id":"p5","number":5,"title":"Production and Specialisation","subtitle":"models that survive contact with users","blurb":"A trained model is roughly ten percent of a machine learning product. This phase covers the other ninety, then you choose a direction to go deep in.","milestone":"A model you built, deployed, monitored, and can reason about when it degrades.","lessons":[{"id":"5.1","title":"Serving and inference in production","summary":"Latency, throughput, cost, batching and the tradeoffs nobody mentions in tutorials.","status":"planned","written":false},{"id":"5.2","title":"Monitoring and drift","summary":"Models decay silently. Detecting it, measuring it, and deciding when to retrain.","status":"planned","written":false},{"id":"5.3","title":"Reproducibility and experiment tracking","summary":"Versioning data, code and weights so that a result from six months ago can be rebuilt.","status":"planned","written":false}]}],"sections":{"1.1":["brief","lesson","exercises","walkthrough","closeout","resources"]},"library":[{"id":"3blue1brown-essence-of-linear-algebra","kind":"video","title":"3Blue1Brown, Essence of Linear Algebra","url":"https://www.3blue1brown.com/topics/linear-algebra","lessons":["1.1","1.2","1.4"],"phases":[1,3],"by":"Grant Sanderson","note":"Watch this before writing a single line of lesson 1.1. It gives you the picture — vectors as arrows, matrices as movements — that the code then makes real."},{"id":"3blue1brown-essence-of-calculus","kind":"video","title":"3Blue1Brown, Essence of Calculus","url":"https://www.3blue1brown.com/topics/calculus","lessons":["1.6","1.7","1.8"],"phases":[1,3],"by":"Grant Sanderson","note":"The derivative as a thing you can see rather than a rule you memorise. Everything in phase 1 about slopes and gradients assumes this picture."},{"id":"3blue1brown-neural-networks-includes-an-outs","kind":"video","title":"3Blue1Brown, Neural Networks (includes an outstanding attention/transformer series)","url":"https://www.3blue1brown.com/topics/neural-networks","lessons":[],"phases":[1,3],"by":"Grant Sanderson","note":"The clearest account of backpropagation anywhere, and the attention series at the end is the best transformer explainer that exists."},{"id":"statquest-with-josh-starmer","kind":"video","title":"StatQuest with Josh Starmer","url":"https://www.youtube.com/@statquest","lessons":[],"phases":[2],"by":"Josh Starmer","note":"Short, cheerful, and relentlessly concrete. When a classical-ML idea refuses to land, there is almost always a StatQuest that fixes it in ten minutes."},{"id":"andrej-karpathy-neural-networks-zero-to-hero","kind":"book","title":"Andrej Karpathy, Neural Networks: Zero to Hero","url":"https://karpathy.ai/zero-to-hero.html","lessons":[],"phases":[3],"by":"Andrej Karpathy","note":"Builds autograd, then a language model, from nothing, live, with every mistake left in. The closest thing to this curriculum's method on video."},{"id":"dive-into-deep-learning","kind":"book","title":"Dive into Deep Learning","url":"https://d2l.ai","lessons":[],"phases":[3],"by":"Zhang, Lipton, Li, Smola","note":"A full textbook where every equation is followed by the code that runs it. The reference to reach for when you want depth on a specific method."},{"id":"jay-alammar-the-illustrated-transformer","kind":"book","title":"Jay Alammar, The Illustrated Transformer","url":"https://jalammar.github.io/illustrated-transformer/","lessons":[],"phases":[4],"by":"Jay Alammar","note":"The diagrams most people picture when they think about transformers. Read it before the paper, not after."},{"id":"the-annotated-transformer-harvard-nlp","kind":"book","title":"The Annotated Transformer, Harvard NLP","url":"http://nlp.seas.harvard.edu/annotated-transformer/","lessons":[],"phases":[4],"by":"Harvard NLP","note":"The Attention Is All You Need paper, line by line, with working code beside each paragraph. Read it once you can already write a small model."},{"id":"sebastian-raschka-s-blog","kind":"article","title":"Sebastian Raschka's blog","url":"https://sebastianraschka.com/blog/","lessons":[],"phases":[4],"by":"Sebastian Raschka","note":"Careful, current writing on how LLMs actually work, with the benchmarks and caveats other posts leave out."},{"id":"distill-pub","kind":"interactive","title":"Distill.pub","url":"https://distill.pub","lessons":[],"phases":[3,4],"by":"Distill","note":"Interactive papers you can poke at. No longer publishing, but what is there is still the high-water mark for explaining a method visually."},{"id":"chris-olah-s-blog","kind":"article","title":"Chris Olah's blog","url":"https://colah.github.io","lessons":[],"phases":[3,4],"by":"Chris Olah","note":"The LSTM and embedding posts are ten years old and still the best first explanation of either. Start with Understanding LSTMs."},{"id":"deep-learning-goodfellow-bengio-and-courvill","kind":"book","title":"Deep Learning, Goodfellow, Bengio and Courville","url":"https://www.deeplearningbook.org","lessons":[],"phases":[3,4],"by":"Goodfellow, Bengio, Courville","note":"The standard reference. Dense, and not a first read — but when you need the formal statement of something, it is here and it is free."},{"id":"mlu-explain-amazon-s-machine-learning-univer","kind":"interactive","title":"MLU-Explain, Amazon's Machine Learning University","url":"https://mlu-explain.github.io","lessons":["2.2","2.4","2.5","2.7"],"phases":[2],"by":"Amazon MLU","note":"Short visual essays on the ideas that are easy to nod along to and hard to actually hold: bias-variance, cross-validation, ROC."},{"id":"sebastian-raschka-build-a-large-language-mod","kind":"book","title":"Sebastian Raschka, Build a Large Language Model (From Scratch)","url":"https://sebastianraschka.com/llms-from-scratch/","lessons":[],"phases":[4],"by":"Sebastian Raschka","note":"Builds a GPT end to end in PyTorch, one component per chapter. The natural sequel to this curriculum's phase 4."},{"id":"vizuara-building-llms-from-scratch","kind":"video","title":"Vizuara, Building LLMs from Scratch","url":"https://www.youtube.com/@vizuara","lessons":[]," rning.ai/specializations/machine-learning","lessons":[],"phases":[1,2],"by":"Andrew Ng, DeepLearning.AI","note":"The canonical first course. Our phase 2 covers the same ground by building it instead — useful as a second angle, not a substitute."},{"id":"nptel-artificial-intelligence-search-methods","kind":"course","title":"NPTEL, Artificial Intelligence: Search Methods for Problem Solving — Prof. Deepak Khemani, IIT Madras","url":"https://onlinecourses.nptel.ac.in/noc26_cs182/","lessons":[],"phases":[],"by":"Deepak Khemani, IIT Madras","note":"Classical AI: search, heuristics, planning. Not on the path to a neural network, and worth knowing anyway — it is the half of AI that predates it."},{"id":"keith-galli-complete-python-numpy-tutorial","kind":"video","title":"Keith Galli, Complete Python NumPy Tutorial","url":"https://github.com/KeithGalli/NumPy","lessons":["1.1"],"phases":[1],"by":"Keith Galli","note":"One sitting, and lesson 1.1 stops being about NumPy syntax and starts being about vectors. Watch it first if you have never used arrays."}]}

<h2>Why we start here</h2>

<p>Strip away every buzzword and machine learning is three claims:</p>

<ol>
  <li><strong>Anything can be turned into a list of numbers.</strong> A house, a customer, a photograph, the word "banana".</li>
  <li><strong>Once things are lists of numbers, "similar" and "different" become arithmetic</strong> — and arithmetic is something a computer does a trillion times a second.</li>
  <li><strong>A model is a large pile of numbers that you adjust until its outputs stop being wrong.</strong></li>
</ol>

<p>Phase 1 makes claims 1 and 2 concrete. Today is claim 1, plus the single operation that claim 2 rests on.</p>

<p>That operation is the <strong>dot product</strong>. To be precise about how central it is: a neuron in a neural network is a dot product followed by one simple function. Attention — the mechanism behind every modern large language model — is dot products. Semantic search is dot products. When a model has 175 billion parameters and needs a GPU cluster, what that hardware is doing, almost exclusively, is dot products.</p>

<p>There is no second idea in this field of comparable importance. You will implement it today in about four lines.</p>

<h2>The Python you need</h2>

<p>If you already program, only the deltas matter:</p>

<div class="codeblock">
<div class="cap">Python, for people who already program</div>
<pre><code class="language-python">xs = [1, 2, 3]              # list: dynamically sized, heterogeneous, indexed from 0
xs[-1]                      # 3  — negative indices count from the end
xs[0:2]                     # [1, 2] — slice, end-exclusive
len(xs)                     # 3

def f(a: list[float]) -> float:   # type hints exist but are NOT enforced.
    return a[0]                   # they are documentation; the runtime ignores them.

d = {"a": 1, "b": 2}        # dict
for k in d: ...             # iterates KEYS, not pairs
for x in xs: ...            # no index — this is the idiomatic loop
for i in range(len(xs)): .. # only when you genuinely need the index

total = 0.0                 # no declarations, no type, no semicolon
raise ValueError("nope")    # exceptions: raise, not throw</code></pre>
</div>

<p>Three gotchas that will bite you:</p>

<ul>
  <li><strong>Indentation is syntax.</strong> Four spaces. A misindented line is a different program, not a style violation.</li>
  <li><strong><code>/</code> is always float division.</strong> <code>5 / 2 == 2.5</code>. Integer division is <code>//</code>.</li>
  <li><strong><code>**</code> is exponentiation.</strong> <code>x ** 0.5</code> is a square root.</li>
</ul>

<h2>A vector is a list of numbers</h2>

<p>Genuinely — that is the whole definition. <code>[3, 4]</code> is a vector. <code>[0.2, -1.7, 0.0, 5.5]</code> is a vector. In code it is an array.</p>

<p>The word sounds intimidating because physics teaches it as "magnitude and direction, drawn as an arrow". Set the arrows aside for a moment. <strong>A vector is an ordered list of numbers where each position means something fixed.</strong></p>

<p>The interesting half is the second one — <em>each position means something fixed</em>. That is what turns a list into a representation:</p>

<div class="codeblock">
<pre><code class="language-python">house    = [1500, 3, 12]     # [square feet, bedrooms, age in years]
another  = [1600, 3, 10]
mansion  = [8000, 7,  2]</code></pre>
</div>

<p>Position 0 is <em>always</em> square footage. Position 1 is <em>always</em> bedrooms. Now these three lists are comparable, and "is this house like that house" has become a maths problem.</p>

<p>That is the entire trick, and every ML system is built on it. Deciding what goes in each position used to be a job title — <em>feature engineering</em>, covered in lesson 2.10. The revolution of deep learning is that networks now <strong>learn</strong> what the positions should mean instead of you specifying them.</p>

<p><strong>Dimensions</strong> just means "how many numbers are in the list". The house vector is 3-dimensional. Sentence embeddings in a modern LLM are typically 768 to 4096-dimensional. You cannot picture 4096 dimensions and you should stop trying — but every operation you learn in 2D works <em>identically</em> in 4096D, unchanged. That is the gift: intuition is built cheaply in two dimensions and then transfers for free.</p>

<h2>The dot product</h2>

<p>Take two vectors of the same length. Multiply them position by position. Add up the results. One number falls out.</p>

<div data-widget="dotsteps"></div>

<p>That is the entire operation. As an algorithm: <em>walk both lists together, multiply each pair, accumulate the total.</em> Exercise 1 asks you to write exactly this, with no help from NumPy.</p>

<h3>What the number means</h3>

<p>This is the part that matters, and where most people's understanding stays shallow.</p>

<p>The dot product measures <strong>agreement</strong>. Look at what happens to each term in the sum:</p>

<div class="tablewrap">
<table>
  <thead><tr><th>Signs</th><th>Contribution</th><th>Reading</th></tr></thead>
  <tbody>
    <tr><td>both positive</td><td>positive</td><td>they agree</td></tr>
    <tr><td>both negative</td><td>positive</td><td>they agree, in the other direction</td></tr>
    <tr><td>one of each</td><td>negative</td><td>they disagree</td></tr>
    <tr><td>either is zero</td><td>nothing</td><td>no opinion</td></tr>
  </tbody>
</table>
</div>

<p>So the total answers: <strong>across all these dimensions, do these two vectors tend to go the same way?</strong> This is much easier to feel than to read, so here are the arrows I told you to set aside. Drag them.</p>

<div data-widget="vectorlab"></div>

<p>The case worth pausing on is the one in the middle. A dot product of <strong>zero means "these two things have nothing to say about each other"</strong>. In geometry that is a right angle. In machine learning it is "unrelated concepts". Same fact, two vocabularies.</p>

<h3>Why this is the atom of the field</h3>

<p>A neuron in a neural network does exactly this:</p>

<div class="figure">
<pre>output = activation( inputs · weights + bias )</pre>
</div>

<p>The weights are a vector the network learned. The dot product asks <em>"how much does this input agree with the pattern I have learned to look for?"</em> A high number means "strong match — fire".</p>

<p>That is what a neuron <strong>is</strong>. Everything else in deep learning — layers, depth, attention, transformers — is about arranging billions of these agreement checks so that useful patterns emerge. When you build a network from scratch in Phase 3, you will be stacking today's function.</p>

<h2>The flaw, and the fix</h2>

<p>The dot product has a bug as a similarity measure: <strong>it is inflated by magnitude.</strong> If you pressed <span class="mono">× 2</span> in the demo above, you already saw it — the dot product doubled while the arrows did not turn at all.</p>

<div class="figure">
<pre>[1, 0] · [100, 0]  =  100
[1, 0] · [  1, 0]  =    1</pre>
</div>

<p>Both pairs point in <em>precisely</em> the same direction. The first scores 100× higher purely because one vector is bigger. If those were documents, a long document would beat a short one on every query regardless of topic. Not what you want.</p>

<p>The fix is to divide out the magnitudes. The <strong>magnitude</strong> (also called length, or norm) is Pythagoras extended to any number of dimensions — square everything, sum, take the root:</p>

<div class="figure">
<pre>|[3, 4]|  =  √(3² + 4²)  =  √25  =  5</pre>
</div>

<p>Divide the dot product by both magnitudes and you get <strong>cosine similarity</strong>:</p>

<div class="figure">
<pre>cos_sim(a, b)  =  (a · b) / (|a| × |b|)</pre>
</div>

<p>The answer is now always between −1 and 1, and magnitude is gone. Only <em>direction</em> survives:</p>

<div class="tablewrap">
<table>
  <thead><tr><th>Value</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td class="num">1.0</td><td>identical direction</td></tr>
    <tr><td class="num">0.7</td><td>strongly related</td></tr>
    <tr><td class="num">0.0</td><td>unrelated, perpendicular</td></tr>
    <tr><td class="num">−1.0</td><td>opposite</td></tr>
  </tbody>
</table>
</div>

<p>This function is how semantic search works, how RAG retrieves documents, how "customers who liked X also liked Y" works, and how a vector database ranks results. It is four lines of arithmetic, and it is exercise 6. Here it is doing the job:</p>

<div data-widget="search"></div>

<h2>Why NumPy exists</h2>

<p>Python is slow, and it is worth knowing precisely <em>why</em>, because "NumPy is optimised" is not an answer — it is a way of not having one.</p>

<p>Every value in a Python list is a full heap object carrying a type pointer and a reference count, and the list holds pointers to them. Adding two of them means following a pointer, checking a type, unboxing a number, adding, then allocating a new object for the result. NumPy stores the raw numbers side by side in one block of memory and pushes the loop into compiled C, where one instruction can operate on several values at once.</p>

<div class="codeblock">
<div class="cap">The vectorised mental model</div>
<pre><code class="language-python">import numpy as np

a = np.array([1.0, 2.0, 3.0])
b = np.array([4.0, 5.0, 6.0])

a + b        # array([5., 7., 9.])   elementwise, no loop
a * b        # array([4., 10., 18.]) elementwise multiply, NOT matrix multiply
a * 2        # array([2., 4., 6.])   the scalar broadcasts across the array
a.sum()      # 6.0
a.shape      # (3,)  — check this when confused. always.</code></pre>
</div>

<p>The mental shift, and it is a real one coming from imperative code: <strong>stop thinking "for each element, do X". Start thinking "apply X to the whole array".</strong></p>

<div class="callout">
  <span class="lbl">The most common beginner mistake</span>
  <p>Writing a Python <code>for</code> loop over a NumPy array costs roughly 200× in speed. The tests in this lesson reject it outright. Once all seven pass, run the benchmark and see the gap on your own machine.</p>

<details class="solution">
<summary>Exercise 1 — <code>dot_loop</code></summary>
<div class="codeblock">
<pre><code class="language-python">def dot_loop(a: list[float], b: list[float]) -> float:
    if len(a) != len(b):
        raise ValueError("The lengths of the two lists must be equal.")

    total = 0.0
    for i in range(len(a)):
        total += a[i] * b[i]
    return total</code></pre>
</div>
<p class="why">The accumulator starts at <code>0.0</code> rather than <code>0</code> so the return type is a float even for integer inputs. Indexing with <code>range(len(a))</code> is the one place in this lesson where an index is genuinely needed — you are walking two lists in step.</p>
</details>

<details class="solution">
<summary>Exercise 2 — <code>dot_numpy</code></summary>
<div class="codeblock">
<pre><code class="language-python">def dot_numpy(a: np.ndarray, b: np.ndarray) -> float:
    return float(np.dot(a, b))</code></pre>
</div>
<p class="why"><code>np.matmul(a, b)</code> and <code>a @ b</code> are equally correct here. They agree with <code>np.dot</code> for 1-D inputs and diverge only in higher dimensions. The <code>float()</code> matters more than it looks: without it you return <code>np.float64</code>, which behaves almost like a Python float right up until it does not — it will not JSON-serialise, and it leaks numpy semantics into code that expected a plain number.</p>
</details>

<details class="solution">
<summary>Exercise 3 — <code>magnitude_loop</code></summary>
<div class="codeblock">
<pre><code class="language-python">def magnitude_loop(v: list[float]) -> float:
    squared = [x ** 2 for x in v]
    return math.sqrt(sum(squared))</code></pre>
</div>
<p class="why">A comprehension plus <code>sum()</code> is idiomatic Python and allowed here — exercise 1 already proved you can accumulate by hand, and the point of this one is Pythagoras. <code>sum(x ** 2 for x in v)</code> using a generator instead of a list is marginally better for very long inputs, since it never materialises the intermediate list.</p>
</details>

<details class="solution">
<summary>Exercise 4 — <code>magnitude</code></summary>
<div class="codeblock">
<pre><code class="language-python">def magnitude(v: np.ndarray) -> float:
    return float(np.sqrt(np.sum(np.square(v))))</code></pre>
</div>
<p class="why"><code>np.linalg.norm(v)</code> does the same job in one call and is what you would reach for in real code. Write it out at least once, though — seeing <code>square</code>, <code>sum</code> and <code>sqrt</code> compose into a single expression is where the vectorised style starts to feel natural. Neither version survives extreme inputs: both overflow to <code>inf</code> around <code>1e200</code>, because both square before summing.</p>
</details>

<details class="solution">
<summary>Exercise 5 — <code>normalise</code></summary>
<div class="codeblock">
<pre><code class="language-python">def normalise(v: np.ndarray) -> np.ndarray:
    length = magnitude(v)
    if length == 0:
        raise ValueError("Cannot normalise a zero vector.")
    return v / length</code></pre>
</div>
<p class="why">Calling <code>magnitude(v)</code> rather than rewriting the formula gives you one source of truth. Naming the local <code>length</code> and not <code>magnitude</code> matters — a local of the same name shadows the function, and the next person to add a second call inside this function gets a confusing <code>TypeError</code>.</p>
</details>

<details class="solution">
<summary>Exercise 6 — <code>cosine_similarity</code></summary>
<div class="codeblock">
<pre><code class="language-python">def cosine_similarity(a: np.ndarray, b: np.ndarray) -> float:
    a_magnitude = magnitude(a)
    b_magnitude = magnitude(b)
    if a_magnitude == 0 or b_magnitude == 0:
        raise ValueError("Cannot compute cosine similarity with a zero vector.")
    return float(np.dot(a, b) / (a_magnitude * b_magnitude))</code></pre>
</div>
<p class="why">The zero check is not required by the tests, but the cosine of an angle with a directionless vector is genuinely undefined, so raising beats returning a made-up number.</p>
<p class="why"><code>np.dot(normalise(a), normalise(b))</code> is equally correct and returns the identical value bit for bit — the second route from the walkthrough. It is shorter and inherits the zero-vector check from <code>normalise</code> for free. The version above was chosen only because it mirrors the formula in the docstring. Watch out for the trap in between: calling <code>normalise</code> where you meant <code>magnitude</code> gives you an array where a scalar belongs, and <code>if array == 0</code> raises "the truth value of an array with more than one element is ambiguous".</p>
</details>

<details class="solution">
<summary>Exercise 7 — <code>most_similar</code></summary>
<div class="codeblock">
<pre><code class="language-python">def most_similar(query: np.ndarray, library: dict[str, np.ndarray]) -> str:
    scores = {name: cosine_similarity(query, vector) for name, vector in library.items()}
    return max(scores, key=scores.get)</code></pre>
</div>
<p class="why">Iterating a dict yields its keys, and <code>key=</code> changes what gets <em>compared</em>, not what gets <em>returned</em> — so the comparison runs over scores while the return value is a name. <code>max(scores.values())</code> would hand you <code>0.998</code> with no way back to which item earned it.</p>
<p class="why">This is the definition, not the implementation. See the Compare step, and <code>stretch.py</code>, for the single-matmul version a real system uses.</p>
</details>

</div>

<h2>Exercise walkthrough</h2>

<p>What each exercise is really asking, and how the seven fit together. This explains the <em>mechanisms</em>, not the implementations — the code is yours to write.</p>

<p>The seven come in pairs. Each pair does the same maths twice: once by hand so you own it, once vectorised so you can use it.</p>

<h3>1 and 2 — the dot product, by hand and vectorised</h3>

<p>Exercise 1 is the definition as an algorithm: walk both lists together, multiply each pair, accumulate. The stepper near the top of this page is exactly what your loop does, one iteration per click. The length check matters because the operation is <em>undefined</em> for mismatched lengths — there is no sensible answer, so failing loudly beats guessing.</p>

<p>Exercise 2 is the same result with the loop pushed into compiled C. Worth knowing: <code>np.dot</code> and <code>np.matmul</code> (also spelled <code>@</code>) agree for 1-D inputs but diverge for higher dimensions — <code>np.dot</code> sums over the last axis of one and the second-to-last of the other, while <code>matmul</code> broadcasts stacks of matrices. For two vectors, either is right.</p>

<h3>3 and 4 — magnitude is just Pythagoras</h3>
