name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate curriculum (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Every source file compiles
        run: python -m compileall -q mlfs progress.py 0*-*

      # The exercises ship unsolved on purpose, so `pytest` is expected to fail on a
      # fresh clone. CI validates the scaffolding instead: that the curriculum file is
      # well formed, that every lesson it advertises exists with the files it promises,
      # and that the dashboard runs cleanly on every supported platform.
      - name: Curriculum is consistent
        shell: python {0}
        run: |
          import json, pathlib, sys

          data = json.loads(pathlib.Path("curriculum.json").read_text(encoding="utf-8"))
          required = ["README.md", "exercises.py", "test_exercises.py", "watch.md", "notes.md"]
          seen, problems = set(), []

          for phase in data["phases"]:
              if not pathlib.Path(phase["dir"]).is_dir():
                  problems.append(f"phase {phase['id']}: missing directory {phase['dir']}")
              for lesson in phase["lessons"]:
                  lid = lesson["id"]
                  if lid in seen:
                      problems.append(f"duplicate lesson id {lid}")
                  seen.add(lid)
                  if lesson.get("status") != "available":
                      continue
                  if "dir" not in lesson:
                      problems.append(f"{lid}: status is available but no dir given")
                      continue
                  d = pathlib.Path(lesson["dir"])
                  for name in required:
                      if not (d / name).is_file():
                          problems.append(f"{lid}: missing {d / name}")

          print(f"{len(seen)} lessons across {len(data['phases'])} phases")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)

      - name: Dashboard runs
        run: python progress.py

      - name: Dashboard emits valid JSON
        shell: python {0}
        run: |
          import json, subprocess, sys
          out = subprocess.run([sys.executable, "progress.py", "--json"],
                               capture_output=True, text=True, check=True).stdout
          data = json.loads(out)
          total = sum(len(p["lessons"]) for p in data["phases"])
          print(f"ok: {total} lessons reported")
